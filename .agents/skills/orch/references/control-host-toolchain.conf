# The repository toolchain an overseer runs none of on a hosted fleet.
# [SKILL.md](../SKILL.md) § The Cycle, Item work stays in lanes, states the
# rule and what a hosted fleet is. A control-VM guard, where a fleet runs one,
# reads this one list and parses no wrapper.
#
# `command WORD` is a program named as the command word of a simple command,
# by itself or as a path ending in `/WORD`. `path PATH` is a repository script
# named by its repository-relative path. `setting KEY` is the kendex [env]
# setting whose value is a command line, run as that line. `git VERB` is a git
# subcommand whose hooks run the toolchain in a repository whose commit chain
# is armed.

command cargo
command npm
command pnpm
command yarn
command npx
command tsc
command vitest
command biome
command eslint
command next

path tools/guard
path .agents/skills/orch/scripts/dev-validate-run
path .agents/skills/orch/scripts/post-merge

setting DEV_VALIDATE_CMD
setting ORCH_POST_MERGE_CMD

git commit
git push
