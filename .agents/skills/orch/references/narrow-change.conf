# The machine-readable enumeration behind [micro.md](../workflows/micro.md)
# § Escape condition 3, which states that class in prose, plus the production
# ceilings the `micro` and `small` classes hold. The tier gate
# (scripts/item-tier), the micro run and harness-ci's `change-class` all judge
# one list.
#
# A `path` glob is matched against the whole repository-relative path with
# shell pattern rules, where `*` also crosses `/`. A glob that names nothing
# in a repository excludes nothing there.

micro_max_production=20
small_max_production=150

# Gates a merge, runs in a commit or turn hook, enforces a guard rule, or
# launches a lane.
path .github/workflows/*
path .github/actions/*
path *skills/review-gate/*
path *skills/github/scripts/*
path *skills/orch/scripts/queue-wait
path *skills/orch/scripts/approval-wait
path *hooks/*
path *skills/commit-guards/*
path tools/*
path *skills/preflight/*
path *skills/doc-limits/*
# harness-ci's scripts classify a change and aggregate the lanes a merge
# waits on; the two the measurement runs are in the boundary group too.
path *skills/harness-ci/scripts/*
# opencode has no native hook surface, so the opencode adapter renders a hook
# as an instruction file the harness loads every session; that path carries no
# `hooks/` segment and the glob above does not reach it.
path .opencode/instructions/*
# The list the fleet's control-VM PreToolUse guard reads.
path *skills/orch/references/control-host-toolchain.conf
# The secret-value pattern, written for the fleet's state gate and the
# slack package.
path *skills/orch/references/secret-value.ere
# The scripts that launch a lane.
path *skills/orch/scripts/open-terminal
path *skills/orch/scripts/lib/lane-cap.sh
path *skills/orch/scripts/lib/lane-relaunch.sh
path *skills/orch/scripts/lib/open-terminal-text.sh
path *skills/orch/scripts/lanes
path *skills/orch/scripts/lane-host*
path *skills/orch/scripts/spawn-adapter
# The workflows that state a narrow tier and its boundary in prose, and the
# script that assigns each item its tier.
path *skills/orch/workflows/micro.md
path *skills/orch/workflows/small.md
path *skills/orch/workflows/oversee.md
path *skills/orch/scripts/item-tier

# [boundary] What the micro-tier measurement reads or runs to reach its
# verdict: a path joins when editing it changes the range measured, the
# settings the measurement reads, or the ceilings it compares against. Reading
# the allowance out of a tracker is none of the three, so the Linear CLI
# branch-size-check runs for it stays out, and so does the workflow-state
# write that records the verdict. The rows are written here and held to, not
# generated from, the `measures-with:` set each measurement script names,
# branch-size-check's and harness-ci's change-class: harness-ci's
# tests/narrow-boundary.test.sh fails when this group and the union of those
# sets, with the `source` lines of every file they name, drift either way,
# and when a row covers a file no set names.
path *skills/orch/references/narrow-change.conf
path *skills/orch/scripts/branch-size-check
path *skills/orch/scripts/lib/branch-growth.sh
path *skills/orch/scripts/lib/kendex-env.sh
path *skills/orch/scripts/resolve-base-branch
path *skills/harness-ci/scripts/change-class
path *skills/harness-ci/scripts/harness-only

# A project surface a harness or a review bot loads in normal use, or reads as
# policy deciding what it will run, and that `change-class` does not already
# refuse as a configuration source, as it refuses AGENTS.md and CLAUDE.md. The
# rule over the adapters under crates/core/src/harness, which is what keeps
# this list whole rather than one thread's worth of paths: a project surface
# joins it when a harness reads that path without anyone invoking an item.
# A directory a harness reads only when an item is named stays off it —
# skills/, agents/, commands/, prompts/, extensions/, plugins/ and Cursor's
# rules/ under any harness root — because those hold the rendered catalog and
# a row for them would take every catalog change out of the narrow classes.
# The first two are rendered by the bot-instructions package and read by
# Copilot code review on every pull request; GEMINI.md and .agents/rules/ are
# the project markers the Gemini and Antigravity adapters name, and are what
# those harnesses load as context; .github/allowed_models.txt is what the
# Copilot adapter reads to decide which model an agent may be run on.
path .github/copilot-instructions.md
path .github/instructions/*.instructions.md
path GEMINI.md
path .agents/rules/*.md
path .github/allowed_models.txt

# Schema, lock format and security paths. These reach this file for the
# wider `small` class, and micro.md § Escape condition 3 takes them too:
# every `path` line here escapes the micro tier.
path *skills/*/schemas/*
path .kendex-lock.json
path .kendex-generated.json
path *crates/core/src/lock*
path *crates/core/src/manifest*
