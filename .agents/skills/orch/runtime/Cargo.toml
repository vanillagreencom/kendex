[package]
name = "orch-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Repository orchestration runtime: workflow records, their domain operations and the standing scheduler"
license = "MIT"
publish = false
# The integration tests live in the package's top-level tests/, which kendex
# leaves out of every render, so the one harness is named by path and
# autodiscovery is off.
autotests = false

# This crate is its own Cargo workspace: it ships inside a catalog skill and
# builds from a rendered install, where no parent workspace exists.
[workspace]

[lib]
name = "orch_runtime"
path = "src/lib.rs"

[[bin]]
name = "orch-runtime"
path = "src/main.rs"

[dependencies]
# The sibling skill, resolved the same way in the catalog and in a rendered
# install with the required agent-runtime package present.
agent-runtime = { path = "../../agent-runtime/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "../tests/rust/main.rs"

[[test]]
name = "effects"
path = "../tests/rust/effects.rs"

[[test]]
name = "item"
path = "../tests/rust/item.rs"

[[test]]
name = "verify"
path = "../tests/rust/verify.rs"

[[test]]
name = "lane"
path = "../tests/rust/lane.rs"

[[test]]
name = "controller"
path = "../tests/rust/controller.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
