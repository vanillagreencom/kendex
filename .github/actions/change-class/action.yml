name: Change class
description: >-
  The shipped change classifier's verdict for a diff, whether the diff runs a
  workflow's lanes, which declared lanes it runs, and the changed-path
  families a workflow selects its jobs with.

# The one place a workflow reads a change class from. A consumer references it
# as `vanillagreencom/kendex/.github/actions/change-class@main` and gets this
# repository's classifier against its own checkout, so a fix to the classifier
# reaches every consumer with no consumer pull request. So does a change to
# which diffs run the lanes: a workflow gates its lanes on the `lanes` output,
# and its declared lanes' verdicts as
# skills/harness-ci/references/wiring.md § Per-lane verdicts sets out, and
# names no class. This repository references it by path, and passes
# `classifier:` a separate default-branch checkout, so the wrapper under test
# is the pull request's while the classification that decides which lanes may
# skip is the default branch's.
# A change to the classifier script itself is proved by the harness-ci suite,
# not by this repository's live classifying job.
#
# The classify step also asks `proof` whether a passing run of the same
# workflow already tested this tree, and stands down what that run covered
# of the lanes the workflow says do the same work on every event, through
# `covers-all-lanes` or its declaration's `:event-uniform` marks; the step
# after it uploads the record classify wrote of this run, for the run after
# it. The API read uses the job token, which the calling job grants `actions: read`;
# a token without it is one refusal, printed on the step's `proof:` line, and
# the lanes run.
#
# NO INPUT CARRIES A CLASS. Not a label, not a branch name, not a pull request
# title, not the class itself: the author of the diff under judgement writes
# every one of those, so an input that asserted a verdict would fail open on
# exactly the diffs that most want to pass. The inputs below are the event and
# its two endpoints, which GitHub writes, and three directories: where the
# classifier is read from, where the lane declaration is read from, and which
# tree it judges. A directory is a place to look, never a verdict.

inputs:
  classifier:
    description: >-
      The checkout root holding skills/harness-ci/scripts. Defaults to this
      action's own tree, which for a consumer calling the action at @main is
      kendex at main. This repository passes a separate default-branch
      checkout, so the classifier judging a pull request is never the copy
      that pull request ships.
    required: false
    default: ''
  event:
    description: >-
      github.event_name. The measured classes (trivial, micro, small) need
      pull_request or merge_group; any other event answers render or standard.
    required: true
  base:
    description: The base endpoint sha. Empty where the event carries none.
    required: false
    default: ''
  head:
    description: The head endpoint sha.
    required: true
  repo:
    description: The checkout to judge. Needs its full history, so the classifier can reach both endpoints.
    required: false
    default: '.'
  lanes-from:
    description: >-
      The default branch's checkout, whose .github/ci-lanes.conf declares the
      workflow's lanes and the paths each reads. Refused where it is the
      checkout `repo` names, whose author could stand a lane down. Empty
      declares no lane and leaves lane_verdicts empty.
    required: false
    default: ''
  covers-all-lanes:
    description: >-
      true where this workflow runs every lane whenever lanes is true, as
      the harness-ci template does, and each lane does the same work on
      every event, as the harness-ci skill's references/wiring.md
      § Per-lane verdicts defines it for the `:event-uniform` mark: the
      adopter's assertion, since a later run of the same tree on another event
      stands its lanes down on it. Only then does a run that reads no lane
      declaration record that it covered every lane. A workflow that
      selects its jobs itself, or runs a lane that works differently on
      one event, leaves it unset, and its record says covers=none. Where a
      declaration is read, its `:event-uniform` marks say the same per
      lane and this input is not read.
    required: false
    default: ''
  macos-patch-proof:
    description: >-
      true for a workflow that runs selected macOS tests on pull requests
      and consumes macos_proof_record to reuse only those tests in a merge
      group. Ubuntu tests must still run against the integrated tree.
      The caller records its actual selection in record_dir and uploads
      change-class-macos-proof-<patch_id> after selection.
      Unset preserves the generic tree-proof contract.
    required: false
    default: ''

outputs:
  change_class:
    description: render, trivial, micro, small or standard.
    value: ${{ steps.classify.outputs.change_class }}
  queue_only:
    description: >-
      true where the change must run in a merge group before it lands, false
      where it need not: the value of the shipped change-class's
      `queue-only:` line, which github.sh pr-merge asks again before the
      admin route. Empty where the classifier root predates this
      output, and where the step failed, whose wiring error is the answer;
      read empty as true.
    value: ${{ steps.classify.outputs.queue_only }}
  docs_only:
    description: >-
      true where the shipped harness-only --mode docs accepts every changed
      path (docs/, changelog.d/, root Markdown), whatever the class; false on
      every other diff and where harness-only cannot read the diff (an
      unsupported event, a missing or unresolvable endpoint, an unreadable or
      empty diff). A wiring error from harness-only or from the action itself
      fails the action with exit 2 instead, and the failed step, not this
      output, is the answer.
    value: ${{ steps.classify.outputs.docs_only }}
  lanes:
    description: >-
      true where the diff runs the workflow's lanes, false where it runs
      none: a render or trivial class, docs_only=true at any class, or a
      proof covering every lane the diff would run. What a lane condition
      and an aggregate's waiver read, with lane_verdicts as
      skills/harness-ci/references/wiring.md § Per-lane verdicts sets out.
      A failed step publishes none, and a lane condition that runs the lanes
      when the classifying job did not succeed reads that as every lane
      running.
    value: ${{ steps.classify.outputs.lanes }}
  lanes_cause:
    description: >-
      Why lanes answered as it did: render, trivial, docs-only or
      proof-reused where lanes is false, and the class where it is true.
    value: ${{ steps.classify.outputs.lanes_cause }}
  proof_reuse:
    description: >-
      true where a passing run of this workflow tested this tree and left a
      record of what it covered: on a merge group, the pull_request run of
      the pull request its queue branch names, at that pull request's head,
      where that run's record names the group's tree; on the merge queue's
      push to the default branch, the merge_group run of the pushed sha.
      false on every other event and on every refusal, whose key
      proof_reason carries. The rules are
      skills/harness-ci/references/wiring.md § Proof reuse.
    value: ${{ steps.classify.outputs.proof_reuse }}
  proof_reason:
    description: exact-proof where proof_reuse is true, otherwise the refusal key.
    value: ${{ steps.classify.outputs.proof_reason }}
  proof_run:
    description: The proving run's id where proof_reuse is true, else empty.
    value: ${{ steps.classify.outputs.proof_run }}
  proof_tree:
    description: The tree this run tests, on every event, which names the record uploaded below.
    value: ${{ steps.classify.outputs.proof_tree }}
  proof_record:
    description: >-
      The proving run's record where proof_reuse is true, else empty: its
      event, change_class, docs_only and one changed_path line per path,
      for a workflow that selects its jobs itself to re-derive what that run
      ran, and its covers and lane lines, which this action applies to
      lanes and lane_verdicts.
    value: ${{ steps.classify.outputs.proof_record }}
  patch_id:
    description: The whitespace-preserving diff id from the endpoints' merge base, empty when unavailable.
    value: ${{ steps.classify.outputs.patch_id }}
  macos_proof_record:
    description: >-
      The record of a successful pull-request run of this workflow with
      macos-patch-proof enabled, the same patch_id and unchanged workflow
      and job selector. Empty when no record qualifies. It authorizes only
      covered macOS tests, never Ubuntu tests.
    value: ${{ steps.classify.outputs.macos_proof_record }}
  record_dir:
    description: >-
      The directory holding this run's record. An opt-in macOS workflow
      records its actual selection here before uploading its patch artifact.
    value: ${{ steps.classify.outputs.record_dir }}
  lane_verdicts:
    description: >-
      One lane_<name>=true|false line per lane the declaration names, decided
      as skills/harness-ci/references/wiring.md § Per-lane verdicts sets out.
      Empty where no declaration was read. A workflow republishes the lines as
      step outputs of its own, since a composite action publishes only the
      outputs it declares.
    value: ${{ steps.classify.outputs.lane_verdicts }}
  changed_skills:
    description: Blank-separated first path segments under skills/ the diff touched.
    value: ${{ steps.classify.outputs.changed_skills }}
  changed_crates:
    description: Blank-separated first path segments under crates/ the diff touched.
    value: ${{ steps.classify.outputs.changed_crates }}
  changed_workflows:
    description: Blank-separated first path segments under .github/workflows/ the diff touched.
    value: ${{ steps.classify.outputs.changed_workflows }}
  changed_paths:
    description: Every changed path, one per line, for a caller whose lanes answer to a tree no family names.
    value: ${{ steps.classify.outputs.changed_paths }}

runs:
  using: composite
  steps:
    # The inputs reach the script through `env:` rather than as `${{ }}` inside
    # a command line, which would be an injection surface. With no `classifier`
    # given the script reads the shipped scripts out of its own directory, so
    # the classifier a consumer runs is the one this action shipped with.
    - id: classify
      shell: bash
      env:
        CLASSIFIER: ${{ inputs.classifier }}
        EVENT: ${{ inputs.event }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        REPO: ${{ inputs.repo }}
        LANES_FROM: ${{ inputs.lanes-from }}
        COVERS_ALL_LANES: ${{ inputs.covers-all-lanes }}
        MACOS_PATCH_PROOF: ${{ inputs.macos-patch-proof }}
        GH_TOKEN: ${{ github.token }}
      run: |
        "$GITHUB_ACTION_PATH/classify"
    # The record of what this run tests and covers, named by its tree, for a
    # later run of the same tree to reuse. classify decides whether a record
    # exists and says so in record_dir, the directory holding it; proof_tree
    # is published on every event. The directory is uploaded, not the file,
    # so the artifact's member is the file's own name, `record`, which proof
    # reads. An upload that fails loses that later reuse and nothing else, so
    # it never reddens the step; the run after it prints its own refusal and
    # runs its lanes. A pull request that waits longer than the retention
    # between its last push and its merge runs its lanes again.
    - name: the record of this run, for the run after it
      if: steps.classify.outputs.record_dir != ''
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: change-class-proof-${{ steps.classify.outputs.proof_tree }}
        path: ${{ steps.classify.outputs.record_dir }}
        retention-days: 30
        overwrite: true
        if-no-files-found: error
