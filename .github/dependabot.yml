# Dependabot handles security updates and weekly action-pin version updates.
# The overseer takes each security fix pull request over through a lane
# (skills/orch/references/oversee-events.md
# § Event kinds, security-alert). Other version upgrades stay dep-radar's: pinned
# binaries, vendored forks and SDK majors with fallout.
#
# For npm and Cargo, open-pull-requests-limit 0 turns version updates off.
# Their required schedules open nothing. Each group applies to security updates
# alone and, with no group-by, opens one pull request per manifest directory:
# ui, each pi-extension, and the Cargo workspace.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/change-class
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /ui
      - /pi-extensions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
