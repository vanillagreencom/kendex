# Authoring validation for a kendex catalog, and the round-trip smoke
# suite for this repository's own renderers.
#
# Catalog repositories call the first job from their own workflow:
#
#     jobs:
#       kendex:
#         uses: vanillagreencom/kendex/.github/workflows/catalog-check.yml@main
#         with:
#           path: .          # the catalog directory inside the repo
#           strict: false    # true also fails on advisories
#
# `kendex check --catalog` exits non-zero on anything that would not
# install: a name a harness's loader will not accept, a SKILL.md that
# disagrees with its own directory, a body past the tightest cap, or
# content the safety rules hold back. Every finding prints its fix.
name: catalog-check

on:
  workflow_call:
    inputs:
      path:
        description: The catalog directory to validate
        type: string
        default: "."
      strict:
        description: Also fail on advisories
        type: boolean
        default: false
      ref:
        description: kendex revision to build the checker from
        type: string
        default: main
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: kendex check
    # Builds the Rust checker, so it runs on Blacksmith when the org's
    # CI_RUNNER_* variables are set; the fallback keeps the reusable
    # workflow working for any caller without them.
    runs-on: ${{ vars.CI_RUNNER_8V || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog
      # Callers pin the checker with inputs.ref; this repo's own PR and push
      # runs build it from the event's own sha, so an engine change and the
      # catalog change it validates travel through review together.
      - uses: actions/checkout@v4
        with:
          repository: vanillagreencom/kendex
          ref: ${{ inputs.ref || github.sha }}
          path: kendex
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kendex
      - name: System dependencies for the keychain store
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Build the checker
        run: cargo build --release --locked -p kendex-cli
        working-directory: kendex
      # This repository is the default marketplace: everyone who installs
      # from it inherits whatever its safety pass still finds, so its own
      # run is always strict. Callers choose for themselves.
      - name: Validate the catalog
        run: |
          kendex/target/release/kendex check \
            --catalog "catalog/${{ inputs.path || '.' }}" \
            ${{ ((inputs.strict || github.event_name != 'workflow_call') && '--strict') || '' }}

  # The one job that lets somebody other than kendex read kendex's output.
  # Freely installable without an account or an API key: OpenCode, Gemini
  # CLI, Codex and Claude Code all ship on npm and all answer a local
  # list/version command offline. Cursor's agent CLI and the GitHub Copilot
  # CLI are not installed here — both want an authenticated session — so
  # the suite skips them and says so. A run where every harness was absent
  # fails; see crates/cli/tests/cli_smoke.rs.
  smoke:
    name: real-CLI round trip
    runs-on: ${{ vars.CI_RUNNER_8V || 'ubuntu-latest' }}
    if: github.event_name != 'workflow_call'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies for the keychain store
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the freely installable harness CLIs
        run: |
          npm install -g \
            opencode-ai \
            @google/gemini-cli \
            @openai/codex \
            @anthropic-ai/claude-code
      - name: Round-trip the emitted trees
        env:
          KENDEX_CLI_SMOKE: "1"
        run: cargo test -p kendex-cli --test cli_smoke -- --nocapture
