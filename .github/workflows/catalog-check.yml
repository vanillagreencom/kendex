# Authoring validation for a kendex catalog. Reusable only: this repository
# calls it from `own-catalog.yml` like any other caller, so nothing in here
# has to work out whose run it is.
#
# Nothing here may ask whose run it is. There is no expression that can
# answer: `github.event_name` in a called workflow is the CALLER's trigger,
# never the string workflow_call; `inputs.path` is a string a caller can
# hand an empty value; and `inputs.strict == null` is `0 == 0` under
# GitHub's numeric coercion for `==`, so it is true for every caller who
# passes `false`. Each of those forces --strict on callers who asked for
# none and runs kendex's own renderer suite against their checkout. A
# caller's inputs are honoured as given, and this repository is a caller
# like any other.
#
# Catalog repositories call the first job from their own workflow:
#
#     jobs:
#       kendex:
#         uses: vanillagreencom/kendex/.github/workflows/catalog-check.yml@main
#         with:
#           path: .          # the catalog directory inside the repo
#           strict: false    # true also fails on advisories
#
# `kendex check --catalog` exits non-zero on anything that would not
# install: a name a harness's loader will not accept, a SKILL.md that
# disagrees with its own directory. With `strict`, structural advisories
# fail it too. Safety findings print with their fix and fail nothing,
# under either setting.
#
# The render step installs the catalog with the latest released engine
# twice: into a fresh project, and over the catalog as the caller's base
# commit held it, the way a consumer's refresh meets a catalog merge. The
# base install declares every package by name, as consumers do, so a change
# that drops or renames a package the base shipped fails until a released
# kendex retires that name: keep the package meanwhile, a stub is enough.
# An event with no base commit, a first push, a base without the catalog
# path, or a base the released engine's catalog check refuses runs the fresh
# install alone and prints why.
name: catalog-check

on:
  workflow_call:
    inputs:
      path:
        description: The catalog directory to validate
        type: string
        default: "."
      strict:
        description: Also fail on advisories
        type: boolean
        default: false
      ref:
        description: kendex revision to read the CI scripts from (the engine is always the latest release)
        type: string
        default: main
      timeout-minutes:
        description: Job time limit in minutes (GitHub requires it in the called workflow)
        type: number
        default: 360

jobs:
  check:
    name: kendex check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog
      # inputs.ref selects the CI scripts. install-latest.sh selects the
      # latest released engine.
      - uses: actions/checkout@v4
        with:
          repository: vanillagreencom/kendex
          ref: ${{ inputs.ref }}
          path: kendex
          persist-credentials: false
      - name: Install latest released kendex
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          kendex/skills/review-gate/scripts/install-latest.sh
      # github.event is the caller's: a pull request's base, a merge group's
      # base or the commit a push replaced. A push that created the branch
      # or the repository names forty zeros.
      - name: Find the prior catalog
        id: prior
        env:
          PRIOR_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$PRIOR_SHA" in
            "") echo "catalog-release: upgrade=skip cause=no-base-commit" ;;
            *[!0]*) echo "sha=$PRIOR_SHA" >> "$GITHUB_OUTPUT" ;;
            *) echo "catalog-release: upgrade=skip cause=no-prior-commit" ;;
          esac
      - name: Check out the prior catalog
        if: steps.prior.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prior.outputs.sha }}
          path: prior
          persist-credentials: false
      - name: Render the catalog with the released engine
        env:
          CATALOG_PATH: catalog/${{ inputs.path || '.' }}
          PRIOR_PATH: ${{ steps.prior.outputs.sha && format('prior/{0}', inputs.path || '.') || '' }}
        run: |
          if [ -n "$PRIOR_PATH" ] && [ ! -d "$PRIOR_PATH" ]; then
            echo "catalog-release: upgrade=skip cause=path-absent path=$PRIOR_PATH"
            PRIOR_PATH=
          fi
          python3 kendex/tools/catalog-release-check "$HOME/.local/bin/kendex" "$CATALOG_PATH" ${{ !inputs.strict && '--allow-advisories' || '' }} ${PRIOR_PATH:+--prior "$PRIOR_PATH"}
      # The caller's own answer, honoured as given. This repository asks
      # for `strict: true` from own-catalog.yml: the default marketplace
      # carries no structural advisories either. Safety findings print
      # here and fail nothing.
      - name: Validate the catalog
        env:
          CATALOG_PATH: catalog/${{ inputs.path || '.' }}
        run: |
          "$HOME/.local/bin/kendex" check \
            --catalog "$CATALOG_PATH" \
            ${{ inputs.strict && '--strict' || '' }}
