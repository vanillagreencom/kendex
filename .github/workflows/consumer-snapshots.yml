name: Consumer snapshots

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-snapshots
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kendex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Mint the consumer read token
        id: read
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          permission-contents: read
          permission-metadata: read
          permission-environments: read
          permission-secrets: read
      # GitHub blob and environment reads only. No checkout, build, refresh,
      # hook or captured script runs under the read credential.
      - name: Collect committed refresh inputs
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: tools/consumer-refresh collect --output "$RUNNER_TEMP/consumer-snapshots.json.gz"
      - name: Mint the snapshot publication token
        id: publish
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          repositories: kendex
          permission-contents: write
          permission-pull-requests: write
      # The existing lock-record owner handles the rolling PR and queue arm.
      # Snapshot publication does not invoke kendex or a consumer's code.
      - name: Land the snapshot through its rolling pull request
        env:
          GH_TOKEN: ${{ steps.publish.outputs.token }}
          GIT_AUTHOR_NAME: vanillagreen-fleet-lanes[bot]
          GIT_AUTHOR_EMAIL: 328550061+vanillagreen-fleet-lanes[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: vanillagreen-fleet-lanes[bot]
          GIT_COMMITTER_EMAIL: 328550061+vanillagreen-fleet-lanes[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          gh auth setup-git
          git config core.hooksPath /dev/null
          tools/lock-record --repo "$GITHUB_WORKSPACE" --base main \
            --branch kendex/consumer-snapshots --snapshot "$RUNNER_TEMP/consumer-snapshots.json.gz"
