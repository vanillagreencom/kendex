name: KEN-849 loader diagnostic

# TEMPORARY, and deleted before this branch is proposed for merge. It exists
# to run the Windows lane's own command on a branch push: nothing in
# skill-tests.yml triggers on one, and this failure only happens on a Windows
# runner.
#
# The first run named the cause. `crates/app`'s test binaries carry no
# application manifest, so `comctl32.dll` resolves to version 5.82, which does
# not export the `TaskDialogIndirect` that Tauri calls, and the loader refuses
# to start the process with 0xc0000139 before any test runs.

"on":
  push:
    branches: [ken-849]

permissions:
  contents: read

jobs:
  loader:
    name: The Windows lane with the app crate in it
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The narrow signal first, so a still-broken load is one line rather
      # than a suite-wide report.
      - name: Does the bindings test binary start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $json = cargo test -p kendex-app --test bindings --no-run --locked --message-format=json
          $exe = $null
          foreach ($line in $json) {
            if ($line -notmatch '"executable":"[^"]+"') { continue }
            $m = $line | ConvertFrom-Json
            if ($m.reason -eq 'compiler-artifact' -and $m.target.name -eq 'bindings' -and $m.executable) {
              $exe = $m.executable
            }
          }
          Write-Host "binary: $exe"
          if (-not $exe) { throw 'no bindings test binary in the cargo output' }
          & $exe --list
          Write-Host ("exit: 0x{0:X8}" -f $LASTEXITCODE)

      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
