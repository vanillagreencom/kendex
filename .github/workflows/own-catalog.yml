# This repository's own catalog and renderers. It calls the reusable
# workflow like any other caller, which is what lets that workflow honour
# its inputs with no guard: nothing there can work out whose run it is, and
# nothing there has to.
name: own-catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The default marketplace holds itself to the strictest reading: everyone
  # who installs from it inherits whatever its safety pass still finds.
  catalog:
    permissions:
      contents: read
    uses: ./.github/workflows/catalog-check.yml
    with:
      path: .
      strict: true
      # The commit under review, checked by its own checker. `ref` has a
      # default, and workflow_call applies input defaults to a local caller
      # exactly as to a remote one — so leaving it out validates this branch
      # with main's engine, which is a different set of rules than the
      # branch's own tests ran.
      ref: ${{ github.sha }}

  # The one job that lets somebody other than kendex read kendex's output.
  # Installed here are the four CLIs that answer offline with what they
  # loaded from the rendered tree: Codex, OpenCode, Gemini CLI and the
  # GitHub Copilot CLI. Claude Code, Pi and Cursor's agent CLI are not
  # installed, because none of them ships a command that reads that tree
  # without a session — the suite names each of them uncovered and says
  # why. A run where nothing was read fails; see
  # crates/cli/tests/cli_smoke.rs.
  #
  # It lives here rather than in the reusable workflow because it exercises
  # kendex's own renderers: a caller's checkout is their catalog, and
  # running it against theirs would fail them for our content.
  smoke:
    name: real-CLI round trip
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies for the keychain store
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the freely installable harness CLIs
        # Every CLI tracks latest deliberately: this job exists to notice
        # when a harness stops reading what kendex wrote.
        #
        # The version check is not a formality. A launcher published ahead of
        # its own platform binaries installs clean — an optional dependency
        # that cannot resolve does not fail an install — and then refuses to
        # run, which surfaced as a panic inside a Rust test with a stack
        # trace that pointed nowhere near the cause. Here it fails on the
        # line that caused it (KEN-675).
        run: |
          npm install -g \
            opencode-ai \
            @google/gemini-cli \
            @openai/codex \
            @github/copilot
          # Only CLIs whose version flag is confirmed; adding one means
          # confirming it first, because a wrong probe here reds the build
          # for a reason that has nothing to do with kendex.
          for cli in opencode codex gemini copilot; do "$cli" --version; done
      - name: Round-trip the emitted trees
        env:
          KENDEX_CLI_SMOKE: "1"
        run: cargo test -p kendex-cli --test cli_smoke -- --nocapture
