name: publish-homebrew

# The Homebrew tap vanillagreencom/homebrew-kendex does not pull recipe
# changes from this repository. This workflow runs tools/publish-homebrew,
# which copies packaging/homebrew/ into the tap's Formula/ and Casks/
# directories and pushes what changed. A recipe still pinning a target to
# the all-zero placeholder is deferred (that target has not shipped); any
# other recipe is pushed as soon as it differs from the tap, without waiting
# for its release downloads the way publish-aur does, so a version bump must
# not reach main before its release is up (packaging/README.md § Publishing).
# The tool's suite, tools/tests/publish-homebrew.test.sh, carries the
# must-fail control for that guard.
#
# Deploy keys are disabled on the tap, so the push uses an installation
# token of the fleet GitHub App, minted for that one repository.

on:
  push:
    branches: [main]
    paths:
      - packaging/homebrew/**
      - tools/publish-homebrew
      - .github/workflows/publish-homebrew.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would be pushed without pushing it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Cancellation could leave the formula pushed and the cask not.
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  publish:
    # Reads this repository; writes only to the tap, with the App's token.
    permissions:
      contents: read
    # CI_RUNNER_2V is unset on this public repository, so this is ubuntu-latest.
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      TAP: vanillagreencom/homebrew-kendex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Skipped for a dry run: it clones the public tap over HTTPS and pushes
      # nothing, so anyone can dispatch one without the secrets. A real run
      # with either secret empty fails here, by name, before anything is
      # cloned: a green run that pushed nothing would leave the tap stale.
      - name: The tap credentials are set
        if: ${{ inputs.dry_run != true }}
        env:
          FLEET_GH_APP_ID: ${{ secrets.FLEET_GH_APP_ID }}
          FLEET_GH_APP_PRIVATE_KEY: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$FLEET_GH_APP_ID" ] || missing="$missing FLEET_GH_APP_ID"
          [ -n "$FLEET_GH_APP_PRIVATE_KEY" ] || missing="$missing FLEET_GH_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::not set:$missing. Both FLEET_GH_APP_ID and FLEET_GH_APP_PRIVATE_KEY are needed to push to $TAP, so nothing was published. Add the secrets (packaging/README.md § Publishing), or copy packaging/homebrew/ into the tap by hand and say so in the release notes."
            exit 1
          fi

      - name: Mint a token for the tap
        if: ${{ inputs.dry_run != true }}
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The secret holds the App ID; this input also takes the client id.
          app-id: ${{ secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          repositories: homebrew-kendex

      - name: Publish packaging/homebrew to the tap
        env:
          PUBLISH_TOKEN: ${{ steps.token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            tools/publish-homebrew --dry-run
          else
            tools/publish-homebrew
          fi
