# The consumer refresh, called by each consumer's
# .github/workflows/kendex-refresh.yml, the caller template
# refresh/kendex-refresh.yml, at a major tag such as v1. Reusable only. In a
# called workflow the github context is the caller's, so every github.*
# value below names the consumer.
#
# An inline input check runs first with the caller's GitHub token. When saved
# inputs and source coverage remain current and no rolling pull request is
# open, it skips the render step, and every later step unless one merged in
# the last 24 hours, whose review threads the review step still answers. A
# review-only or full run checks out the workflow commit, the one
# job.workflow_sha names, and installs the one stable vN.Y.Z release tagged on
# that commit, where vN is the tag the caller named, and stops before any
# install when the commit carries no such tag or more than one. The default
# catalog follows main, with the engine's compatibility refusal selecting the
# release catalog. A declared rev takes precedence. Later steps run their
# scripts from that checkout. The consumer code a run executes is the settings
# report in refresh-consumer.sh, which sources the consumer's refreshed orch
# libraries, and the refreshed bot-instructions render kendex runs once in the
# run's checkout, each under env -i with no credential.
#
# Report lines, one per line: kendex-install: version=TAG commit=SHA on
# success, kendex-install: cause=KEY value=VALUE on a refusal, and
# refresh-warning=behind-release tag=TAG newest=NEWER when a higher stable
# tag of the same major exists. The English after each refusal is not parsed.
name: refresh-consumer

"on":
  workflow_call:
    inputs:
      environment:
        type: string
        default: kendex
      app-id-secret-name:
        description: Deprecated compatibility input; the shared job's repository token reads only the two fixed credential pairs.
        type: string
        default: FLEET_GH_APP_ID
      app-private-key-secret-name:
        description: Deprecated compatibility input; the shared job's repository token reads only the two fixed credential pairs.
        type: string
        default: FLEET_GH_APP_PRIVATE_KEY
    # GitHub loads environment secrets when the called job starts. A caller
    # cannot select an environment on its calling job.
    # Adoption refuses outside Actions copies of all six fixed names;
    # otherwise a missing environment name could receive a caller value.
    secrets:
      KENDEX_APP_ID:
        required: false
      KENDEX_APP_PRIVATE_KEY:
        required: false
      # Accepted for callers shipped before the fixed neutral pair. Those
      # callers also forward the FLEET pair that the token steps still read.
      app-id:
        required: false
      app-private-key:
        required: false
      FLEET_GH_APP_ID:
        required: false
      FLEET_GH_APP_PRIVATE_KEY:
        required: false
      # The landing app's pair, optional: without it every update keeps the
      # rolling pull request.
      KENDEX_LAND_APP_ID:
        required: false
      KENDEX_LAND_APP_PRIVATE_KEY:
        required: false

jobs:
  refresh:
    if: github.repository != 'vanillagreencom/kendex' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # A step condition cannot read secrets, so the job carries only whether
    # the landing pair is complete, and whether either name is set, which
    # refresh-consumer.sh reads to report a token that did not arrive; never
    # their values.
    env:
      KENDEX_LAND_PAIR: ${{ secrets.KENDEX_LAND_APP_ID != '' && secrets.KENDEX_LAND_APP_PRIVATE_KEY != '' }}
      KENDEX_LAND_CONFIGURED: ${{ secrets.KENDEX_LAND_APP_ID != '' || secrets.KENDEX_LAND_APP_PRIVATE_KEY != '' }}
    # Inherit the caller's grants. Older callers have contents:read only;
    # their unreadable review/record evidence must select a full refresh.
    steps:
      # job.workflow_sha binds co-located code to the defining reusable workflow,
      # not the consumer commit. See GitHub's contexts reference, job context.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kendex
          persist-credentials: false
      # The REST jobs reader recognizes this name when a skipped run has no record.
      - name: refresh-input-check
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          exec python3 "$GITHUB_WORKSPACE/kendex/refresh/check-inputs.py"
      - if: steps.inputs.outputs.route != 'skip'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Install the release tagged on this commit
        if: steps.inputs.outputs.route != 'skip'
        working-directory: kendex
        env:
          GH_TOKEN: ""
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() {
            printf 'kendex-install: cause=%s value=%s\n%s\n' "$1" "$2" "$3" >&2
            exit 1
          }
          [[ $WORKFLOW_REF =~ @refs/tags/v([0-9]+)$ ]] ||
            fail workflow-ref "$WORKFLOW_REF" 'Call the shared refresh workflow at a major tag, such as @v1.'
          major="${BASH_REMATCH[1]}"
          [[ $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ ]] ||
            fail workflow-sha "$WORKFLOW_SHA" 'The workflow commit is not a full SHA.'
          # kendex is public. The checkout kept no credential, and none is needed.
          tags="$(env -u GH_TOKEN -u GITHUB_TOKEN git ls-remote --tags origin)" ||
            fail tags-read origin 'Could not list the kendex tags.'
          # An annotated tag lists its own object and, with ^{}, its commit.
          releases="$(awk -v major="$major" '
            { name = $2; sub(/^refs\/tags\//, "", name); peeled = sub(/\^\{\}$/, "", name)
              if (name !~ ("^v" major "\\.[0-9]+\\.[0-9]+$")) next
              if (peeled || !(name in commit)) commit[name] = $1 }
            END { for (name in commit) print commit[name], name }' <<<"$tags")" ||
            fail tags-parse origin 'Could not read the kendex tag list.'
          tag="" count=0 newest="" newest_minor=0 newest_patch=0
          while read -r sha name; do
            [ -n "$name" ] || continue
            if [ "$sha" = "$WORKFLOW_SHA" ]; then tag="$name"; count=$((count + 1)); fi
            rest="${name#v"$major".}"
            minor="${rest%%.*}" patch="${rest#*.}"
            if [ -z "$newest" ] || [ "$minor" -gt "$newest_minor" ] ||
                { [ "$minor" -eq "$newest_minor" ] && [ "$patch" -gt "$newest_patch" ]; }; then
              newest="$name" newest_minor="$minor" newest_patch="$patch"
            fi
          done <<<"$releases"
          [ "$count" -eq 1 ] ||
            fail release-tags "$count" "The workflow commit must carry exactly one stable v$major.Y.Z tag."
          if [ "$newest" != "$tag" ]; then
            printf 'refresh-warning=behind-release tag=%s newest=%s\n' "$tag" "$newest"
            printf '::warning::refresh-warning=behind-release tag=%s newest=%s\n' "$tag" "$newest"
          fi
          # install.sh picks a bin directory from PATH. The user directory goes
          # first so CI never needs sudo and later steps know which binary runs.
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          env -u GH_TOKEN -u GITHUB_TOKEN sh ./install.sh --version "$tag" --cli-only ||
            fail installer-run "$tag" 'The release installer failed.'
          installed="$(kendex --version)" ||
            fail engine-version "$tag" 'Could not read the installed engine version.'
          [ "$installed" = "kendex ${tag#v}" ] ||
            fail engine-version "$installed" "The installed engine is not $tag."
          printf 'KENDEX_CATALOG_REV=%s\n' main >>"$GITHUB_ENV"
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"
          printf 'kendex-install: version=%s commit=%s\n' "$tag" "$WORKFLOW_SHA"
      - name: Mint the repository app token
        if: steps.inputs.outputs.route != 'skip'
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.KENDEX_APP_ID && secrets.KENDEX_APP_PRIVATE_KEY && secrets.KENDEX_APP_ID || secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.KENDEX_APP_ID && secrets.KENDEX_APP_PRIVATE_KEY || secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read
          permission-metadata: read
          permission-actions: read
          permission-environments: read
          permission-secrets: read
          permission-organization-secrets: ${{ github.event.repository.owner.type != 'User' && 'read' || '' }}
      # The landing app's token, which pushes a render the refresh committed
      # to the default branch, where the rulesets there let that app
      # through, and which refresh-consumer.sh uses for nothing else. It
      # holds contents: write alone. A caller without the pair, or a failed
      # mint, leaves the token empty and every update on the rolling pull
      # request.
      - name: Mint the landing token
        if: steps.inputs.outputs.route == 'full' && env.KENDEX_LAND_PAIR == 'true'
        id: land-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.KENDEX_LAND_APP_ID }}
          private-key: ${{ secrets.KENDEX_LAND_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      # The REST jobs reader recognizes this name: its skip proves a run left
      # the recorded render alone.
      - name: Refresh and arm the rolling pull request
        if: steps.inputs.outputs.route == 'full'
        id: refresh
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REFRESH_APP_SLUG: ${{ steps.token.outputs.app-slug }}
          KENDEX_LAND_TOKEN: ${{ steps.land-token.outputs.token }}
        run: |
          set -euo pipefail
          exec "$GITHUB_WORKSPACE/kendex/refresh/refresh-consumer.sh"
      - name: Mint the kendex issue token
        if: steps.inputs.outputs.route != 'skip'
        id: issues-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          repositories: kendex
          permission-issues: write
      # Thread-resolution rules: review-gate references/adoption.md,
      # Automatic consumer refresh.
      - name: File rendered-file findings upstream and resolve them
        if: steps.inputs.outputs.route != 'skip'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          KENDEX_ISSUES_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: |
          set -euo pipefail
          exec "$GITHUB_WORKSPACE/kendex/refresh/refresh-reviews.sh"
      - name: Record a current refresh
        if: steps.inputs.outputs.route == 'full' && steps.refresh.outputs.state == 'current' && steps.refresh.outputs.sources == 'covered' && steps.inputs.outputs.record-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kendex-refresh-current
          path: ${{ steps.inputs.outputs.record-path }}
          if-no-files-found: error
