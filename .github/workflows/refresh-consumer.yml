# The consumer refresh, called by each consumer's
# .github/workflows/kendex-refresh.yml, the caller template
# refresh/kendex-refresh.yml, at a major tag such as v1. Reusable only. In a
# called workflow the github context is the caller's, so every github.*
# value below names the consumer.
#
# An inline input check runs first with the caller's GitHub token. It can
# skip every later step when saved inputs and source coverage remain current
# and no rolling pull request needs review work. A full refresh checks out
# the workflow commit, the one job.workflow_sha names, and installs the one stable
# vN.Y.Z release tagged on that commit, where vN is the tag the caller named,
# and stops before any install when the commit carries no such tag or more
# than one. The default catalog follows main, with the engine's compatibility
# refusal selecting the release catalog. A declared rev takes precedence. Full-refresh
# steps run their scripts from that checkout. The consumer code
# a run executes is the settings report in refresh-consumer.sh, which sources
# the consumer's refreshed orch libraries, and the refreshed bot-instructions
# render kendex runs once in the run's checkout, each under env -i with no
# credential.
#
# Report lines, one per line: kendex-install: version=TAG commit=SHA on
# success, kendex-install: cause=KEY value=VALUE on a refusal, and
# refresh-warning=behind-release tag=TAG newest=NEWER when a higher stable
# tag of the same major exists. The English after each refusal is not parsed.
name: refresh-consumer

"on":
  workflow_call:
    inputs:
      environment:
        type: string
        default: kendex
      app-id-secret-name:
        description: Deprecated compatibility input; the shared job reads only the two fixed environment pairs.
        type: string
        default: FLEET_GH_APP_ID
      app-private-key-secret-name:
        description: Deprecated compatibility input; the shared job reads only the two fixed environment pairs.
        type: string
        default: FLEET_GH_APP_PRIVATE_KEY
    # GitHub loads environment secrets when the called job starts. A caller
    # cannot select an environment on its calling job.
    # Adoption refuses outside Actions copies of all four fixed names;
    # otherwise a missing environment name could receive a caller value.
    secrets:
      KENDEX_APP_ID:
        required: false
      KENDEX_APP_PRIVATE_KEY:
        required: false
      # Accepted for callers shipped before the fixed neutral pair. Those
      # callers also forward the FLEET pair that the token steps still read.
      app-id:
        required: false
      app-private-key:
        required: false
      FLEET_GH_APP_ID:
        required: false
      FLEET_GH_APP_PRIVATE_KEY:
        required: false

jobs:
  refresh:
    if: github.repository != 'vanillagreencom/kendex' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Inherit the caller's grants. Older callers have contents:read only;
    # their unreadable review/record evidence must select a full refresh.
    steps:
      # The REST jobs reader recognizes this name when a skipped run has no record.
      - name: refresh-input-check
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, io, json, os, pathlib, re, subprocess, tempfile, urllib.parse, zipfile
          def command(*args):
              return subprocess.check_output(args, timeout=15, stderr=subprocess.PIPE)
          def api(path):
              return json.loads(command('gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/' + path))
          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a') as stream:
              stream.write('run=true\n')
          try:
              # GitHub's public git refs and REST APIs need no checkout or app token.
              refs = command('git', 'ls-remote', 'https://github.com/vanillagreencom/kendex.git',
                             'refs/heads/main', 'refs/tags/v1.*').decode().splitlines()
              main = [row.split()[0] for row in refs if row.split()[1] == 'refs/heads/main']
              tags = sorted(row for row in refs if re.fullmatch(r'refs/tags/v1\.[0-9]+\.[0-9]+(?:\^\{\})?', row.split()[1]))
              head = api('commits/' + urllib.parse.quote(os.environ['DEFAULT_BRANCH'], safe=''))['sha']
              assert len(main) == 1 and tags
              assert all(re.fullmatch('[0-9a-f]{40}', sha) for sha in (main[0], head, os.environ['WORKFLOW_SHA']))
              inputs = dict(catalog=main[0], workflow=os.environ['WORKFLOW_SHA'], tags=tags, consumer=head)
              current = dict(inputs=inputs, run=int(os.environ['GITHUB_RUN_ID']), attempt=int(os.environ['GITHUB_RUN_ATTEMPT']))
              assert current['run'] > 0 and current['attempt'] > 0
              record = pathlib.Path(tempfile.mkdtemp(prefix='kendex-refresh-', dir=os.environ['RUNNER_TEMP'])) / 'record.json'
              record.write_text(json.dumps(current, sort_keys=True))
              with output.open('a') as stream:
                  stream.write('record-path=' + str(record) + '\n')
              owner = os.environ['GH_REPO'].split('/')[0]
              query = urllib.parse.urlencode(dict(state='all', head=owner + ':kendex/refresh', per_page=100))
              pages = json.loads(command('gh', 'api', '--paginate', '--slurp', 'repos/' + os.environ['GH_REPO'] + '/pulls?' + query))
              cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)
              for pr in (pr for page in pages for pr in page):
                  merged = pr['merged_at']
                  if pr['state'] == 'open' or (merged and datetime.datetime.fromisoformat(merged.replace('Z', '+00:00')) >= cutoff):
                      print('refresh-check=full cause=reviews')
                      raise SystemExit(0)
              artifacts = api('actions/artifacts?name=kendex-refresh-current&per_page=100')['artifacts']
              # A fork or feature-branch artifact cannot attest the default branch.
              artifacts = [a for a in artifacts if not a['expired'] and
                           a['workflow_run']['head_branch'] == os.environ['DEFAULT_BRANCH'] and
                           a['workflow_run']['head_repository_id'] == a['workflow_run']['repository_id']]
              latest = max(artifacts, key=lambda a: a['created_at'])
              archive = command('gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/actions/artifacts/' + str(latest['id']) + '/zip')
              with zipfile.ZipFile(io.BytesIO(archive)) as saved:
                  previous = json.loads(saved.read('record.json'))
              run = api('actions/runs/' + str(latest['workflow_run']['id']))
              assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/kendex-refresh.yml'
              # Reruns keep their run ID and can retain earlier attempts' artifacts.
              # A newer attempt without its own record cannot reuse that proof.
              assert type(previous['attempt']) is int and previous['attempt'] > 0
              assert previous['run'] == run['id'] and previous['attempt'] == run['run_attempt']
              saved_at = datetime.datetime.fromisoformat(latest['created_at'].replace('Z', '+00:00'))
              now = datetime.datetime.now(datetime.timezone.utc)
              assert datetime.timedelta(0) <= now - saved_at <= datetime.timedelta(hours=24)
              # GitHub allows rerun requests for 30 days, then waiting or running for 35.
              # Read that whole window, independent of list order. Partition it
              # so an hourly caller stays below GitHub's 1,000-result search cap.
              split = saved_at - datetime.timedelta(days=30)
              history = {}
              for start, end in ((saved_at - datetime.timedelta(days=65), split), (split, now)):
                  query = urllib.parse.urlencode(dict(branch=os.environ['DEFAULT_BRANCH'],
                                                      created=start.isoformat() + '..' + end.isoformat(), per_page=100))
                  pages = json.loads(command('gh', 'api', '--paginate', '--slurp',
                                            'repos/' + os.environ['GH_REPO'] + '/actions/workflows/kendex-refresh.yml/runs?' + query))
                  batch = [recent for page in pages for recent in page['workflow_runs']]
                  assert 0 <= pages[0]['total_count'] == len(batch) < 1000
                  assert len({recent['id'] for recent in batch}) == len(batch)
                  for recent in batch:
                      assert recent['id'] not in history or history[recent['id']] == recent
                      history[recent['id']] = recent
              assert run['id'] in history
              assert current['attempt'] == 1
              for recent in history.values():
                  if recent['id'] == current['run']:
                      assert recent['run_attempt'] == current['attempt']
                      continue
                  if recent['id'] == run['id']:
                      assert recent['run_attempt'] == previous['attempt']
                      continue
                  if datetime.datetime.fromisoformat(recent['updated_at'].replace('Z', '+00:00')) < saved_at:
                      continue
                  # Latest-attempt jobs cannot prove what an earlier attempt did.
                  # Keep rerun history on the full path instead of walking attempts.
                  assert type(recent['run_attempt']) is int and recent['run_attempt'] == 1
                  assert recent['status'] == 'completed' and recent['conclusion'] == 'success'
                  report = api('actions/runs/' + str(recent['id']) + '/attempts/1/jobs?per_page=100')
                  jobs = report['jobs']
                  assert report['total_count'] == len(jobs)
                  following = [job['steps'][index + 1]['conclusion'] for job in jobs
                               for index, step in enumerate(job['steps'])
                               if step['name'] == 'refresh-input-check' and step['conclusion'] == 'success']
                  assert following == ['skipped']
              if previous['inputs'] == inputs:
                  with output.open('a') as stream:
                      stream.write('run=false\n')
                  print('refresh-check=skip cause=current')
              else:
                  print('refresh-check=full cause=changed')
          except (AssertionError, AttributeError, IndexError, KeyError, TypeError, ValueError, OSError, subprocess.SubprocessError, zipfile.BadZipFile):
              # Missing grants, expired artifacts and failed reads cannot authorize a skip.
              print('refresh-check=full cause=unreadable')
          PY
      - if: steps.inputs.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false
      - if: steps.inputs.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: kendex
          persist-credentials: false
      - name: Install the release tagged on this commit
        if: steps.inputs.outputs.run == 'true'
        working-directory: kendex
        env:
          GH_TOKEN: ""
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          fail() {
            printf 'kendex-install: cause=%s value=%s\n%s\n' "$1" "$2" "$3" >&2
            exit 1
          }
          [[ $WORKFLOW_REF =~ @refs/tags/v([0-9]+)$ ]] ||
            fail workflow-ref "$WORKFLOW_REF" 'Call the shared refresh workflow at a major tag, such as @v1.'
          major="${BASH_REMATCH[1]}"
          [[ $WORKFLOW_SHA =~ ^[0-9a-f]{40}$ ]] ||
            fail workflow-sha "$WORKFLOW_SHA" 'The workflow commit is not a full SHA.'
          # kendex is public. The checkout kept no credential, and none is needed.
          tags="$(env -u GH_TOKEN -u GITHUB_TOKEN git ls-remote --tags origin)" ||
            fail tags-read origin 'Could not list the kendex tags.'
          # An annotated tag lists its own object and, with ^{}, its commit.
          releases="$(awk -v major="$major" '
            { name = $2; sub(/^refs\/tags\//, "", name); peeled = sub(/\^\{\}$/, "", name)
              if (name !~ ("^v" major "\\.[0-9]+\\.[0-9]+$")) next
              if (peeled || !(name in commit)) commit[name] = $1 }
            END { for (name in commit) print commit[name], name }' <<<"$tags")" ||
            fail tags-parse origin 'Could not read the kendex tag list.'
          tag="" count=0 newest="" newest_minor=0 newest_patch=0
          while read -r sha name; do
            [ -n "$name" ] || continue
            if [ "$sha" = "$WORKFLOW_SHA" ]; then tag="$name"; count=$((count + 1)); fi
            rest="${name#v"$major".}"
            minor="${rest%%.*}" patch="${rest#*.}"
            if [ -z "$newest" ] || [ "$minor" -gt "$newest_minor" ] ||
                { [ "$minor" -eq "$newest_minor" ] && [ "$patch" -gt "$newest_patch" ]; }; then
              newest="$name" newest_minor="$minor" newest_patch="$patch"
            fi
          done <<<"$releases"
          [ "$count" -eq 1 ] ||
            fail release-tags "$count" "The workflow commit must carry exactly one stable v$major.Y.Z tag."
          if [ "$newest" != "$tag" ]; then
            printf 'refresh-warning=behind-release tag=%s newest=%s\n' "$tag" "$newest"
            printf '::warning::refresh-warning=behind-release tag=%s newest=%s\n' "$tag" "$newest"
          fi
          # install.sh picks a bin directory from PATH. The user directory goes
          # first so CI never needs sudo and later steps know which binary runs.
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          env -u GH_TOKEN -u GITHUB_TOKEN sh ./install.sh --version "$tag" --cli-only ||
            fail installer-run "$tag" 'The release installer failed.'
          installed="$(kendex --version)" ||
            fail engine-version "$tag" 'Could not read the installed engine version.'
          [ "$installed" = "kendex ${tag#v}" ] ||
            fail engine-version "$installed" "The installed engine is not $tag."
          printf 'KENDEX_CATALOG_REV=%s\n' main >>"$GITHUB_ENV"
          printf '%s\n' "$HOME/.local/bin" >>"$GITHUB_PATH"
          printf 'kendex-install: version=%s commit=%s\n' "$tag" "$WORKFLOW_SHA"
      - name: Mint the repository app token
        if: steps.inputs.outputs.run == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KENDEX_APP_ID && secrets.KENDEX_APP_PRIVATE_KEY && secrets.KENDEX_APP_ID || secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.KENDEX_APP_ID && secrets.KENDEX_APP_PRIVATE_KEY || secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-administration: read
          permission-metadata: read
          permission-actions: read
          permission-environments: read
          permission-secrets: read
          permission-organization-secrets: ${{ github.event.repository.owner.type != 'User' && 'read' || '' }}
      - name: Refresh and arm the rolling pull request
        if: steps.inputs.outputs.run == 'true'
        id: refresh
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REFRESH_APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          set -euo pipefail
          exec "$GITHUB_WORKSPACE/kendex/refresh/refresh-consumer.sh"
      - name: Mint the kendex issue token
        if: steps.inputs.outputs.run == 'true'
        id: issues-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.FLEET_GH_APP_ID }}
          private-key: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
          owner: vanillagreencom
          repositories: kendex
          permission-issues: write
      # Thread-resolution rules: review-gate references/adoption.md,
      # Automatic consumer refresh.
      - name: File rendered-file findings upstream and resolve them
        if: steps.inputs.outputs.run == 'true'
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          KENDEX_ISSUES_TOKEN: ${{ steps.issues-token.outputs.token }}
        run: |
          set -euo pipefail
          exec "$GITHUB_WORKSPACE/kendex/refresh/refresh-reviews.sh"
      - name: Record a current refresh
        if: steps.inputs.outputs.run == 'true' && steps.refresh.outputs.state == 'current' && steps.refresh.outputs.sources == 'covered' && steps.inputs.outputs.record-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kendex-refresh-current
          path: ${{ steps.inputs.outputs.record-path }}
          if-no-files-found: error
