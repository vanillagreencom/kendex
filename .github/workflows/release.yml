# Release: build the CLI and the desktop app on a native runner per
# target, then publish a GitHub Release carrying every artifact, the
# feed.json that `kendex update` consumes, the latest.json the app's Update
# button installs from, and the signed digests document each lane publishes
# about what it built.
#
# A main dispatch builds a selected merged commit and creates its version
# tag. A push to main publishes one immutable build, then changes the fixed
# channel's single feed pointer. Tags start no build.
# Pull requests are covered by the per-crate checks. The Intel macOS lane
# restores a Rust dependency cache saved only by trusted main runs. Later
# main and dispatch runs reuse it; dispatches never save. Bundles are removed before
# the post-job save, so signed and notarized installers stay out of it.
# Every lane runs
# on a GitHub-standard runner, which is free for a public repository.
# Each Apple architecture gets its own native lane rather than one
# universal binary: the updater keys its artifacts per architecture and a
# universal build doubles every download for nothing. Linux arm64 is a
# native lane too — the app's webkit2gtk dependency does not cross-compile.
name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('release {0} at {1}', inputs.tag, inputs.release_commit) || format('main build {0}', github.sha) }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, v followed by the built version
        type: string
        required: true
      release_commit:
        description: Full merged commit ID from main
        type: string
        required: true
      release_pr:
        description: Merged release collation pull request number
        type: string
        required: true

permissions:
  contents: read

env:
  APT_ACQUIRE_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

# Hold the whole main run through publication: a pending matrix target can
# otherwise be replaced even when another target of that run is building.
# Release dispatches get unique workflow groups and job-level groups.
concurrency:
  group: release-workflow-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  # Environment admission judges the run ref, not the checkout. A dispatch
  # must prove its selected code belongs to this reviewed main history before
  # any build can receive signing secrets.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.source.outputs.mode }}
      source-commit: ${{ steps.source.outputs.source-commit }}
      release-tag: ${{ steps.source.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the release source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
          REQUESTED_PR: ${{ inputs.release_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$RUN_REF" != refs/heads/main ]; then
            echo "::error::release-source: ref=$RUN_REF"
            echo "Release source selection requires a main workflow run."
            exit 1
          fi
          mode=main
          source_commit="$GITHUB_SHA"
          release_tag=""
          case "$EVENT_NAME" in
            push) ;;
            workflow_dispatch)
              mode=release
              if [[ ${#REQUESTED_COMMIT} -ne 40 || "$REQUESTED_COMMIT" == *[!0-9a-f]* ]]; then
                echo "::error::release-source: commit=$REQUESTED_COMMIT"
                echo "release_commit must be a full lowercase commit ID."
                exit 1
              fi
              source_commit=$(git rev-parse --verify "${REQUESTED_COMMIT}^{commit}")
              if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
                echo "::error::release-source: ancestry=$source_commit"
                echo "The release commit is outside this reviewed main history, or its ancestry could not be read."
                exit 1
              fi
              case "$REQUESTED_TAG" in
                v?*) ;;
                *) echo "::error::release-source: tag=$REQUESTED_TAG"; echo "The requested release tag must start with v and name a version."; exit 1 ;;
              esac
              git check-ref-format "refs/tags/$REQUESTED_TAG"
              if [[ ! "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::release-source: pr=$REQUESTED_PR"
                echo "release_pr must be a pull request number."
                exit 1
              fi
              provenance=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUESTED_PR" --jq \
                '[.merged, .base.ref, .merge_commit_sha, .head.sha] | @tsv')
              IFS=$'\t' read -r merged base merge_commit collation_commit <<< "$provenance"
              if [ "$merged:$base:$merge_commit" != "true:main:$source_commit" ]; then
                echo "::error::release-source: provenance=$REQUESTED_PR:$source_commit"
                echo "The release pull request must name this merged commit on main."
                exit 1
              fi
              # A squash merge does not retain the PR head in main's ancestry.
              git fetch --no-tags origin "refs/pull/$REQUESTED_PR/head"
              git rev-parse --verify --end-of-options "${collation_commit}^{commit}" > /dev/null
              fragments=$(git ls-tree -r --name-only "$collation_commit" -- changelog.d)
              if [ "$fragments" != changelog.d/README.md ]; then
                echo "::error::release-source: fragments=$collation_commit"
                echo "The collation head must contain only changelog.d/README.md under changelog.d."
                exit 1
              fi
              skills/commit-guards/scripts/changelog-entries --release "$source_commit"
              release_tag="$REQUESTED_TAG"
              ;;
            *) echo "::error::release-source: event=$EVENT_NAME"; echo "This event cannot select a release source."; exit 1 ;;
          esac
          {
            echo "mode=$mode"
            echo "source-commit=$source_commit"
            echo "release-tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    concurrency:
      group: release-build-${{ needs.prepare.outputs.mode == 'main' && github.ref || github.run_id }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # The last Intel macOS image GitHub offers.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    # The main-only environment excludes edited branch and tag workflows.
    environment: kendex
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.target == 'x86_64-apple-darwin'
        with:
          key: ${{ matrix.target }}
          save-if: ${{ needs.prepare.outputs.mode == 'main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Record the main build commit
        if: needs.prepare.outputs.mode == 'main'
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
        run: |
          echo "KENDEX_GIT_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"
          echo "KENDEX_MAIN_BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
        shell: bash
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          # The x86_64 runner's Azure mirror has stalled package downloads.
          # Keep the image's suites and signing key on the official archive.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            sudo sed -i \
              -e 's|://azure\.archive\.ubuntu\.com/|://archive.ubuntu.com/|g' \
              -e 's|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update
          sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev xdg-utils libarchive-tools
        shell: bash
      - run: npm ci --prefix ui
        shell: bash
      # An explicit --target on every lane puts the output under
      # target/<triple>/release everywhere, so the staging step below
      # reads one layout instead of one per runner.
      - run: cargo build --release -p kendex-cli --target ${{ matrix.target }}
        shell: bash
      # Tauri's bundler signs and notarizes on its own when the APPLE_*
      # variables are present, and it checks presence, not content, so
      # the unset-secret gate must happen before they enter the
      # environment. The seven secrets are one unit: all set exports
      # them, none set builds unsigned, anything in between fails here
      # rather than shipping a signed-but-unnotarized bundle. The key
      # lands on disk because notarytool takes a path.
      - name: Stage macOS signing environment
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          missing=""
          for name in CERT CERT_PW IDENTITY TEAM ISSUER KEY_ID KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ "$missing" = " CERT CERT_PW IDENTITY TEAM ISSUER KEY_ID KEY_P8" ]; then
            echo "No APPLE_* secrets: building unsigned."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Partial Apple signing config; missing:$missing. Set all seven APPLE_* secrets or none."
            exit 1
          fi
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            # The certificate is base64 that may arrive line-wrapped;
            # GITHUB_ENV's NAME=VALUE form holds one line, and tauri
            # decodes it whitespace-free either way.
            echo "APPLE_CERTIFICATE=$(tr -d '[:space:]' <<<"$CERT")"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_TEAM_ID=$TEAM"
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      # The command the lane just built goes into this lane's installers:
      # the .deb and .rpm install it at /usr/bin/kendex, the macOS bundle
      # carries it as the sidecar Contents/MacOS/kendex, signed and
      # notarized with the app, and the Windows setup installs it as
      # bin\kendex.exe under the install directory and puts that directory
      # on the user PATH. Each platform's mechanism is its overlay under
      # crates/app/release/, passed to `tauri build --config` below and
      # kept out of tauri.conf.json: tauri-build copies externalBin and
      # resources at compile time, so a key in the base config would make
      # every plain `cargo build -p kendex-app` need a staged command.
      #
      # The overlays name the staged file under target/bundle-cli, one
      # spelling per mechanism: tauri's sidecar rule looks for
      # `<name>-<triple>`, and its two file maps take the path as written.
      - name: Stage the command for the bundle
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          case "${{ runner.os }}" in
            macOS) staged="target/bundle-cli/kendex-${{ matrix.target }}" ;;
            Linux | Windows) staged="target/bundle-cli/kendex${ext}" ;;
            *) echo "::error::No overlay bundles the command on ${{ runner.os }}."; exit 1 ;;
          esac
          mkdir -p target/bundle-cli
          cp "target/${{ matrix.target }}/release/kendex${ext}" "$staged"
          echo "KENDEX_BUNDLE_OVERLAY=release/$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]').json" >> "$GITHUB_ENV"
        shell: bash
      # Tauri's bundle_dmg.sh drives hdiutil, which fails intermittently on
      # GitHub's macOS runners after the app is built, signed and
      # notarized; one lost lane skips the main-channel publish. A failure
      # tauri reports as `error running bundle_dmg.sh` bundles once more;
      # any other failure, or a second one, fails the step. The first
      # attempt's output stays in the job log. Its bundle directory is
      # removed first: a failed bundle_dmg.sh leaves its rw.<pid>.*.dmg
      # scratch image there, and staging would publish it beside the real
      # DMG.
      - name: Bundle the desktop app
        run: |
          log="$RUNNER_TEMP/tauri-build.log"
          for attempt in 1 2; do
            status=0
            (cd crates/app && ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --config "$KENDEX_BUNDLE_OVERLAY") 2>&1 | tee "$log" || status=$?
            [ "$status" -eq 0 ] && exit 0
            if [ "$attempt" -eq 2 ] || ! grep -q 'error running bundle_dmg.sh' "$log"; then
              exit "$status"
            fi
            echo "::warning::bundle_dmg.sh failed; bundling once more."
            rm -rf "target/${{ matrix.target }}/release/bundle"
          done
        shell: bash
        env:
          # Required: every lane bundles an updater-enabled target, so
          # an unset key fails bundling rather than skipping signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing and notarization arrive
          # from the staging step above via GITHUB_ENV, only when the
          # secrets exist. APPLE_API_KEY there is the key ID in tauri's
          # vocabulary; the .p8 content travels by APPLE_API_KEY_PATH.
      # Every installer this lane built carries a working command, and it
      # answers the version the lane's own command answers, before any of
      # them is staged for the release. An installer that lost the command
      # is a download that installs the app alone, which is the state the
      # overlays exist to end, and nothing after this step would notice.
      - name: Check each installer carries the command
        if: runner.os != 'Windows'
        run: tools/release-installer-check "${{ matrix.target }}" "target/${{ matrix.target }}/release"
        shell: bash
      # The Windows check installs the setup for real: silently, into a
      # directory of its own, then uninstalls it. That is the only way to
      # reach what the setup does beyond copying files — the PATH entry its
      # hooks write, as REG_EXPAND_SZ, and take away again.
      - name: Check the Windows setup installs and removes the command
        if: runner.os == 'Windows'
        run: tools/release-installer-check.ps1 -Target "${{ matrix.target }}" -Out "target/${{ matrix.target }}/release"
        shell: pwsh
      - name: Stage release assets
        run: |
          mkdir -p dist
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          out="target/${{ matrix.target }}/release"
          cp "${out}/kendex${ext}" "dist/kendex-${{ matrix.target }}${ext}"
          find "${out}/bundle" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' \) \
            -exec cp {} dist/ \;
          # Tauri names the macOS updater archive after the app alone, so
          # the two Apple lanes would overwrite each other in the merged
          # release; the target goes into the file name here.
          find "${out}/bundle" -type f -name '*.app.tar.gz*' | while read -r f; do
            cp "$f" "dist/kendex-${{ matrix.target }}.app.tar.gz${f##*.app.tar.gz}"
          done
          ls -l dist
        shell: bash
      # A signature proves the bytes it covers and not which release they
      # are, so this lane also publishes the document that says what it
      # built: the version, the target, and the hash of each download.
      # `kendex update` and the app's Update button hold every download to
      # it. The script signs the document and the command under the same
      # key the app bundles with, and fails the lane rather than publishing
      # a download no client can verify.
      - name: Sign this lane's downloads
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
        run: |
          version="${RELEASE_TAG#v}"
          if [ "$RELEASE_MODE" = main ]; then
            ext=""
            [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
            built=$("dist/kendex-${{ matrix.target }}${ext}" --version)
            version=${built##* }
          fi
          tools/release-digests "${{ matrix.target }}" "$version" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      # The cache saves after the job's steps. Remove installers even when
      # an earlier step fails, before that post-job action can save them.
      - name: Remove Intel macOS bundles before caching
        if: always() && matrix.target == 'x86_64-apple-darwin'
        run: rm -rf target/x86_64-apple-darwin/release/bundle
        shell: bash

  publish:
    needs: [prepare, build]
    environment: kendex
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.source-commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: ${{ needs.prepare.outputs.mode == 'main' && 'main' || 'publish' }}
    concurrency:
      group: release-publish-${{ github.run_id }}
      cancel-in-progress: false
    # The channel job reads a candidate tag's kind and version through these outputs.
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      main-build: ${{ steps.tag.outputs.main-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # What kind of tag this is, decided once for every step below, and
      # taken from the version this release was built as rather than from
      # the tag's punctuation. Nothing here can run kendex's own parser, and
      # a regex written to stand in for it is not SemVer: it admits
      # v01.0.0, v1.0.0-01 and v1.0.0-alpha..1, which the parser refuses, so
      # the release would publish a manifest version every candidate then
      # fails to read. Cargo will not build a package whose version is not
      # SemVer, so the string read back here has already been through that
      # parser, and holding the tag to it is a real verdict rather than a
      # second opinion about one.
      #
      # It is also the check the app-deploy skill asks for and nothing
      # enforced. A tag naming a version no artifact carries publishes a
      # feed pointing at downloads that are not there, which every install
      # reads as a release it cannot fetch.
      - name: Classify the tag
        id: tag
        shell: bash
        run: |
          # The artifact upload does not carry the executable bit across.
          built_cli=dist/kendex-x86_64-unknown-linux-gnu
          chmod +x "$built_cli"
          if ! built=$("./$built_cli" --version); then
            echo "::error::Could not read the version back from ${built_cli}, so nothing here can say what this release was built as."
            exit 1
          fi
          built=${built##* }
          version="${RELEASE_TAG#v}"
          release_ref="$RELEASE_TAG"
          release_name="$RELEASE_TAG"
          commit=""
          channel=""
          main_build=""
          if [ "$RELEASE_MODE" = main ]; then
            version="$built"
            commit="$SOURCE_COMMIT"
            main_build="$GITHUB_RUN_NUMBER"
            release_ref="main-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${commit}"
            release_name="main build ${GITHUB_RUN_NUMBER}"
            channel=rolling-main
            case "$version" in
              *".main.${GITHUB_RUN_NUMBER}.${commit}") ;;
              *"+main.${GITHUB_RUN_NUMBER}.${commit}") ;;
              *) echo "::error::The main build reports ${version}, which does not name build ${GITHUB_RUN_NUMBER} at commit ${commit}."; exit 1 ;;
            esac
          elif [ "$version" != "$built" ]; then
            echo "::error::Tag ${RELEASE_TAG} names version ${version}, and this release was built as ${built}. Dispatch the tag and merged commit that carry the same version."
            exit 1
          fi
          # SemVer keeps build metadata after a `+` and out of the version,
          # so the `-` opening a pre-release is only a `-` in what is left:
          # 1.0.0+build-1 is a full release. On a string a parser has
          # already accepted, that is the grammar rather than a guess about
          # it. Asking only whether the tag contains a `-` calls
          # v1.0.0+build-1 a candidate while the build it produces reads
          # itself as a release and follows release URLs, which is the two
          # halves disagreeing about one tag.
          if [ -n "$commit" ]; then
            prerelease=true
          else
            case "${version%%+*}" in
              *-*) prerelease=true; channel=prerelease ;;
              *) prerelease=false ;;
            esac
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release-ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "release-name=$release_name" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "main-build=$main_build" >> "$GITHUB_OUTPUT"
          echo "source-commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      # A retry may reuse a matching tag. Creation never moves an existing
      # tag, and readback binds the release to the code its artifacts carry.
      - name: Create and verify the version tag
        if: needs.prepare.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read_tag_target() {
            local remote status=0 sha ref peeled=""
            tag_target=""
            remote=$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}") || status=$?
            [ "$status" -eq 0 ] || return "$status"
            while read -r sha ref; do
              case "$ref" in
                "refs/tags/$RELEASE_TAG") tag_target="$sha" ;;
                "refs/tags/$RELEASE_TAG^{}") peeled="$sha" ;;
              esac
            done <<< "$remote"
            tag_target="${peeled:-$tag_target}"
            [ -n "$tag_target" ]
          }
          status=0
          read_tag_target || status=$?
          case "$status" in
            0) ;;
            2)
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_COMMIT"
              ;;
            *) echo "::error::release-tag: read=$RELEASE_TAG"; echo "Could not read the requested remote tag."; exit "$status" ;;
          esac
          read_tag_target
          if [ "$tag_target" != "$SOURCE_COMMIT" ]; then
            echo "::error::release-tag: target=$tag_target"
            echo "The release tag targets a different commit. It will not be moved."
            exit 1
          fi
      - name: Write the update feed
        run: |
          version="${{ steps.tag.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.release-ref }}"
          commit="${{ steps.tag.outputs.commit }}"
          commit_field=""
          [ -z "$commit" ] || commit_field="  \"main_build\": ${{ steps.tag.outputs.main-build }},
            \"commit\": \"${commit}\","
          cat > dist/feed.json << EOF
          {
            "schema": 1,
          ${commit_field}
            "version": "${version}",
            "assets": {
              "x86_64-unknown-linux-gnu": "${base}/kendex-x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu": "${base}/kendex-aarch64-unknown-linux-gnu",
              "aarch64-apple-darwin": "${base}/kendex-aarch64-apple-darwin",
              "x86_64-apple-darwin": "${base}/kendex-x86_64-apple-darwin",
              "x86_64-pc-windows-msvc": "${base}/kendex-x86_64-pc-windows-msvc.exe"
            }
          }
          EOF
          cat dist/feed.json
      # Tagged app installs use this manifest directly. The main feed later
      # includes it as the fixed channel's single snapshot. Each entry pairs
      # a download with the minisign signature the running app checks before
      # it replaces itself. Every lane is updater-enabled and every
      # one is expected to sign, so a platform missing here is a lane that
      # stopped producing or staging its signature. Publishing without it
      # leaves that platform offering an Update its own manifest cannot
      # answer, so a missing platform fails the job by name.
      - name: Write the signed update manifest
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.release-ref }}"
          platforms='{}'
          missing=""
          add() {
            local key=$1 sig="" candidate
            for candidate in dist/$2; do
              [ -f "$candidate" ] && { sig="$candidate"; break; }
            done
            if [ -z "$sig" ]; then
              missing="${missing} ${key}"
              return 0
            fi
            platforms=$(jq \
              --arg key "$key" \
              --arg signature "$(cat "$sig")" \
              --arg url "${base}/$(basename "${sig%.sig}")" \
              '.[$key] = {signature: $signature, url: $url}' <<< "$platforms")
          }
          add linux-x86_64 'kendex_*_amd64.AppImage.sig'
          add linux-aarch64 'kendex_*_aarch64.AppImage.sig'
          add darwin-x86_64 'kendex-x86_64-apple-darwin.app.tar.gz.sig'
          add darwin-aarch64 'kendex-aarch64-apple-darwin.app.tar.gz.sig'
          add windows-x86_64 'kendex_*_x64-setup.exe.sig'
          if [ -n "$missing" ]; then
            echo "::error::No signed updater artifact reached dist/ for:${missing}. Every release lane signs; check that lane and TAURI_SIGNING_PRIVATE_KEY, then rerun the failed release jobs."
            exit 1
          fi
          jq -n \
            --arg version "${{ steps.tag.outputs.version }}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' > dist/latest.json
          cat dist/latest.json
      - name: Bind the channel pointer to immutable downloads
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tag.outputs.release-ref }}"
          jq --slurpfile latest dist/latest.json \
            --arg base "$base" \
            '. + $latest[0] + {
              apps: {
                "x86_64-unknown-linux-gnu": $latest[0].platforms["linux-x86_64"].url,
                "aarch64-unknown-linux-gnu": $latest[0].platforms["linux-aarch64"].url
              },
              digests: {
                "x86_64-unknown-linux-gnu": ($base + "/digests-x86_64-unknown-linux-gnu.json"),
                "aarch64-unknown-linux-gnu": ($base + "/digests-aarch64-unknown-linux-gnu.json"),
                "aarch64-apple-darwin": ($base + "/digests-aarch64-apple-darwin.json"),
                "x86_64-apple-darwin": ($base + "/digests-x86_64-apple-darwin.json"),
                "x86_64-pc-windows-msvc": ($base + "/digests-x86_64-pc-windows-msvc.json")
              }
            }' dist/feed.json > dist/feed.complete.json
          mv dist/feed.complete.json dist/feed.json
          cat dist/feed.json
      # A full release lands as a draft to review before publishing makes it
      # "latest" (the app-deploy skill). A pre-release cannot: its assets are
      # unreachable while it is a draft, so nothing could install it, and
      # testing the update path end to end is the whole reason a tag like
      # v1.0.0-rc2 is cut. Publishing it reaches nobody who is not already
      # on a candidate — GitHub resolves "latest" past every pre-release.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          tag_name: ${{ steps.tag.outputs.release-ref }}
          name: ${{ steps.tag.outputs.release-name }}
          target_commitish: ${{ steps.tag.outputs.source-commit }}
          draft: ${{ steps.tag.outputs.prerelease == 'false' }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.mode == 'main' && 'false' || 'legacy' }}
      # GITHUB_TOKEN publication does not trigger release-event workflows.
      # A stable draft is published by the operator and uses the AUR bridge.
      - name: Dispatch candidate AUR publication on main
        if: needs.prepare.outputs.mode == 'release' && steps.tag.outputs.channel == 'prerelease'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-aur.yml --repo "$GITHUB_REPOSITORY" --ref main
      # The channel job writes only feed.json onto the fixed release. The
      # Linux CLI authenticates a main pointer and orders candidate versions.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: |
            dist/feed.json
            dist/digests-*
            dist/kendex-x86_64-unknown-linux-gnu
          if-no-files-found: error

  # Because "latest" skips pre-releases, a candidate and a main build each
  # need one fixed discovery URL. This job owns that single feed pointer.
  #
  # The concurrency group holds this job and nothing else, because it is not a
  # queue — GitHub keeps one pending run per group and replaces that pending
  # run when another arrives. Inside the group, a burst keeps the first arrival
  # and the last
  # and drops every repoint in between; outside it, every dispatch publishes.
  # Rerunning the newest release's channel job moves the pointer to it.
  channel:
    needs: publish
    if: needs.publish.outputs.channel != ''
    environment: kendex
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-channel-${{ needs.publish.outputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifests
          path: dist
      - name: Point the rolling channel at this build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.publish.outputs.channel }}
          NEW_VERSION: ${{ needs.publish.outputs.version }}
          NEW_BUILD: ${{ needs.publish.outputs.main-build }}
        run: tools/release-channel-point
