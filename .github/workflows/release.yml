# Release: build the CLI and the desktop app on a native runner per
# target, then publish a GitHub Release carrying every artifact, the
# feed.json that `kendex update` consumes, the latest.json the app's Update
# button installs from, and the signed digests document each lane publishes
# about what it built.
#
# Tag push only: a release bundle is the most expensive job in the repo,
# and pull requests are covered by the per-crate checks. No build cache:
# the only release-profile cache main saves (catalog-check's x86_64
# kendex-cli build) is keyed to that job and built without --target, so no
# lane here could restore it; a cache step would only pay for saves that
# tag runs never reuse. Every lane runs
# on a GitHub-standard runner, which is free for a public repository.
# Each Apple architecture gets its own native lane rather than one
# universal binary: the updater keys its artifacts per architecture and a
# universal build doubles every download for nothing. Linux arm64 is a
# native lane too — the app's webkit2gtk dependency does not cross-compile.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # The last Intel macOS image GitHub offers.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
        shell: bash
      - run: npm ci --prefix ui
        shell: bash
      # An explicit --target on every lane puts the output under
      # target/<triple>/release everywhere, so the staging step below
      # reads one layout instead of one per runner.
      - run: cargo build --release -p kendex-cli --target ${{ matrix.target }}
        shell: bash
      # Tauri's bundler signs and notarizes on its own when the APPLE_*
      # variables are present, and it checks presence, not content, so
      # the unset-secret gate must happen before they enter the
      # environment. The seven secrets are one unit: all set exports
      # them, none set builds unsigned, anything in between fails here
      # rather than shipping a signed-but-unnotarized bundle. The key
      # lands on disk because notarytool takes a path.
      - name: Stage macOS signing environment
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          missing=""
          for name in CERT CERT_PW IDENTITY TEAM ISSUER KEY_ID KEY_P8; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ "$missing" = " CERT CERT_PW IDENTITY TEAM ISSUER KEY_ID KEY_P8" ]; then
            echo "No APPLE_* secrets: building unsigned."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Partial Apple signing config; missing:$missing. Set all seven APPLE_* secrets or none."
            exit 1
          fi
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            # The certificate is base64 that may arrive line-wrapped;
            # GITHUB_ENV's NAME=VALUE form holds one line, and tauri
            # decodes it whitespace-free either way.
            echo "APPLE_CERTIFICATE=$(tr -d '[:space:]' <<<"$CERT")"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_TEAM_ID=$TEAM"
            echo "APPLE_API_ISSUER=$ISSUER"
            echo "APPLE_API_KEY=$KEY_ID"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
      - name: Bundle the desktop app
        run: cd crates/app && ../../ui/node_modules/.bin/tauri build --target ${{ matrix.target }}
        shell: bash
        env:
          # Required: every lane bundles an updater-enabled target, so
          # an unset key fails bundling rather than skipping signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID signing + notarization (KEN-394) arrives
          # from the staging step above via GITHUB_ENV, only when the
          # secrets exist. APPLE_API_KEY there is the key ID in tauri's
          # vocabulary; the .p8 content travels by APPLE_API_KEY_PATH.
      - name: Stage release assets
        run: |
          mkdir -p dist
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          out="target/${{ matrix.target }}/release"
          cp "${out}/kendex${ext}" "dist/kendex-${{ matrix.target }}${ext}"
          find "${out}/bundle" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \
               -o -name '*.AppImage.sig' -o -name '*-setup.exe.sig' \) \
            -exec cp {} dist/ \;
          # Tauri names the macOS updater archive after the app alone, so
          # the two Apple lanes would overwrite each other in the merged
          # release; the target goes into the file name here.
          find "${out}/bundle" -type f -name '*.app.tar.gz*' | while read -r f; do
            cp "$f" "dist/kendex-${{ matrix.target }}.app.tar.gz${f##*.app.tar.gz}"
          done
          ls -l dist
        shell: bash
      # A signature proves the bytes it covers and not which release they
      # are, so this lane also publishes the document that says what it
      # built: the version, the target, and the hash of each download.
      # `kendex update` and the app's Update button hold every download to
      # it. The script signs the document and the command under the same
      # key the app bundles with, and fails the lane rather than publishing
      # a download no client can verify.
      - name: Sign this lane's downloads
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tools/release-digests "${{ matrix.target }}" "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Where this tag's kind and version reach the channel job below, now
    # that the repoint is no longer a step here.
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What kind of tag this is, decided once for every step below, and
      # taken from the version this release was built as rather than from
      # the tag's punctuation. Nothing here can run kendex's own parser, and
      # a regex written to stand in for it is not SemVer: it admits
      # v01.0.0, v1.0.0-01 and v1.0.0-alpha..1, which the parser refuses, so
      # the release would publish a manifest version every candidate then
      # fails to read. Cargo will not build a package whose version is not
      # SemVer, so the string read back here has already been through that
      # parser, and holding the tag to it is a real verdict rather than a
      # second opinion about one.
      #
      # It is also the check docs/RELEASING.md asks for and nothing
      # enforced. A tag naming a version no artifact carries publishes a
      # feed pointing at downloads that are not there, which every install
      # reads as a release it cannot fetch.
      - name: Classify the tag
        id: tag
        shell: bash
        run: |
          # The artifact upload does not carry the executable bit across.
          built_cli=dist/kendex-x86_64-unknown-linux-gnu
          chmod +x "$built_cli"
          if ! built=$("./$built_cli" --version); then
            echo "::error::Could not read the version back from ${built_cli}, so nothing here can say what this release was built as."
            exit 1
          fi
          built=${built##* }
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$built" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} names version ${version}, and this release was built as ${built}. The tag is the version without its leading v; bump the version to match, or re-tag the commit that carries it."
            exit 1
          fi
          # SemVer keeps build metadata after a `+` and out of the version,
          # so the `-` opening a pre-release is only a `-` in what is left:
          # 1.0.0+build-1 is a full release. On a string a parser has
          # already accepted, that is the grammar rather than a guess about
          # it. Asking only whether the tag contains a `-` calls
          # v1.0.0+build-1 a candidate while the build it produces reads
          # itself as a release and follows release URLs, which is the two
          # halves disagreeing about one tag.
          case "${version%%+*}" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write the update feed
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > dist/feed.json << EOF
          {
            "schema": 1,
            "version": "${version}",
            "assets": {
              "x86_64-unknown-linux-gnu": "${base}/kendex-x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu": "${base}/kendex-aarch64-unknown-linux-gnu",
              "aarch64-apple-darwin": "${base}/kendex-aarch64-apple-darwin",
              "x86_64-apple-darwin": "${base}/kendex-x86_64-apple-darwin",
              "x86_64-pc-windows-msvc": "${base}/kendex-x86_64-pc-windows-msvc.exe"
            }
          }
          EOF
          cat dist/feed.json
      # The app installs from this manifest, not from feed.json: each entry
      # pairs a download with the minisign signature the running app checks
      # before it replaces itself. Every lane is updater-enabled and every
      # one is expected to sign, so a platform missing here is a lane that
      # stopped producing or staging its signature. Publishing without it
      # leaves that platform offering an Update its own manifest cannot
      # answer, so a missing platform fails the job by name.
      - name: Write the signed update manifest
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          platforms='{}'
          missing=""
          add() {
            local key=$1 sig="" candidate
            for candidate in dist/$2; do
              [ -f "$candidate" ] && { sig="$candidate"; break; }
            done
            if [ -z "$sig" ]; then
              missing="${missing} ${key}"
              return 0
            fi
            platforms=$(jq \
              --arg key "$key" \
              --arg signature "$(cat "$sig")" \
              --arg url "${base}/$(basename "${sig%.sig}")" \
              '.[$key] = {signature: $signature, url: $url}' <<< "$platforms")
          }
          add linux-x86_64 'kendex_*_amd64.AppImage.sig'
          add linux-aarch64 'kendex_*_aarch64.AppImage.sig'
          add darwin-x86_64 'kendex-x86_64-apple-darwin.app.tar.gz.sig'
          add darwin-aarch64 'kendex-aarch64-apple-darwin.app.tar.gz.sig'
          add windows-x86_64 'kendex_*_x64-setup.exe.sig'
          if [ -n "$missing" ]; then
            echo "::error::No signed updater artifact reached dist/ for:${missing}. Every release lane signs; check that lane and TAURI_SIGNING_PRIVATE_KEY, then re-run the tag."
            exit 1
          fi
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' > dist/latest.json
          cat dist/latest.json
      # A full release lands as a draft to review before publishing makes it
      # "latest" (docs/RELEASING.md). A pre-release cannot: its assets are
      # unreachable while it is a draft, so nothing could install it, and
      # testing the update path end to end is the whole reason a tag like
      # v1.0.0-rc2 is cut. Publishing it reaches nobody who is not already
      # on a candidate — GitHub resolves "latest" past every pre-release.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: ${{ steps.tag.outputs.prerelease == 'false' }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
      # The channel job writes these onto the fixed pre-release release. The
      # Linux CLI travels with them and is not published: it is what the
      # channel job's guard runs `version-compare` on, so the channel is
      # ordered by the parser every candidate reads its feed with rather
      # than by a second opinion about SemVer.
      - uses: actions/upload-artifact@v4
        with:
          name: manifests
          path: |
            dist/latest.json
            dist/feed.json
            dist/digests-*
            dist/kendex-x86_64-unknown-linux-gnu
          if-no-files-found: error

  # Because "latest" skips pre-releases, a candidate has no way to reach the
  # next one. This release is that way: one fixed tag whose manifests and
  # digests documents are overwritten by each new candidate, which is the URL
  # `update_channel::feed_url_for` sends a candidate to. They name their
  # downloads by the tag that built them, so what they point at is that tag's
  # own release, published by the job above.
  #
  # That one mutable pointer is what the concurrency group is for: two runs
  # interleaving their reads and writes of it would leave the older manifests
  # in place. The group holds this job and nothing else, because it is not a
  # queue — GitHub keeps one pending run per group and replaces that pending
  # run when another arrives (.github/workflows/review-gate-writer.yml records
  # the same). Inside the group, a burst keeps the first arrival and the last
  # and drops every repoint in between; outside it, every tag publishes. So a
  # burst costs repoints and never a release, and pushing the newest tag again
  # moves the channel to it, which is what docs/RELEASING.md records.
  channel:
    needs: publish
    if: needs.publish.outputs.prerelease == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manifests
          path: dist
      - name: Point the pre-release channel at this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: prerelease
          NEW_VERSION: ${{ needs.publish.outputs.version }}
        run: tools/release-channel-point
