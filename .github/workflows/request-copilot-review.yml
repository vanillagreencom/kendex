# review-gate owns this central workflow. No consumer copies or renders it.
# The organization workflows rule pins this file from vanillagreencom/kendex.
# D078 in fleet keeps CI and GitHub's native review requirements as the gates.
# A failed review request warns and passes: a second review-status writer can
# leave a pull request waiting forever after its writer disappears.
name: Request Copilot review

"on":
  pull_request: {}
  merge_group: {}

# contents: read lets the checkout below read a private repository.
permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    # REVISIT(D023): Require Copilot again if render proof admits consumer product changes.
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft && !(github.event.pull_request.head.ref == 'kendex/refresh' && github.event.pull_request.user.login == 'vanillagreen-fleet-lanes[bot]' && github.event.pull_request.user.type == 'Bot')
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      # The classifier reads the range between both endpoints, so the checkout
      # holds the whole history. It reads the pull request's tree with kendex
      # main's classifier and executes none of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A classifier failure must never redden this required workflow: the
      # step continues with no quick output, and the request below stays.
      - id: classify
        continue-on-error: true
        uses: vanillagreencom/kendex/.github/actions/change-class@main
        with:
          event: ${{ github.event_name }}
          base: ${{ format('{0}^1', github.sha) }}
          head: ${{ github.event.pull_request.head.sha }}
      # GitHub gives a pull_request run from a fork a read-only token, so a
      # fork head is skipped before a request that would fail. Dependabot
      # heads keep the request: the permissions key above raises their token.
      # A proved quick change skips the request on the literal true alone.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUICK: ${{ steps.classify.outputs.quick }}
        with:
          script: |
            try {
              const pr = context.payload.pull_request;
              if (pr.head.repo?.full_name !== pr.base.repo.full_name) {
                core.info(`copilot-request: skipped=${pr.number} reason=fork-read-only-token`);
                return;
              }
              if (process.env.QUICK === 'true') {
                core.info(`copilot-request: skipped=${pr.number} reason=quick-proof`);
                return;
              }
              await github.rest.pulls.requestReviewers({
                ...context.repo,
                pull_number: pr.number,
                reviewers: ['copilot-pull-request-reviewer[bot]']
              });
              core.info(`copilot-request: requested=${pr.number}`);
            } catch (error) {
              core.warning(`copilot-request: unavailable status=${error.status ?? 'unknown'}: ${error.message}`);
            }
