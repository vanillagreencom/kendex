name: Skill Tests

# Runs every skill's, hook's and pi-extension's own test suite — the same
# suites fix cycles run locally — plus the workspace's cargo tests. Upstream
# gating here is what lets consuming repos drop tracked vendoring: quality is
# proven at the source, not re-proven per consumer.
#
# THE FULL BATTERY RUNS ON EVERY EVENT: every shard, the aggregator over them
# and every cargo lane runs on pull_request as well as in the merge queue and
# on the push to main, so a green PR has proven what the queue re-proves and
# an ejection — dequeue, fix, requeue, pay the merge latency again — is rare
# instead of routine. Whatever does NOT run on every event carries its own
# `if:` saying why. The review gate never conditions CI (it answers
# review-only; see the review-gate skill) — no gate job reads the predicate.
#
# Time to merge is the metric and hardware follows, for the shard job alone:
# its merge_group and push legs take the org's paid Blacksmith runners and its
# pull_request legs free GitHub-hosted ones, so shard durations do not compare
# across events. Every other job here is GitHub-hosted whatever the event.
#
# Heavy jobs run on Blacksmith when the org's CI_RUNNER_* variables are set,
# falling back to GitHub-hosted so the workflow runs anywhere.

"on":
  pull_request:
  # Required checks must exist on merge-group shas too, or queue entries
  # block forever on contexts nothing creates (VST-10). And a re-queued
  # entry can inherit a stale FAILED run when the group resolves to the
  # same synthetic sha — the queue ejects it citing the previous attempt
  # while the fresh run is still green. The recovery is dequeue-push-rearm:
  # a new head mints a new group.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # SHARDED: five shards bound wall time at the slowest shard and give suite
  # growth per-shard headroom instead of a shared cliff. `orch` and `rest`
  # were one `shell` shard whose halves ran serially and bounded every queue
  # run; `pi-claude-bridge` was the node shard's hottest step. The ruleset's
  # required context is the AGGREGATOR below — shard names are not, so shards
  # can be rebalanced or added without touching repo settings.
  skill-suites-shard:
    name: Skill suites shard (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [review-gate, orch, rest, node, pi-claude-bridge]
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER_4V || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # THE load-bearing shard guard, and the only check in this job with no
      # `if:`: a check that carries one can be switched off by the very drift
      # it reports, so the rule lives here rather than in a suite. A step
      # naming a shard the matrix dropped is skipped on every run and reads as
      # one that passed; a shard no step names runs this guard and nothing
      # else, green and empty. package-policy.test.mjs executes THIS script
      # against mutated copies — it carries the control, not a second rule.
      - name: shard names agree with the matrix
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          declared="$(sed -n 's/^ \{8\}shard: \[\(.*\)\]$/\1/p' "$wf" | tr -d ' ' | tr ',' '\n' | sort -u)"
          # Stage one keeps `if:` keys only, so a shard named in a comment or
          # a script is not a step that runs it; stage two's -o prints EVERY
          # comparison, so a compound condition is read whole. `|| true` sends
          # a no-match to the floor below, which says so, not to a bare abort.
          used="$(grep -oE "^ +if: .*" "$wf" | grep -oE "matrix\.shard == '[^']+'" | cut -d"'" -f2 | sort -u || true)"
          [ -n "$declared" ] && [ -n "$used" ] || { echo "no shard list, or no shard condition, read from $wf"; exit 1; }
          diff <(printf '%s\n' "$declared") <(printf '%s\n' "$used") || { echo "shard names disagree: '<' the matrix declares and no step names; '>' a step names and the matrix does not run"; exit 1; }
          printf '%s\n' "$declared" | grep -qxF "$SHARD" || { echo "this leg's shard '$SHARD' is not in the matrix"; exit 1; }

      # ---- shard: review-gate — the heavyweight wrapper battery alone ----
      - name: review-gate suites
        if: matrix.shard == 'review-gate'
        run: |
          set -u
          fail=0
          failed=""
          for t in skills/review-gate/tests/*.sh; do
            echo "=== $t"
            if ! bash "$t"; then
              echo "FAILED: $t"
              fail=1
              failed="$failed $t"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAILED SUITES:$failed"
          fi
          exit "$fail"

      # ---- shard: orch — the orch battery alone --------------------------
      - name: orch suite (run-all)
        if: matrix.shard == 'orch'
        run: bash skills/orch/tests/run-all.sh

      # ---- shard: rest — the lints, and every shell suite no other shard
      # runs: the loop below skips orch's and review-gate's ----------------
      - name: executable bits on skill tests and scripts
        if: matrix.shard == 'rest'
        run: |
          set -u
          fail=0
          # A pathspec '*' crosses '/', so both skills patterns reach into
          # subdirectories. A lib and a control are SOURCED, never entry
          # points, and carry no mode bit — under either parent.
          while IFS= read -r f; do
            mode="$(git ls-files -s -- "$f" | cut -d' ' -f1)"
            if [ "$mode" = "100644" ]; then
              echo "not executable in git: $f"
              fail=1
            fi
          done < <(git ls-files -- 'skills/*/tests/*.sh' 'skills/*/scripts/*' 'hooks/tests/*.sh' | grep -vE '/(scripts|tests)/lib/|/tests/controls/')
          exit "$fail"

      # Tighten-only file-size gate against tools/size-ratchet-baseline.tsv
      # + tools/size-ratchet-excludes; reads tracked files at HEAD only. Runs
      # on every event because the preflight copy is NOT a required context:
      # only this one can block a PR, and a guard that cannot block is advice.
      - name: size-ratchet (tighten-only file-size gate)
        if: matrix.shard == 'rest'
        run: skills/size-ratchet/scripts/size-ratchet

      # Unconditioned for the same reason as the size gate above. The commit
      # lane runs todo-ban --staged and judges only what a commit adds; this
      # scan takes the rest, in every blob git reads as text.
      - name: todo-ban (index-wide work-marker scan)
        if: matrix.shard == 'rest'
        run: skills/growth-guards/scripts/todo-ban

      # Every skill must route problem reports through `kendex report`. The
      # ownership guard is a backstop for issues that bypassed it, so a skill
      # carrying only a `bugs:` URL sends agents to hand-file in this repo
      # regardless of who owns the asset.
      - name: skills point reports at `kendex report`
        if: matrix.shard == 'rest'
        run: |
          set -u
          fail=0
          while IFS= read -r f; do
            if ! grep -qF 'kendex report' "$f"; then
              echo "missing \`kendex report\` guidance: $f"
              fail=1
            fi
          done < <(git ls-files -- 'skills/*/SKILL.md')
          exit "$fail"

      # One scan for Bash 4+ syntax over the roster `tools/bash32-lint --list`
      # prints. bash32-lint.test.sh proves its teeth.
      - name: bash32-lint (Bash 3.2 portability across the skill tree)
        if: matrix.shard == 'rest'
        run: tools/bash32-lint

      # A failure is announced twice: inline where it happened, and in a
      # FAILED SUITES block at the end — the tail of a red job must name the
      # culprits instead of showing only the later suites passing.
      - name: all other skill suites
        if: matrix.shard == 'rest'
        run: |
          set -u
          fail=0
          failed=""
          for t in skills/*/tests/*.sh; do
            case "$t" in
              skills/orch/tests/*) continue ;;
              skills/review-gate/tests/*) continue ;; # its own shard
            esac
            echo "=== $t"
            if ! bash "$t"; then
              echo "FAILED: $t"
              fail=1
              failed="$failed $t"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAILED SUITES:$failed"
          fi
          exit "$fail"

      - name: tools and hook suites
        if: matrix.shard == 'rest'
        run: |
          set -u
          fail=0
          failed=""
          for t in tools/tests/*.test.sh hooks/tests/*.sh; do
            echo "=== $t"
            if ! bash "$t"; then
              echo "FAILED: $t"
              fail=1
              failed="$failed $t"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAILED SUITES:$failed"
          fi
          exit "$fail"

      # ---- shard: node — every node and bun suite here but the bridge's,
      # which the shard below runs -----------------------------------------
      # setup-node also serves the `pi-claude-bridge` shard's two steps below.
      - uses: actions/setup-node@v4
        if: matrix.shard == 'node' || matrix.shard == 'pi-claude-bridge'
        with:
          node-version: 22.19.0

      - name: deep-research node suite
        if: matrix.shard == 'node'
        run: node --test skills/deep-research/tests/deep-research.test.mjs

      - name: pi-extension package policy suite
        if: matrix.shard == 'node'
        run: node --test pi-extensions/package-policy.test.mjs

      - uses: oven-sh/setup-bun@v2
        if: matrix.shard == 'node'
        with:
          bun-version: 1.3.14

      # Pi 0.80.4 introduced agent_settled but was not published to npm;
      # 0.80.5 is the earliest installable compatible dependency set.
      - name: pi-qol regression suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-qol
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.80.5 @earendil-works/pi-ai@0.80.5 @earendil-works/pi-coding-agent@0.80.5 @earendil-works/pi-tui@0.80.5
          npm test

      - name: pi-output-policy suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-output-policy
        run: npm test

      # pi-hooks imports only types from pi-coding-agent, which bun erases,
      # so its suite runs with no install.
      - name: pi-hooks suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-hooks
        run: npm test

      # Pi 0.84.x is the release the extensions are audited against, so the
      # suites that assert 0.84 wire-format parity install that line rather
      # than the 0.80.5 floor above.
      # The two pane-preflight cases in pane-cwd-stale.test.ts call
      # ensureTmux(), which throws when $TMUX is unset; they skip themselves
      # on a bare runner the same way they already skip off Linux. The whole
      # directory is still globbed, so new test files run here without
      # editing this step.
      - name: pi-agents-tmux suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-agents-tmux
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1 typebox
          npm test

      # undici is pinned to the package's own declared range: installing it
      # unversioned resolves the registry's latest major, so the proxy
      # transport test would validate a different major than consumers
      # actually install.
      - name: pi-codex-minimal-tools suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-codex-minimal-tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1 typebox 'undici@^7.25.0'
          npm test

      # pi-questions unit tests are dependency-free by design (question-model
      # and rpc-fallback import nothing outside the package), so unlike the
      # suites above no npm install is needed.
      - name: pi-questions suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-questions
        run: npm test

      # The renderer imports pi-tui and pi-coding-agent, so unlike
      # pi-questions its suite needs the 0.84.1 install to resolve at all.
      # pi-ai and pi-agent-core are pinned alongside them because
      # pi-coding-agent pulls them transitively and an unpinned resolution
      # mismatches its exports.
      - name: pi-tool-renderer suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-tool-renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1
          npm test

      # pi-session-bridge imports nothing from Pi outside type positions, the
      # same case as pi-hooks above, so its suite runs with no install.
      - name: pi-session-bridge suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-session-bridge
        run: npm test

      # The suite mocks @earendil-works/pi-tui with bun's mock.module and
      # imports only the package's leaf modules, so the Pi value imports
      # elsewhere in the package are never loaded and no install is needed.
      - name: pi-session-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-session-manager
        run: npm test

      # pi-ai-compat.ts value-imports pi-ai, so unlike the two above this
      # suite needs a real install. The 0.84.1 line is what the extensions are
      # audited against; pi-agent-core, pi-coding-agent and pi-tui are pinned
      # alongside it because the package value-imports them too and an
      # unpinned resolution mismatches pi-coding-agent's exports.
      - name: pi-skills-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-skills-manager
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1
          npm test

      # `npm ci` rather than a pinned argument list because this suite needs
      # only what the package itself declares: tsx, which its script runs the
      # suite under. It imports Pi in type position only, so nothing it needs
      # falls outside the lockfile. The steps that pass explicit pins do so
      # because their suites need Pi packages declared as peer dependencies,
      # which a lockfile of theirs never resolves.
      - name: pi-caveman suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-caveman
        run: |
          npm ci --no-audit --no-fund
          npm test

      # youtube-transcript-plus is pinned to the package's own declared range
      # for the reason undici is above: unversioned resolves the registry's
      # latest major, so the transcript tests would validate a different major
      # than consumers install. The Pi packages and typebox are value imports
      # on the paths the suite exercises, and tsx is what the test script runs
      # the suite under.
      - name: pi-web-tools suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-web-tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1 typebox tsx 'youtube-transcript-plus@^2.0.1'
          npm test

      # The suite mocks every Pi module and typebox it imports with bun's
      # mock.module, so like pi-session-manager it needs no install.
      - name: pi-background-tasks suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-background-tasks
        run: npm test

      # The package value-imports pi-tui with no mock standing in for it. No
      # module the suite loads reaches that import today, so the install is
      # what keeps a test file that does reach it failing as a test rather
      # than as an unresolved module.
      - name: pi-extension-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-extension-manager
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1
          npm test

      # Mocks its Pi imports the way pi-background-tasks does, so no install.
      # Two of its three files are node:test and one is bun:test; bun's runner
      # executes both, which is why one `npm test` covers the directory.
      - name: pi-task-panel suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-task-panel
        run: npm test

      # ---- shard: pi-claude-bridge — the node shard's hottest step, split
      # off so its build-plus-suite overlaps the rest instead of extending it.
      # The one package whose CI entry point is `test:ci` rather than `test`:
      # its `test` script also runs integration suites that need API keys and
      # a live provider, which a runner has neither of. `test:ci` is the
      # subset CI can prove, and declaring it in the package is what keeps
      # that exclusion visible to the inventory case in
      # pi-extensions/package-policy.test.mjs instead of reading as an
      # uncovered package. It builds first because one suite loads
      # bundle/connector-inventory.js rather than src, so a src change without
      # a rebuild has to fail here.
      # `npm ci` is deliberately NOT allowed to fall back to `npm install`:
      # the bundle assertion below only proves the artifact came from the
      # committed lockfile if the install itself was lockfile-strict.
      - name: pi-claude-bridge unit suite
        if: matrix.shard == 'pi-claude-bridge'
        working-directory: pi-extensions/pi-claude-bridge
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci

      # bundle/index.js is the artifact Pi loads and npm publishes. A clean
      # lockfile build must reproduce the committed bytes exactly.
      - name: pi-claude-bridge bundle matches a clean lockfile build
        if: matrix.shard == 'pi-claude-bridge'
        working-directory: pi-extensions/pi-claude-bridge
        run: git diff --exit-code -- bundle/

  # AGGREGATOR — this job's name is the ruleset's required context, so the
  # `(shell + node)` in it is frozen history: renaming it to match today's
  # shards leaves the ruleset waiting on a context nothing creates. It runs on
  # every event, pull_request included: GitHub counts a SKIPPED required
  # context as satisfied, so an event-scoped condition here would let a PR with
  # a red shard enter the queue and be ejected there. `always()` is required
  # because skipped/failed needs would otherwise skip this job too, and a
  # skipped required context would satisfy the ruleset without any suite having
  # run (the fail-open this line exists to close).
  skill-suites:
    name: Skill suites (shell + node)
    needs: [skill-suites-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.skill-suites-shard.result }}
        run: |
          echo "shards: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ]

  gate-selftest:
    # DELIBERATELY UNGATED: no `needs`, no approval condition, no path
    # filter. If the predicate is broken, nothing is ever approved, so a
    # gated selftest could never run when it matters. Runs from the repo
    # root so the configured layer regenerates its approve/near-miss
    # battery from THIS repo's committed kendex.settings.toml trust values.
    name: Pin the review-gate decision table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: review-gate selftest against this repo's settings
        run: skills/review-gate/scripts/review-predicate-selftest.sh
      # kendex adopts its own gate, so it takes the consumer's check too.
      - name: review-gate validate against this repo's installation
        run: skills/review-gate/scripts/validate.sh

  preflight:
    # Dogfoods the preflight skill on this repo's own PR diffs. PR-only
    # because it is diff-scoped and a merge group has no PR base to diff
    # against; its findings (fail-open bash, dead doc citations, broken
    # JSON/TOML) are the classes that otherwise surface as bot-review
    # round-trips. Not a required context; merge-group correctness is owned
    # by the sharded suites.
    name: Preflight (diff-scoped deterministic checks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: preflight against the PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: skills/preflight/scripts/preflight --base "origin/$BASE_REF"
      # Both carry `always()`: a finding above must not swallow their early
      # answer. The `rest` shard runs both on every event and is what blocks.
      - name: size-ratchet (tighten-only file-size gate)
        if: always()
        run: skills/size-ratchet/scripts/size-ratchet
      - name: todo-ban (index-wide work-marker scan)
        if: always()
        run: skills/growth-guards/scripts/todo-ban

  cargo-tests:
    name: Cargo (workspace tests)
    # GitHub-hosted deliberately: the full workspace build (Tauri app
    # included) does not fit the org's current Blacksmith size. Route it
    # back when the org variables point at a machine that fits it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # PR runs restore main's entry without saving their own: a ~795 MB key
      # per push would evict the entries the queue and push runs restore from.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: System dependencies for the keychain store and the app shell
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      # Full debuginfo across the Tauri workspace out-links the runner's
      # memory — three group runs died with the cargo step "cancelled" and
      # no step output, the OOM-kill signature. Tests don't read debuginfo.
      # Incremental artifacts are dead weight on a fresh runner and
      # double what cargo writes.
      - name: cargo test
        env:
          RUSTFLAGS: -C debuginfo=0
          CARGO_INCREMENTAL: '0'
        run: cargo test --workspace --locked

  # The app ships on macOS. tools/guard checks the core and CLI Apple targets
  # at commit time; this runner executes the tests on the platform.
  cargo-tests-macos:
    name: macOS cargo (workspace tests)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: one run reports every platform-specific failure
      # instead of one per queue attempt.
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  # The app ships on Windows and release.yml builds it there. `cargo check`
  # does not link, so the Linux runner proves the Windows targets compile
  # without one, and it answers in a minute where the executing lane below
  # takes the workspace build first — a `std::os::unix` reach in test code
  # fails here before that one has finished linking. Scope matches
  # tools/guard's cross-target lane: app needs the platform's C toolchain,
  # core and CLI are portable.
  cargo-check-windows:
    name: Windows cargo (core and CLI targets compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml overrides the toolchain the action installed, so
      # the target belongs on the pinned one — an action `targets:` input
      # lands on the other and surfaces as E0463 at compile time. `rustc
      # --version` resolves the pin; the add is its own step, so a target
      # that will not install reads as a setup failure.
      - name: Windows target for the pinned toolchain
        run: |
          rustc --version
          rustup target add x86_64-pc-windows-msvc
      - name: cargo check
        run: cargo check -p kendex-core -p kendex-cli --all-targets --locked --target x86_64-pc-windows-msvc

  cargo-tests-windows:
    name: Windows cargo (workspace tests)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast
