name: Skill Tests

# Runs every skill's, hook's and pi-extension's own test suite — the same
# suites fix cycles run locally — plus the workspace's cargo tests. Upstream
# gating here is what lets consuming repos drop tracked vendoring: quality is
# proven at the source, not re-proven per consumer.
#
# A PULL REQUEST RUNS NO LANE. Its run reports the required `CI` context
# alone, which GitHub needs before it admits the pull request to the merge
# queue. The merge-group run is the only proof of a head; a red group returns
# the change to its lane, which pushes a fix before it queues again.
#
# WHAT A MERGE GROUP RUNS IS KEYED TO THE CHANGE CLASS AND THE PATHS BEHIND
# IT. The `changes` job below reads the class once through the change-class
# composite action, `tools/ci-job-set` turns it and the changed paths into
# one `<lane>=true|false` line per gated lane and the list of shell shards
# the changed packages select, and every gated `if:` in this file reads one
# of those lines. Of the gated jobs, a `render` or `trivial` diff runs the
# bot-instructions job alone, whose steps the bot_instructions lane entry in
# `tools/ci-job-set` lists. Every other diff, and a `trivial` one changing a
# path tools/rust-reads names, runs that job, the shell shards its packages
# select and each other lane as `tools/ci-job-set` selects it; the invariant
# comment there is the one statement of what each lane runs. The selected
# macOS cargo and shell legs run in the group. The two diff checks,
# preflight and Markdown, run on every group against its base.
# `tools/ci-job-set --event-parity` holds the pull-request selection, which
# local validation (`tools/guard --full`) reads, equal to the group's. The required
# checks retain their names. The last job, `CI`, accepts only the skips the
# selection authorized. Every other job reports into it except the nightly
# macOS skill suites. GitHub enforces approval and thread resolution
# independently of CI job selection.
#
# A PUSH TO MAIN carries the tree its merge group proved, so its cargo lanes
# run only the compile steps, which save the compile cache under the merged
# lockfile for each platform, and the catalog and smoke checks run as on
# every main run. THE NIGHTLY RUN, the daily schedule on main, also runs the
# full macOS shell roster, the macOS cargo tests and the Windows tests; a
# manual dispatch runs the same jobs on demand. A macOS or Windows failure
# that independently passing changes cause only in combination, or that no
# group's selection reached, surfaces there, and the overseer's watch
# reports a red scheduled run.
# Whatever else does NOT run on every event carries its own `if:` saying
# why. Selected macOS shell shards test Bash 3.2 and BSD tools in merge
# groups and every shard does each night.
#
# Every job names its GitHub-hosted runner in `runs-on:`, directly or through
# its matrix's `os` list, the same label on every event. The repository is
# public, so those runners are free, and shard durations compare across
# events.
#
# SHARD BUDGET: five minutes of measured wall time is the trigger to split a
# shard, not to widen it, and it is read PER LEG. Linux carries that figure —
# the cargo shards below were cut on it, Linux at 329s and macOS at 631s. The
# macOS runner forks and spawns at less than half the Linux pace, so it
# reaches five minutes on work Linux runs in two, and it carries the looser
# ceiling: TEN MINUTES, past which a shard is split even where its Linux leg
# sits inside five. Run 36195213656, the first with every split below in
# place, has legs past their figure on both runners, and none is split here.
# The orch legs among them ran their suites one at a time;
# skills/orch/tests/run-all.sh now runs a shard's suites `nproc` at a time
# and prints one `suite=<name> seconds=<n>` line per suite, so their next CI
# run re-measures them, and the comment above the orch shard steps holds
# run 36195213656's figures. `worktree` on macOS, `linear` and `rest` on
# Linux, and `guards-tools` and `guards-tools-tail` on both runners do not
# run through run-all.sh and stand past their figure pending a split.
#
# THE `guards-hooks`, `guards-hooks-tail`, `guards-tools` AND
# `guards-tools-tail` SHARDS were cut
# to eight minutes of summed suite time on Linux and fourteen on macOS, under
# the 15- and 30-minute job ceilings below. No step measures those sums: they
# are the figures to re-measure against when one of those legs nears its
# ceiling. The comment above their steps gives each shard's figure.
#
# A SPLIT GOES AS FAR AS ITS SEAM REACHES and no further — a name partition, a
# scans-against-suites cut, a package boundary with its slowest tail moved
# across to level the seconds. Each of those also places a suite added later,
# which is what keeps a shard set a partition. Where the next cut would have
# to name individual suites one at a time, the shard stands at what the seam
# left and answers to its own step bound instead, and the paragraph above its
# steps says so. Two legs are that case. `orch-terminal` is the first: its
# suite open-terminal-lane, which races a real process tree, is on
# run-all.sh's ALONE list and runs after the others, so the leg's wall time is that suite's seconds plus the
# pooled rest, and the orch shard comment gives the figures. The macOS
# `kendex-cli` cargo leg splits by `--test` target into `render-lint` and
# `rest`, and `render-lint` is the second: a target whose cost is one
# expensive test, so no target seam reaches inside it. After its comments
# pass split across scopes, its macOS test step measured 277s in run
# 37597618670. `rest`
# is split again by test name: `verify-lock` takes verification, lock
# recording and toggles that preserve locked records; `apply-locked` takes
# `apply_locked::` and non-verification `refresh_` tests. `rest` skips those
# same names. Each uses the one
# `integration` binary. The comment above the test step cites the measured
# runs and distinguishes the new leg's estimate from a standalone timing.
#
# The cargo lanes' test steps each carry a `timeout-minutes` set from the
# figures in the comment above it or its job, with headroom, so a hang there
# fails inside the budget instead of running to the job ceiling, and their
# compile steps carry their own for a cold cache; the shell shards answer to
# the `timeout-minutes` expression of the skill-suites-shard job, which is
# the list of legs held to 30 minutes, every macOS leg among them; every
# other leg takes 15. The per-shard figures behind each budget are in the
# comment above it.
# Every merge group runs its selected Linux and macOS shards; the nightly
# run runs the whole macOS roster.

"on":
  # Kept for the required `CI` context alone: a pull request runs no lane.
  pull_request:
  # Required checks must exist on merge-group shas too, or queue entries
  # block forever on contexts nothing creates. And a re-queued
  # entry can inherit a stale FAILED run when the group resolves to the
  # same synthetic sha — the queue ejects it citing the previous attempt
  # while the fresh run is still green. The recovery is dequeue-push-rearm:
  # a changed head mints a separate group.
  merge_group:
  push:
    branches: [main]
  # The nightly platform roster. GitHub starts a schedule only on the default
  # branch; a manual dispatch runs the same jobs.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  APT_ACQUIRE_OPTIONS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

# A push to a pull request's branch cancels the run its previous head started,
# which could only report on a head the pull request no longer has. A merge
# group, a push to main or a nightly run keys its group to its own run and
# cancels nothing: cancelling a queue run would eject its entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE ONE READ OF THE CHANGE CLASS. Every gated lane below answers to a line
  # this job published, and no other job classifies anything: a second reader
  # could disagree with this one, and the lane it disagreed about would be the
  # one nothing proved. The action is the same one a consumer references as
  # `vanillagreencom/kendex/.github/actions/change-class@main`, so the merge
  # route and CI can never classify differently. Here the action WRAPPER is
  # referenced by path, because this change's group run is what proves it,
  # while the classification it runs comes from the default-branch checkout
  # the steps below take.
  #
  # Keep this job inside the workflow: a trigger-level path filter would
  # create none of the required contexts, and a merge queue waits forever on a
  # check nothing will report.
  #
  # The class is read on merge_group alone. A pull request runs no lane, and
  # the main and nightly runs run their fixed jobs without a class.
  changes:
    name: Classify the diff
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # The render proof re-renders every installed item, so its cost grows with
    # this repository's catalog rather than with the diff. This ceiling sits
    # ahead of every lane below and is the whole budget a `render` merge
    # group's CI answers to.
    timeout-minutes: 20
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      shell_shards: ${{ steps.select.outputs.shell_shards }}
      shell_os: ${{ steps.select.outputs.shell_os }}
      ui: ${{ steps.select.outputs.ui }}
      bot_instructions: ${{ steps.select.outputs.bot_instructions }}
      cargo_linux: ${{ steps.select.outputs.cargo_linux }}
      cargo_macos: ${{ steps.select.outputs.cargo_macos }}
      cargo_lint: ${{ steps.select.outputs.cargo_lint }}
      cargo_windows: ${{ steps.select.outputs.cargo_windows }}
      cargo_windows_check: ${{ steps.select.outputs.cargo_windows_check }}
      catalog: ${{ steps.select.outputs.catalog }}
      smoke: ${{ steps.select.outputs.smoke }}
      shards: ${{ steps.select.outputs.shards }}
      queue_macos_shards: ${{ steps.select.outputs.queue_macos_shards }}
    # The installer, classifier and orch contract come from the default
    # branch's checkout. The action wrapper, tools/ci-job-set and
    # tools/ci-aggregate run from the group's tree, held by review.
    env:
      # The event and its two endpoints, spelled once: the render-reach step
      # and the classify step must judge the same range.
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.merge_group.base_sha }}
      HEAD: ${{ github.event.merge_group.head_sha }}
    steps:
      # THREE CHECKOUTS, and the split is the point. The classifier is the
      # DEFAULT BRANCH's copy, where the change's author cannot change
      # it; `subject` is the tree under judgement; and the workspace root
      # carries the action wrapper, `tools/ci-job-set` and the
      # `tools/ci-aggregate` that CI runs, which this repository is
      # proving on this change's group and which review holds. A consumer
      # calling the action at `@main` gets the same split with one checkout,
      # because there the action's own tree IS kendex at main.
      #
      # `classifier` and `subject` are siblings under the root checkout rather
      # than nested inside the judged tree, so neither checkout writes into
      # the other.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the classifier, from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      # Whether the render class is reachable at all. It mirrors change-class's
      # render branch, `if [ "$harness_verdict" = "harness_only=true" ]`: that
      # branch is the only reader of kendex and the mirror, so on every other
      # verdict the install and the refresh below would buy nothing. Read with
      # the default branch's copy, as the class is.
      - id: render-reach
        # The source repository's harness inventory is available on the default
        # branch. A failed inventory read must fail classification and run lanes.
        run: >-
          classifier/skills/harness-ci/scripts/harness-only
          --mode harness --repo subject --event "$EVENT" --base "$BASE" --head "$HEAD"
      # The render proof uses the rolling main build because this repository's
      # install record is written by a build of the recording tree. The default
      # branch's installer fetches that published build for every render candidate.
      # Building from the group's tree here would put a cold cargo
      # build ahead of every lane in the workflow.
      #
      # NEITHER THIS STEP NOR THE ONE AFTER IT FAILS THIS JOB. A kendex that
      # will not install, one answering no such document, and a mirror that
      # will not fetch may leave the render proof unavailable, and nothing
      # else: classification still runs, and the class the classify step
      # prints is the answer, whatever these two steps did. Turning the job
      # red on a network blip would instead red every required context in
      # this file and block a change nothing is wrong with. Each carries a
      # deadline of its own under the job's, and the warning step after them
      # annotates the run when either did not succeed.
      - id: kendex
        name: kendex, for the render class
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: sh classifier/install.sh --git --cli-only
      # `kendex verify` re-renders out of the local mirror and never fetches
      # it, so on a runner that has never fetched the source every package
      # reports its origin unavailable and the class falls to `standard`.
      # This primes the runner's cache and leaves the checkout as committed,
      # which the classifier requires: it refuses a tree that differs from its
      # own HEAD, so a step writing renders back would have the proof attest
      # to its own repair.
      - id: mirror
        name: the source mirror the render proof re-renders from
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: subject
        run: kendex source refresh
      - name: warn when the render proof lost a prerequisite
        if: steps.render-reach.outputs.harness_only == 'true' && (steps.kendex.outcome != 'success' || steps.mirror.outcome != 'success')
        env:
          KENDEX_OUTCOME: ${{ steps.kendex.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: >-
          echo "::warning title=render proof may be unavailable::kendex install $KENDEX_OUTCOME, source refresh $MIRROR_OUTCOME; the render proof may be unavailable, and the class the classify step prints is the answer"
      - id: classify
        uses: ./.github/actions/change-class
        with:
          classifier: classifier
          repo: subject
          event: ${{ env.EVENT }}
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
      # The class becomes a job set here and nowhere else. Each lane's `if:`
      # below reads one of these lines rather than re-deriving the selection
      # from the class and the paths, so there is one place to read what a
      # class runs and one place to change it. It runs in the workspace root,
      # the group's tree, whose crates/ tools/rust-reads reads.
      # --event-parity refuses a selection that differs by event, once per
      # run here rather than on every call the suites make.
      - id: select
        env:
          RUSTUP_TOOLCHAIN: stable
          CHANGE_CLASS: ${{ steps.classify.outputs.change_class }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          CHANGED_PATHS: ${{ steps.classify.outputs.changed_paths }}
          EVENT: ${{ env.EVENT }}
        run: tools/ci-job-set --event-parity

  # This repository is the package's source, so the candidate's own checker
  # judges the candidate's renders: a change to the renderer or the derivation
  # is judged by itself. The trusted default-branch checker is the consumer
  # rule (../../skills/bot-instructions/SKILL.md § A pull request changing its own review); here it
  # would report drift by construction on every such change. Code review covers the
  # checker; GitHub requires a current-head approval and resolved threads.
  bot-instructions:
    name: Bot instructions
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.bot_instructions == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole history: the secrets scan judges every commit the group
      # and its pull request add against that commit's own parents, which a
      # shallow clone has not fetched.
      - id: candidate-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      # The commit lane's credential scan over the lines each commit adds
      # past the group's base: the group's commits, then the pull request's
      # own. The queue squashes a pull request into one group commit, so a
      # credential one of its commits added and a later one removed is in no
      # group commit, yet the pull request's public ref still publishes it.
      # The queue branch, gh-readonly-queue/<base>/pr-<number>-<sha>, names
      # that pull request; a group ref naming none fails the scan. gitleaks
      # installs in the same step, so the scan never runs without it, and
      # the notice records the seconds the step added, the install included.
      # Scan before candidate scripts: they can change the scanner executable
      # in the shared runner directory. Trusted code and policy alone cannot
      # protect a scan that runs after candidate code.
      # This content-check job runs on every merge group, and CI holds its result.
      # This catalog repository keeps source scripts under skills/, not .agents/.
      - name: the credential guards, from the default branch
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: guards
          persist-credentials: false
      - name: secrets (credential scan of the change)
        if: always()
        working-directory: candidate
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          start=$SECONDS
          status=0
          scan() { PATH="$RUNNER_TEMP/gitleaks:$PATH" "$GITHUB_WORKSPACE/guards/skills/commit-guards/scripts/secrets" --against "$BASE" --policy-root "$GITHUB_WORKSPACE/guards"; }
          "$GITHUB_WORKSPACE/guards/skills/commit-guards/scripts/install-gitleaks" "$RUNNER_TEMP/gitleaks" || status=$?
          if [ "$status" -eq 0 ]; then
            scan || status=$?
            pr="${HEAD_REF#refs/heads/gh-readonly-queue/"${BASE_REF#refs/heads/}"/pr-}"
            pr="${pr%%-*}"
            case "$pr" in
              '' | *[!0-9]*)
                echo "::error title=secrets scan::queue-ref=$HEAD_REF names no pull request, so its commits were not scanned"
                status=2 ;;
              *)
                pr_status=0
                git fetch --quiet --no-tags origin "refs/pull/$pr/head" &&
                  git worktree add --quiet --detach "$RUNNER_TEMP/pull-request-head" FETCH_HEAD &&
                  (cd -- "$RUNNER_TEMP/pull-request-head" && scan) || pr_status=$?
                [ "$pr_status" -eq 0 ] || status=$pr_status ;;
            esac
          fi
          echo "::notice title=secrets scan::$((SECONDS - start)) seconds, gitleaks install included"
          exit "$status"
      - id: bot-instructions-check
        run: candidate/skills/bot-instructions/scripts/bot-instructions check --repo candidate --spec candidate/skills/bot-instructions
      # Independent branches can allocate the same decision ID. Check the
      # base branch's current tip, including after another branch lands while
      # this change waits in the queue.
      - id: decision-ids
        if: always()
        working-directory: candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: |
          base_ref=${BASE_REF#refs/heads/}
          DECISIONS_BASE_REF="origin/$base_ref" skills/decider/scripts/decisions check
      # The two whole-tree content scans live in this job because every class
      # runs it, `render` and `trivial` included, and a diff small enough to
      # be `trivial` can still push a document past its ceiling. always(): a
      # red check above must not suppress either scan.
      #
      # The merge group is the one run that judges a change, so both scans
      # run there: a byte ceiling past its limit or a work marker ejects the
      # group and returns the change to its lane.
      - name: doc-limits (document byte ceilings)
        if: always()
        working-directory: candidate
        run: skills/doc-limits/scripts/doc-limits
      # The commit lane runs todo-ban --staged and judges what a commit adds;
      # this scan takes the rest, in every blob git reads as text.
      - name: todo-ban (index-wide work-marker scan)
        if: always()
        working-directory: candidate
        run: skills/commit-guards/scripts/todo-ban
      # The commit lane's changelog check over the whole change, its package
      # version rule included. The commit chain runs the copy in the
      # committing worktree, so a branch cut before a rule landed commits
      # past it; here the merged tree's copy judges the range the changes job
      # classifies. The merge group is the run that sees the base the branch
      # actually merges into.
      - id: changelog-entries
        name: changelog-entries (fragments and package versions over the change)
        if: always()
        working-directory: candidate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: skills/commit-guards/scripts/changelog-entries --base "$BASE"

  # SHARDED: the shards bound wall time at the slowest shard and give
  # suite growth per-shard headroom instead of a shared cliff. `orch` and
  # `rest` were one `shell` shard whose halves ran serially and bounded every
  # queue run; `pi-claude-bridge` was the node shard's hottest step; `guards`
  # and `linear` were the halves of a `rest` that had grown past ten minutes
  # (commit-guards 165s and linear 151s of its 582s); the `orch-` shards all
  # descend from an `orch` that had grown to 907s and was cancelled at the job
  # ceiling, and `orch-oversee-succeed` from an `orch-oversee` that did the
  # same. The ruleset's required context is the AGGREGATOR below — shard
  # names are not, so shards can be rebalanced or extended without touching
  # repo settings. Measured over the ten runs before the first split:
  # review-gate 58s, orch 250s, node 101s, pi-claude-bridge 45s; after it the
  # shell shards are guards ~230s, linear ~205s, rest ~170s.
  #
  # THE FIRST `guards-` SPLIT, `orch-state` AND `worktree` came from the
  # macOS leg passing its ten-minute ceiling: guards ran 901-1061s there, rest
  # 735-845s and orch-rest 567-675s. Each of the three splits divides its
  # roster by MEASURED SECONDS rather than by file count, so a shard is half
  # the time and not half the files; every figure below is a per-suite sum over
  # the macOS leg of run 35467869265, and the comment above each step carries
  # its own. `guards` held five repository-wide scans and 68 suite files, and
  # splits into `guards-scans` (the scans, 65s when it held all five; two have
  # since moved to the bot-instructions job), `guards-commit` (34 files,
  # 499s, and the ruff its py-names lane needs) and `guards-tools` (34 files,
  # 475s). `rest` ran 780s over 79 files and gave the worktree roster alone to
  # `worktree`, 382s over 22 files, keeping 57 files at 398s. `orch-rest` ran
  # 675s over 64 files and gave the lane, workflow-state and round-artifact
  # suites to `orch-state`, 382s over 30 files, keeping 34 at 293s.
  # `guards-tools` later grew past both legs' ceilings and splits in three,
  # `guards-hooks` and `guards-tools-tail` beside it. The hooks name seam
  # adds `guards-hooks-tail`; their measured sums are above their steps.
  #
  # THE macOS LEG uses the shard selection stated in tools/ci-job-set's
  # header. It runs on the runner whose /bin/bash is 3.2.57, the shell every
  # skill claims to support (skills/AGENTS.md).
  # tools/bash32-lint scans the source for that claim; this leg runs it, which is the only way
  # to reach what a text scan cannot — a quoted builtin name, a construct
  # assembled at runtime. The image's only
  # bash is that one today, and the leg does not rely on it: a symlink to
  # /bin/bash goes first on PATH, so the step shell, a `bash "$t"` in a loop
  # and every `#!/usr/bin/env bash` under it resolve to the same interpreter,
  # and a step asserts the version each of those resolutions got before any
  # suite runs — a leg that ran Bash 5 in silence would report a property it
  # never tested. The probe step after it is the leg's must-fail control. The
  # node shards are excluded: nothing in them is bash.
  #
  # THE USERLAND the leg runs on is macOS's own: BSD sed, grep, awk, find, diff
  # and ps, each asserted below beside the shell. A GNU-only construct in a
  # suite or in a shipped script therefore reds here rather than passing on a
  # userland no Mac has.
  #
  # FOUR UTILITIES ARE SUPPLIED, and they are the whole list: flock and setsid
  # from util-linux, timeout and sha256sum from coreutils. macOS ships no
  # flock, setsid or timeout at all, and carries sha256sum only in recent
  # releases (26 has /sbin/sha256sum; the runner image's own release decides),
  # so none of the four is a BSD difference to fix at a site — a script that
  # must run without one carries its own fallback there (open-terminal falls
  # back to nohup, workflow-state and lanes to a mkdir mutex, ci-wait's suite
  # to an unbounded run, release-digests' to shasum). Each of the four is
  # linked in on its own, never through a package's gnubin directory, so
  # nothing else in coreutils or util-linux shadows a BSD tool. What needs one
  # of the four and has no fallback — the worktree lifecycle suite,
  # container-close's suite — reds on a host without it rather than skipping
  # into a green.
  skill-suites-shard:
    name: Skill suites shard (${{ matrix.shard }}, ${{ matrix.os }})
    needs: changes
    # Merge groups run Linux shards when classification is missing or
    # selects shell work with a remaining Linux runner. Every other event
    # and cancelled runs stand this job down. The status function lifts the
    # implicit `success()` when classification fails.
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || (needs.changes.outputs.shell_shards == 'true' && needs.changes.outputs.shell_os != '["macos-latest"]')) }}
    strategy:
      fail-fast: false
      matrix:
        # The shards the diff's packages select, as tools/ci-job-set lists
        # them; the literal is the whole roster, in the order that script's
        # SHARDS spells it, and runs where the classifier published nothing.
        # The job stands down where the list is empty, so no empty matrix
        # expands.
        shard: &skill-suite-shards ${{ fromJSON(needs.changes.result != 'success' && '["review-gate", "refresh", "orch-terminal", "orch-oversee", "orch-oversee-watch", "orch-oversee-succeed", "orch-dev", "orch-state", "orch-rest", "guards-scans", "guards-commit", "guards-commit-tail", "guards-hooks", "guards-hooks-tail", "guards-tools", "guards-tools-tail", "linear", "linear-controls-a", "linear-controls-b", "worktree", "worktree-restack", "rest", "slack", "mailbox", "node", "pi-claude-bridge"]' || needs.changes.outputs.shards) }}
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The macOS legs on the same suites, first green run: orch 10m45s
    # against 4m45s on Linux, guards 9m09s against 3m13s, rest 7m39s against
    # 3m07s, review-gate 3m45s against 1m05s, linear 2m47s against 3m30s. The
    # undivided orch battery later reached 21m45s here against the 15m16s on
    # Linux that the ceiling cancelled; the split below answers it, and each
    # third runs this leg in roughly a third of that time. The three shards
    # this leg later held past ten minutes of every merge — guards to 1061s,
    # rest to 845s, orch-rest to 675s — are split again below.
    # The Linux legs the `if:` of the `kendex from this checkout` step names
    # build kendex-cli (debug) from the checkout ahead of their suites, and a
    # cold cargo cache — the first run after a merge, and after each rustc
    # release — pays the whole build. Its duration on a runner is unmeasured,
    # so a leg that builds kendex takes the macOS ceiling until a figure is
    # recorded here; the expression below is the list of legs that take it,
    # and `refresh`, which builds kendex too, is not on it.
    # The `guards-hooks`, `guards-hooks-tail`, `guards-tools` and
    # `guards-tools-tail` legs are cut
    # to the targets the file header states, eight minutes on Linux and
    # fourteen on macOS, which leave the 15- and 30-minute ceilings here a
    # margin; their figures are above their steps.
    # Slack retains the budget of the rest shard it splits from on both OSes.
    timeout-minutes: &skill-suite-timeout ${{ (matrix.os == 'macos-latest' || matrix.shard == 'rest' || matrix.shard == 'slack' || matrix.shard == 'orch-terminal' || matrix.shard == 'orch-rest' || (matrix.os == 'ubuntu-latest' && matrix.shard == 'orch-dev')) && 30 || 15 }}
    # harness-ci's change-class suite skips its real-kendex rows where no
    # kendex is on PATH, and this turns that skip into a failure. It is set
    # for the whole job rather than beside the install step below, so the
    # shard that runs those suites must be one that installed a kendex
    # whatever the roster looks like later. The macOS legs keep the skip, for
    # the reason the install step gives.
    # ORCH_REQUIRE_KENDEX does the same for three orch suites:
    # open-terminal-copilot-context.sh, whose disableAllHooks rows ask a real
    # kendex hooks-off and which the `orch-terminal` shard runs, and
    # claude-model-classes.sh and tier-model-fixture.sh, whose rows ask a
    # real kendex tier-model and which the `orch-rest` shard runs.
    env: &skill-suite-env
      # REVISIT(D026): one profile serves every real macOS battery invocation.
      RUN_ALL_NATIVE_CONTRACTS: ${{ matrix.os == 'macos-latest' && format('{0}/tools/macos-test-contracts', github.workspace) || '' }}
      RUN_ALL_REVIEW_SECS: ${{ matrix.os == 'macos-latest' && '600' || '300' }}
      RUN_ALL_MARGIN_PERCENT: '125'
      RUN_ALL_SHARD: ${{ matrix.shard }}
      HARNESS_CI_REQUIRE_KENDEX: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      ORCH_REQUIRE_KENDEX: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      REVIEW_GATE_REQUIRE_KENDEX: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps: &skill-suite-steps
      # run-all.sh stops every suite still running at this Unix time and names
      # each in the log, so a hang fails by name before the job ceiling cancels
      # the leg with none. It counts from the job's first step, whatever the
      # checkout, the installs and a cold kendex-cli build then take, and ends
      # 60s inside the ceiling: in merge-group run 37477526298 the orch legs
      # spent 2-4s setting up before this step and up to 5s in post steps
      # after the suites, and a stop gives a suite's processes 10s before KILL.
      - name: the run-all.sh deadline, inside this leg's job ceiling
        env:
          CEILING_MINUTES: *skill-suite-timeout
        run: |
          started="$(date +%s)"
          echo "RUN_ALL_JOB_STARTED_EPOCH=$started" >>"$GITHUB_ENV"
          echo "RUN_ALL_JOB_SECS=$((CEILING_MINUTES * 60))" >>"$GITHUB_ENV"
          echo "RUN_ALL_DEADLINE_EPOCH=$((started + CEILING_MINUTES * 60 - 60))" >>"$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ---- macOS leg: Bash 3.2 first on PATH, asserted, and its probe -----
      # gnubin goes on PATH before the shell's directory does, so the
      # directory added last, the shell's, is searched first.
      - name: the four utilities a stock macOS does not reliably carry
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          set -u
          brew install coreutils util-linux
          prefix="$(brew --prefix)"
          dir="$RUNNER_TEMP/supplied"
          mkdir "$dir"
          # One link per supplied utility. A whole gnubin or util-linux bin
          # directory on PATH would put a GNU cut, sort, head, tr, dirname and
          # basename in front of the BSD ones this leg exists to run against.
          ln -s "$prefix/opt/util-linux/bin/flock" "$dir/flock"
          ln -s "$prefix/opt/util-linux/bin/setsid" "$dir/setsid"
          ln -s "$prefix/opt/coreutils/libexec/gnubin/timeout" "$dir/timeout"
          ln -s "$prefix/opt/coreutils/libexec/gnubin/sha256sum" "$dir/sha256sum"
          echo "$dir" >>"$GITHUB_PATH"

      - name: /bin/bash first on PATH
        if: matrix.os == 'macos-latest'
        run: |
          set -u
          mkdir "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >>"$GITHUB_PATH"

      # Its own step, so the PATH above is in force. A suite reaches the
      # shell three ways — the step shell that runs the loop, the `bash` the
      # loop names, and the `/usr/bin/env bash` in a script's shebang — and
      # each is asked what it is. One that is not 3.2 ends the leg.
      - name: the interpreter is Bash 3.2
        if: matrix.os == 'macos-latest'
        run: |
          set -u
          fail=0
          # shellcheck disable=SC2016 # the child expands it, which is the point
          version_of() { "$@" -c 'printf %s "$BASH_VERSION"'; }
          got() { # got WHAT VERSION
            case "$2" in
              3.2.*) echo "$1: Bash $2" ;;
              *) echo "$1: Bash $2, not 3.2 — this leg would test nothing"; fail=1 ;;
            esac
          }
          got "the step shell" "$BASH_VERSION"
          got "bash on PATH, $(command -v bash)" "$(version_of bash)"
          got "/usr/bin/env bash" "$(version_of /usr/bin/env bash)"
          # The four the step above supplied, resolved the way a suite resolves
          # them: present, or a suite that calls one fails for the wrong reason.
          for c in flock setsid timeout sha256sum; do
            command -v "$c" || { echo "$c is not on PATH; this leg promises to supply it"; fail=1; }
          done
          # Everything else is macOS's own. A GNU build here — a package that
          # linked its gnubin in, a runner image change — would prove the
          # suites against a userland no Mac has, which is the property this
          # leg exists to measure. The path is the assertion: under SIP a GNU
          # build cannot be what /usr/bin or /bin holds, and a Homebrew one
          # resolves outside both.
          #
          # The banner is read for the VENDOR form GNU prints — `sed (GNU sed)`,
          # `grep (GNU grep)`, `GNU Awk`, `find (GNU findutils)`, `diff (GNU
          # diffutils)` — and never for the bare word: Apple's grep advertises
          # itself as `grep (BSD grep, GNU compatible)`, so the word alone reds
          # this leg on the very build it exists to run against.
          # Every utility whose BSD behaviour a suite or a shipped script now
          # depends on, not just the five the leg used to install: a coreutils
          # gnubin arriving on PATH would make wc, paste, touch, date, mktemp
          # and seq GNU while the rest stayed Apple's, and this assertion would
          # stay green over a userland the leg no longer measures.
          for c in sed grep awk find diff ps wc paste touch date mktemp seq; do
            resolved="$(command -v "$c")" || resolved=""
            case "$resolved" in
              /usr/bin/* | /bin/*) ;;
              "") echo "$c is not on PATH at all"; fail=1 ;;
              *) echo "$c on PATH is $resolved, not the one macOS ships"; fail=1 ;;
            esac
            if "$c" --version 2>/dev/null | head -n 1 | grep -Eq '\(GNU |^GNU '; then
              echo "$c on PATH is a GNU build; this leg runs the BSD userland"
              fail=1
            fi
          done
          exit "$fail"

      # The must-fail control, one row per axis the text scan cannot reach:
      # a builtin name behind quote removal, and one behind word splitting —
      # a redirection standing where the scan expects a separator. Each line
      # is read out of the fixture that pins it as a miss of the scan, so the
      # probe is by construction one the scan cannot catch and the shell can:
      # the scan is run on the pair and must be clean, and Bash 3.2 gives a
      # quoted name of a builtin it lacks `command not found`, 127, and the
      # `-A` it never had `invalid option`, 2. Any other exit — 0 on a shell
      # that has both — fails the leg.
      - name: probe — Bash 4 constructs the scan cannot see fail under this shell
        if: matrix.os == 'macos-latest'
        run: |
          set -u
          fixture=tools/tests/data/bash32-uncatchable.txt
          dir="$RUNNER_TEMP/bash32-probe"
          mkdir "$dir"
          fail=0
          n=0
          while IFS='|' read -r construct want; do
            n=$((n + 1))
            line="$(grep -xF -- "$construct" "$fixture")" ||
              { echo "$fixture no longer pins '$construct' as a miss, so it is no probe"; exit 1; }
            printf '%s\n' '#!/usr/bin/env bash' 'set -u' "$line" >"$dir/probe-$n.sh"
            status=0
            bash "$dir/probe-$n.sh" </dev/null || status=$?
            if [ "$status" -eq "$want" ]; then
              echo "probe $n failed under Bash 3.2 as it must: $construct (exit $status)"
            else
              echo "probe $n exited $status under Bash $BASH_VERSION; 3.2 gives '$construct' exit $want"
              fail=1
            fi
          done <<'EOF'
          'mapfile' -t values|127
          declare>/dev/null -A cache|2
          EOF
          [ "$n" -eq 2 ] || { echo "the probe table read $n rows, not 2"; exit 1; }
          tools/bash32-lint "$dir"
          tools/bash32-parse --provider-check || exit $?
          exit "$fail"

      - name: shard names agree with the matrix
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          declared="$(sed -n "s/^ \{8\}shard: .*'\[\(.*\)\]'.*\$/\1/p" "$wf" | tr -d ' "' | tr ',' '\n' | sort -u)"
          # Stage one keeps `if:` keys only, so a shard named in a comment or
          # a script is not a step that runs it; stage two's -o prints EVERY
          # comparison, so a compound condition is read whole. `|| true` sends
          # a no-match to the floor below, which says so, not to a bare abort.
          used="$(grep -oE "^ +if: .*" "$wf" | grep -oE "matrix\.shard == '[^']+'" | cut -d"'" -f2 | sort -u || true)"
          [ -n "$declared" ] && [ -n "$used" ] || { echo "no shard list, or no shard condition, read from $wf"; exit 1; }
          diff <(printf '%s\n' "$declared") <(printf '%s\n' "$used") || { echo "shard names disagree: '<' the matrix declares and no step names; '>' a step names and the matrix does not run"; exit 1; }
          printf '%s\n' "$declared" | grep -qxF "$SHARD" || { echo "this leg's shard '$SHARD' is not in the matrix"; exit 1; }

      # kendex-cli, built from this checkout and put on PATH, for the
      # shards whose suites run a real kendex: `rest`, for harness-ci's
      # change-class rows, whose comment at the `rest` shard's verify-document
      # step says why the build is this checkout's and why Linux alone, and
      # `orch-terminal`, for the disableAllHooks rows of
      # open-terminal-copilot-context.sh, which ask the `hooks-off` verb this
      # checkout ships, `orch-rest`, for claude-model-classes.sh, whose core
      # contract rows hold the Claude plugin's fixtures to this checkout's
      # `tier-model`, and tier-model-fixture.sh, which holds the orch suites'
      # class table fixture to it, and `refresh`, for refresh-consumer's held-render
      # rows. The macOS legs keep the binary-dependent skips.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
        if: (matrix.shard == 'rest' || matrix.shard == 'orch-terminal' || matrix.shard == 'orch-rest' || matrix.shard == 'refresh') && runner.os == 'Linux'
      # The keychain store links dbus, as every cargo job below installs.
      - name: System dependencies for the keychain store
        if: (matrix.shard == 'rest' || matrix.shard == 'orch-terminal' || matrix.shard == 'orch-rest' || matrix.shard == 'refresh') && runner.os == 'Linux'
        run: sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update && sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y libdbus-1-dev
      - name: kendex from this checkout
        if: (matrix.shard == 'rest' || matrix.shard == 'orch-terminal' || matrix.shard == 'orch-rest' || matrix.shard == 'refresh') && runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build -p kendex-cli --locked
          mkdir -p "$HOME/.local/bin"
          install -m 0755 target/debug/kendex "$HOME/.local/bin/kendex"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          installed="$(PATH="$HOME/.local/bin:$PATH" kendex --version)"
          echo "installed: $installed"

      # ---- shard: review-gate — the heavyweight review-gate suites alone ----
      - name: review-gate suites
        if: matrix.shard == 'review-gate'
        run: |
          set -u
          fail=0
          review=()
          for t in skills/review-gate/tests/*.test.sh; do
            base="${t##*/}"
            review+=("=${base%.sh}")
          done
          bash skills/orch/tests/run-all.sh --battery skills/review-gate/tests "${review[@]}" || fail=1
          exit "$fail"

      # Run 38141581913 spent 287s in review-gate then 365s in refresh on
      # macOS. The package seam removes that serial sum from either job.
      - name: refresh suites
        if: matrix.shard == 'refresh'
        run: |
          set -u
          fail=0
          refresh=()
          for t in refresh/tests/*.test.sh; do
            base="${t##*/}"
            refresh+=("=${base%.sh}")
          done
          bash skills/orch/tests/run-all.sh --battery refresh/tests "${refresh[@]}" || fail=1
          exit "$fail"
      # ---- shards: orch-terminal, orch-oversee, orch-oversee-watch,
      # orch-oversee-succeed, orch-dev, orch-state, orch-rest -----------------
      # Source reductions retained all 72 orch-state suites, but run
      # 38164401517 still took 1383s on macOS. run-all.sh owns the family
      # profiles and their complement. Dev/review names enter `orch-dev`,
      # including names that also carry lane or workflow-state, and so does
      # the oversee launch family; the owed-work family joins it on Linux.
      # On Linux, the account-reader `lanes*` family joins `orch-dev`;
      # `orch-state` keeps the other lane/workflow-state names. `orch-rest`
      # takes the remaining suites after these families. The macOS
      # profiles spread watch contracts across these same jobs. New suites
      # join one family by name. orch-shard-partition.test.sh reads the actual
      # workflow calls and proves complete, unique ownership on both OSes.
      #
      # Measured suite by suite, one at a time, on the Linux leg of run
      # 36195213656. A shard's figure is the sum of its suites' seconds, read
      # from the log timestamps; the step time the jobs API reports is within
      # a second of it. orch-terminal 597s over 10 files (open-terminal-lane
      # 229s, open-terminal-record 124s, open-terminal-claude-handoff 90s,
      # open-terminal-owned-skip 76s), orch-oversee 516s over 13
      # (oversee_watch_lifecycle 128s, oversee_watch 118s,
      # oversee_watch_overseer 81s, oversee_watch_lanes 62s),
      # orch-oversee-succeed 462s over 4 (oversee_succeed 191s,
      # oversee_watch_mail 163s, oversee_succeed_watch 79s, oversee_report
      # 29s), orch-state 702s over 42 (dev_validate_run 206s, lanes 189s,
      # lane-host-ssh 50s, lane_close 49s) and orch-rest 221s over 37
      # (approval_wait 51s, round_recover 37s, queue_wait 26s). The macOS
      # legs of that run spent 781s, 1087s, 597s, 1021s and 339s of step
      # time on the same five. run-all.sh runs those suites `nproc` at a
      # time, save the ones on its ALONE list, which run one at a time after
      # the rest, and prints each one's `suite=<name> seconds=<n>` line, so a
      # step's wall time is now below its sum and its log carries these
      # figures fresh. Splitting
      # orch-terminal in turn would have to name individual suites rather
      # than a name prefix, since open-terminal-lane alone was 229s of its
      # 597s on that run, so that is where a name partition stops.
      #
      # `orch-oversee` then ran 14m37s-14m47s on main's own orch pull requests
      # and was cancelled at 15m16s on PR #2902, inside
      # oversee_watch_receipts, having spent oversee_succeed 191s,
      # oversee_watch_mail 165s, oversee_watch_lifecycle 126s, oversee_watch
      # 112s, oversee_watch_overseer 78s, oversee_succeed_watch 78s,
      # oversee_watch_lanes 60s and oversee_report 29s. `orch-oversee-succeed`
      # takes the succession, mailbox and report suites by name
      # (oversee_succeed, oversee_succeed_watch, oversee_watch_mail,
      # oversee_report: 463s on that run), and `orch-oversee` keeps every
      # other oversee suite by rejecting exactly those names, the watch loop,
      # its lanes, receipts and usage limits. Its rejectors are the other
      # shard's selectors, so a new oversee suite lands in `orch-oversee` and
      # never in neither. Run 36195213656, PR #2902's own run with the split
      # in place, confirms it: both shards finished inside each leg's job
      # ceiling, by the per-suite paragraph above.
      - name: tmux for pane delivery tests
        if: matrix.shard == 'orch-terminal' || matrix.shard == 'orch-oversee' || matrix.shard == 'orch-oversee-watch' || matrix.shard == 'orch-oversee-succeed' || matrix.shard == 'orch-dev' || matrix.shard == 'orch-state' || matrix.shard == 'orch-rest' || matrix.shard == 'guards-hooks-tail' || matrix.shard == 'node' || matrix.shard == 'rest'
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            command -v tmux >/dev/null || brew install tmux
          else
            # Ubuntu's tmux 3.4 runs libutempter's helper at pane EOF with
            # SIGCHLD at its default action, so a pane process that exits in
            # that window is never reaped and pane-died never fires. tmux 3.6
            # re-raises SIGCHLD there (upstream fa5f3cef); the image's
            # Homebrew, not on PATH, carries a later release. The catalog
            # job's suite-command installs the same one.
            brew=/home/linuxbrew/.linuxbrew/bin/brew
            "$brew" install tmux
            tmux_dir="$("$brew" --prefix tmux)/bin"
            echo "$tmux_dir" >> "$GITHUB_PATH"
            export PATH="$tmux_dir:$PATH"
          fi
          tmux -V

          if [[ '${{ matrix.shard }}' == orch-terminal ]]; then
            if [[ "$RUNNER_OS" == macOS ]]; then
              command -v fish >/dev/null || brew install fish
            else
              command -v fish >/dev/null || { sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update && sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y fish; }
            fi
          fi

      # run-all.sh prints its own `orch tests: N/M file(s) FAILED:` block
      # naming every red suite, which is this shard's FAILED SUITES report.
      - name: orch suites — the open-terminal launch path
        if: matrix.shard == 'orch-terminal'
        run: bash skills/orch/tests/run-all.sh --shard orch-terminal

      - name: orch suites — the oversee watch loop
        if: matrix.shard == 'orch-oversee'
        run: bash skills/orch/tests/run-all.sh --shard orch-oversee

      # Run 37769037887 stopped oversee_watch at the deadline and never
      # started its lifecycle suite. Its terminal and overseer suites took
      # 537s and 535s. Linux run 37792683384 also stopped lifecycle at the
      # deadline. run-all.sh owns both platforms' partition and complement.
      - name: 'orch suites: the watch, terminal, overseer and lanes'
        if: matrix.shard == 'orch-oversee-watch'
        run: bash skills/orch/tests/run-all.sh --shard orch-oversee-watch

      - name: orch suites — the overseer succession, mailbox and report
        if: matrix.shard == 'orch-oversee-succeed'
        run: bash skills/orch/tests/run-all.sh --shard orch-oversee-succeed

      - name: 'orch suites: the dev and review round-artifact suites, oversee launch and owed work'
        if: matrix.shard == 'orch-dev'
        run: bash skills/orch/tests/run-all.sh --shard orch-dev

      - name: 'orch suites: the lane and workflow-state suites'
        if: matrix.shard == 'orch-state'
        run: bash skills/orch/tests/run-all.sh --shard orch-state

      # claude-model-classes.sh runs the orch Claude plugin under Claude Code
      # and fails under CI where no claude is on PATH. The pin is at or above
      # 2.1.287, the first release with the callbacks the plugin uses, and the
      # npm package fetches its platform binary at install, so install scripts
      # run; the version check fails here on a launcher without one.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.shard == 'orch-rest'
        with:
          node-version: 22.19.0
      - name: Claude Code for the orch plugin suite
        if: matrix.shard == 'orch-rest'
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/claude-code@2.1.292
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version
          echo "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      # The runner owns the complement, so this shard needs no suite roster.
      - name: orch suites — every suite the shards above do not run
        if: matrix.shard == 'orch-rest'
        run: bash skills/orch/tests/run-all.sh --shard orch-rest

      - name: GitHub suites
        if: matrix.shard == 'orch-rest'
        run: bash skills/orch/tests/run-all.sh --battery skills/github/tests --alone bounded-signal.test --alone pr-merge.test --alone pr-view.test --alone native-contracts.test


      # A failure is announced twice: inline where it happened, and in a
      # FAILED SUITES block at the end — the tail of a red job must name the
      # culprits instead of showing only the later suites passing.
      # Repository-wide scans and guard package suites.
      # One `guards` shard held all of it and ran
      # 901-1061s on the macOS leg against roughly a third of that on Linux.
      # `guards-scans` is the scans below, each one pass over a tracked-file
      # roster or the shell roster; the document-set and work-marker scans run
      # in the bot-instructions job instead, which every class runs, on a pull
      # request. The ruff install rides with the two shards that run a suite
      # needing it: commit-guards' own py-names.test.sh in `guards-commit`,
      # and its install-git-hooks.test.sh in `guards-hooks`.
      #
      # THE FIRST SEAM is the package boundary — commit-guards' own 36 suites
      # against the 32 files under tools/ and hooks/ — with the two slowest
      # commit-guards suites moved across it to level the seconds. On the macOS
      # leg of run 35467869265 the undivided step spent 974s: 673s in
      # commit-guards against 301s under tools/ and hooks/, so the 36/32 file
      # count was a 69/31 split of the time. install-git-hooks at 121s and
      # md-refs at 53s therefore left `guards-commit`, giving 34 files at 499s
      # against 34 at 475s; on the Linux leg that is 226s against 233s of the
      # undivided 459s. `guards-hooks` keeps install-git-hooks, while
      # `guards-commit-tail` spells md-refs. `guards-commit` reads their paths
      # from this file, as `rest` reads the roster `worktree` claims. A
      # removed path returns its suite to a fallback instead of losing it.
      #
      # THE SECOND SEAM cut the tools/, hooks/ and moved commit-guards step in
      # three, to targets of eight minutes on Linux and fourteen on macOS. On
      # the merge groups of runs 36522803055, 36523768409, 36525040329,
      # 36527004308 and 36527005559 that step's Linux leg summed 777s on the
      # one run that finished, the 15-minute ceiling cancelling the other four,
      # and its macOS leg 1385-1693s. The package boundary between tools/ and
      # hooks/ is the cut, and the two slowest tools/ suites move across a
      # second one to level the seconds: harness-smoke at 205-252s on Linux and
      # 302-330s on macOS, and orch-shard-partition at 63-89s and 187-287s. Per
      # suite sums over those legs, Linux then macOS:
      #   guards-tools       the rest of tools/tests   326-372s   533-674s
      #   guards-tools-tail  those two tools/ suites    269-341s   488-617s
      # The hooks name seam and both budgets are above their steps below.
      # `guards-tools-tail` spells its two suites as paths and the
      # `guards-tools` step reads this file for them, the fallback the
      # `guards-commit` step carries.
      # tools/tests/orch-shard-partition.test.sh owns that invariant: it runs
      # every roster step below over a copy of this file and reds on a suite
      # claimed twice or claimed by none. -----------------------------------
      # tools/exec-bits holds the rule; tools/guard runs it at commit time.
      - name: executable bits on skill tests and scripts
        if: matrix.shard == 'guards-scans'
        run: tools/exec-bits

      # One scan for Bash 4+ syntax over the roster `tools/bash32-lint --list`
      # prints. bash32-lint.test.sh proves its teeth.
      - name: bash32-lint (Bash 3.2 portability across the roster)
        if: matrix.shard == 'guards-scans'
        run: tools/bash32-lint

      # Linux parses the complete covered roster through the pinned real
      # Bash 3.2 image. The native provider probe checks the Mac interpreter.
      # Local tools/guard --full also runs the complete parse.
      - name: bash32-parse (every covered tree parses under Bash 3.2)
        if: matrix.shard == 'guards-scans'
        run: tools/bash32-parse

      # py-names.test.sh and install-git-hooks.test.sh run the lane's tool.
      # Pinned, so a ruff release cannot change the suites unreviewed; --force
      # because pipx leaves an existing install in place, and the version check
      # because PATH may still pick another ruff.
      - name: ruff for the py-names suite
        if: matrix.shard == 'guards-commit' || matrix.shard == 'guards-hooks'
        run: |
          pipx install --force ruff==0.16.2
          test "$(ruff --version)" = "ruff 0.16.2"

      # secrets.test.sh runs the lane's tool, the release commit-guards pins.
      - name: gitleaks for the secrets suite
        if: matrix.shard == 'guards-commit'
        run: |
          skills/commit-guards/scripts/install-gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >>"$GITHUB_PATH"

      # This shard is the fallback for the moved tail: a suite of the glob is
      # skipped only where another step RUNS it by path, and runs here
      # otherwise. `claims` is this file with its comment lines dropped,
      # so a path that survives only in prose proves nothing — without that
      # drop, moving a path from either hooks shard loop into the comment
      # above it would leave both shards skipping the suite and both green,
      # which the aggregator cannot see because it asserts job success and
      # not suite count.
      - name: commit-guards suites
        if: matrix.shard == 'guards-commit'
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          claims="$(grep -v '^[[:space:]]*#' "$wf")"
          set --
          for t in skills/commit-guards/tests/*.sh; do
            if printf '%s\n' "$claims" | grep -qF "$t"; then
              continue
            fi
            base="${t##*/}"
            set -- "$@" "=${base%.sh}"
          done
          # The terminal watchdog must finish inside its caller's real-time window.
          bash skills/orch/tests/run-all.sh --battery skills/commit-guards/tests \
            --alone terminal-paths.test "$@"
      # This shard is the fallback for `guards-tools-tail`'s roster in the way
      # the `guards-commit` step above is for its moved tail.
      - name: tools suites
        if: matrix.shard == 'guards-tools'
        run: |
          set -u
          # Complete the checkout's toolchain install before concurrent readers.
          tools/rust-reads --cli-smoke . >/dev/null || exit $?
          wf=.github/workflows/skill-tests.yml
          claims="$(grep -v '^[[:space:]]*#' "$wf")"
          set --
          for t in tools/tests/*.test.sh; do
            if printf '%s\n' "$claims" | grep -qF "$t"; then
              base="${t##*/}"
              set -- "$@" "!=${base%.sh}"
            fi
          done
          bash tools/tests/run-all.sh --alone bash32-parse.test "$@"

      - name: the two slowest tools suites
        if: matrix.shard == 'guards-tools-tail'
        run: |
          set -u
          tools/rust-reads --cli-smoke . >/dev/null || exit $?
          fail=0
          failed=""
          for t in tools/tests/harness-smoke.test.sh \
            tools/tests/orch-shard-partition.test.sh; do
            echo "=== $t"
            set --
            case "$t" in
              tools/tests/orch-shard-partition.test.sh) set -- --shell-only ;;
            esac
            if ! bash "$t" "$@"; then
              echo "FAILED: $t"
              fail=1
              failed="$failed $t"
            fi
          done
          if [ "$fail" != 0 ]; then
            echo "FAILED SUITES:$failed"
          fi
          exit "$fail"

      # The hooks name seam moves lane-mail-* and reviewer-* into
      # guards-hooks-tail. Before md-refs moved to guards-commit-tail,
      # PR runs 38075283555 and 38079248844 sum
      # 777s and 696s on macOS for guards-hooks, 778s and 749s for its tail.
      # The first run sums 301s and 389s on Linux. Both halves meet the
      # eight-minute Linux and fourteen-minute macOS summed-suite targets.
      # The cancelled merge_group run 38078925605 gives about 933s and
      # 957s, with md-refs counted at its finished-run high of 123s.
      # Claims assembled below cannot match their own fallback code. A
      # removed tail step returns its suites here; comments claim nothing.
      - name: hook and moved commit-guards suites
        if: matrix.shard == 'guards-hooks'
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          claims="$(grep -v '^[[:space:]]*#' "$wf")"
          md_refs=skills/commit-guards/tests/md-refs
          hooks=()
          guards=()
          for t in hooks/tests/*.sh \
            skills/commit-guards/tests/install-git-hooks.test.sh \
            "$md_refs.test.sh"; do
            claim=""
            case "${t##*/}" in
              lane-mail-*.test.sh) claim="${t%/*}/lane-mail-"'*.test.sh' ;;
              reviewer-*.test.sh) claim="${t%/*}/reviewer-"'*.test.sh' ;;
              md-refs.test.sh) claim="$t" ;;
            esac
            if [ -n "$claim" ] && printf '%s\n' "$claims" | grep -qF "$claim"; then
              continue
            fi
            base="${t##*/}"
            case "$t" in
              hooks/*) hooks+=("=${base%.sh}") ;;
              skills/*) guards+=("=${base%.sh}") ;;
            esac
          done
          fail=0
          # If the tail is removed, its pending-reading timer keeps its isolation here.
          # Both batteries use one pool. Filters apply to both roots.
          batteries=(--battery hooks/tests --alone lane-mail-usage.test)
          if [ "${#guards[@]}" -gt 0 ]; then
            batteries+=(--battery skills/commit-guards/tests)
          fi
          bash skills/orch/tests/run-all.sh "${batteries[@]}" "${hooks[@]}" ${guards[@]+"${guards[@]}"} || fail=1
          exit "$fail"

      - name: lane-mail and reviewer suites
        if: matrix.shard == 'guards-hooks-tail'
        run: |
          set -u
          hooks=()
          for t in hooks/tests/lane-mail-*.test.sh \
            hooks/tests/reviewer-*.test.sh; do
            base="${t##*/}"
            hooks+=("=${base%.sh}")
          done
          fail=0
          # The pending-reading row removes its marker inside the hook's real wait.
          bash skills/orch/tests/run-all.sh --battery hooks/tests \
            --alone lane-mail-usage.test "${hooks[@]}" || fail=1
          exit "$fail"

      # Run 38145396867 spent 301s in pre-push, started near the end of
      # guards-commit. Run 38142822481 added 179s of md-refs after 420s of
      # hooks. Their shared package lets this battery start both together.
      - name: pre-push and md-refs suites
        if: matrix.shard == 'guards-commit-tail'
        run: |
          set -u
          set --
          for t in skills/commit-guards/tests/pre-push.test.sh \
            skills/commit-guards/tests/md-refs.test.sh; do
            base="${t##*/}"
            set -- "$@" "=${base%.sh}"
          done
          bash skills/orch/tests/run-all.sh --battery skills/commit-guards/tests "$@"
      # ---- shard: linear — the linear suites, and the two mid-sized
      # packages that balance the shard against the guard shards ----------
      # The linear CLI's contract is Bash 4 or newer (skills/linear/scripts
      # is tools/bash32-lint's NO_SCAN entry), so under Bash 3 its suites
      # cannot pass. The native eligibility owner excludes the reviewed
      # Bash 4 suites while retaining the runtime contract and unknown work.
      - name: linear, bot-instructions and preflight suites
        if: matrix.shard == 'linear'
        run: |
          set -u
          set -- skills/linear/tests/*.sh
          linear=()
          bot=()
          preflight=()
          for t in "$@" skills/bot-instructions/tests/*.sh skills/preflight/tests/*.sh; do
            case "$t" in skills/linear/tests/must-fail-controls.sh) continue ;; esac
            base="${t##*/}"
            case "$t" in
              skills/linear/*) linear+=("=${base%.sh}") ;;
              skills/bot-instructions/*) bot+=("=${base%.sh}") ;;
              skills/preflight/*) preflight+=("=${base%.sh}") ;;
            esac
          done
          fail=0
          # The control-runner fixtures use a short cap and a real signal window.
          # These parent deadlines distinguish bounded reads and matching from hangs.
          bash skills/orch/tests/run-all.sh \
            --battery skills/linear/tests --alone mutation-isolation.test --alone interrupt.test \
            --battery skills/bot-instructions/tests --alone fsutil.test --alone globs.test \
            --battery skills/preflight/tests "${linear[@]}" "${bot[@]}" "${preflight[@]}" || fail=1
          exit "$fail"
      # ---- shards: linear-controls-a, linear-controls-b: the linear control
      # battery, which the step above skips. Stem cksum parity assigns each
      # control to a or b without weighting its work time.
      # Both need Bash 4, so the macOS leg excludes them.
      - name: linear must-fail controls
        if: matrix.shard == 'linear-controls-a'
        run: bash skills/linear/tests/must-fail-controls.sh --shard 0
      - name: linear must-fail controls
        if: matrix.shard == 'linear-controls-b'
        run: bash skills/linear/tests/must-fail-controls.sh --shard 1

      # ---- shard: worktree — the roster that held half of `rest`'s time.
      # `rest` ran 735-845s on the macOS leg over 79 files, 780s of it on run
      # 35467869265, and worktree's 22 suites are 382s of that: each builds a
      # real git worktree, the slowest work per file in the set. github's
      # roster is 22 files as well and only 102s, which is why the seam here is
      # seconds and not file count. The other 57 files stay in `rest` at 398s,
      # second-opinion's 14 at 203s among them. The skip list in `rest` below
      # reads the path this step spells, so dropping this step sends the roster
      # back there instead of nowhere.
      - name: worktree suites
        if: matrix.shard == 'worktree'
        run: |
          set -u
          set --
          for t in skills/worktree/tests/*.sh; do
            base="${t##*/}"
            case "$base" in *restack*) [ -n "${RUN_ALL_NATIVE_CONTRACTS:-}" ] || continue ;; esac
            set -- "$@" "=${base%.sh}"
          done
          # The held-mutex row must reach the guard before its outer timeout.
          bash skills/orch/tests/run-all.sh --battery skills/worktree/tests \
            --alone worktree_session_guard_lifecycle "$@"

      # Run 38145396867 measured create_restack at 443s, restack_hook_hold
      # at 299s and restack_replay at 86s. The name seam starts these
      # together without first waiting for the other worktree suites.
      - name: worktree restack suites
        if: matrix.shard == 'worktree-restack'
        run: bash skills/orch/tests/run-all.sh --battery skills/worktree/tests restack
      # Slack's process-heavy suites run separately from the other packages.
      # A package glob places new Slack suites here without another roster.
      - name: Mailbox suites
        if: matrix.shard == 'mailbox'
        run: bash skills/orch/tests/run-all.sh --battery skills/mailbox/tests

      - name: Slack suites
        if: matrix.shard == 'slack'
        run: |
          bash skills/orch/tests/run-all.sh --battery skills/slack/tests \
            --alone mailbox.test --alone reload.test --alone socket.test

      # ---- shard: rest — every shell suite no other shard runs. The skip
      # list below names the packages the shards above claim, and a skip is
      # taken only where this file still RUNS that package somewhere else, so
      # a deleted step sends its package here rather than to no shard.
      #
      # THE NEEDLE IS THE OWNING LOOP'S GLOB, not the package's directory
      # prefix: the hooks shards also name commit-guards paths. That prefix
      # would keep this step skipping the package's other suites after the
      # step that runs them was deleted. Each glob below appears
      # once and disappears with its step. `orch` is claimed by a path to
      # run-all.sh rather than by a glob. Its one-line run prefix excludes
      # this step's pooled call. Package variables keep declarations from
      # answering their own claims search.
      # `claims` drops comment lines for the reason the `guards-commit` step
      # above gives. -------------------------------------------------------

      # harness-ci's change-class suite drives a real consumer install and
      # refresh through a real kendex to say which refusal each one earns, and
      # skips those rows where none is on PATH. Without the kendex build step
      # above that skip would be permanent and the rows would be proved on no
      # runner at all.
      # HARNESS_CI_REQUIRE_KENDEX turns the skip into a failure; it is set for
      # every Linux leg in the job's env: above, not here, so a later shard
      # split that moves harness-ci's suites off `rest` reds the shard that
      # picks them up instead of quietly going back to skipping. The fixture
      # builds its own catalog as a local git repository and fetches it into a
      # sandbox HOME, so no source mirror needs priming here. Linux only: the
      # figures above the job's timeout run this shard at 3m07s here against
      # 7m39s on the macOS leg, and the rows judge the classifier rather than
      # the platform, so one leg proves them and the slower one keeps its skip.
      #
      # The kendex those rows run is built from THIS checkout rather than
      # downloaded: the rows read the document `kendex verify --json` prints,
      # and the classifier that reads it ships in the same commit as the
      # verify that prints it, so a build from anywhere else would judge the
      # classifier against a verify from another commit. The contract between
      # the two is the document's `version`, which change-class pins as
      # VERIFY_DOCUMENT_VERSION and which the check below reads out of the
      # script and holds the built binary's own document to, printed for a
      # throwaway project: a binary that answers no `--json`, or one printing
      # another version, fails here rather than leaving the suite to fail on
      # it, where the answer would be a refused render row. A debug build
      # is enough — the suite hands it a sandbox HOME with KENDEX_REAL_HOME
      # set, which is what takes a debug build out of its dev sandbox — and
      # the cargo cache keyed at the build step keeps the build warm across
      # runs.
      - name: the verify document the change-class render rows read
        if: matrix.shard == 'rest' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          if ! PATH="$HOME/.local/bin:$PATH" kendex verify --help | grep -q -- '--json'; then
            echo "kendex-verify-document-missing: the built kendex answers no verify --json" >&2
            exit 1
          fi
          pinned="$(sed -n 's/^VERIFY_DOCUMENT_VERSION=//p' skills/harness-ci/scripts/change-class)"
          throwaway="$(mktemp -d)"
          printf 'schema = 7\n' >"$throwaway/kendex.toml"
          git -C "$throwaway" init -q
          # The prefix rebinds HOME before PATH is read, so the built
          # binary's directory is spelled from the runner's home first.
          bin="$HOME/.local/bin"
          printed="$(cd "$throwaway" && HOME="$throwaway/home" KENDEX_REAL_HOME=1 \
            XDG_CONFIG_HOME="$throwaway/home/.config" XDG_CACHE_HOME="$throwaway/home/.cache" \
            XDG_DATA_HOME="$throwaway/home/.local/share" KENDEX_BACKGROUND_REFRESH=off \
            PATH="$bin:$PATH" kendex verify --scope project --json | jq -r '.version')"
          if [ "$printed" != "$pinned" ]; then
            echo "kendex-verify-document-version: built=$printed pinned=$pinned" >&2
            exit 1
          fi
          echo "verify document version: $printed"

      - name: all other skill suites
        if: matrix.shard == 'rest'
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          claims="$(grep -v '^[[:space:]]*#' "$wf")"
          batteries=()
          for dir in skills/*/tests; do
            suites=("$dir"/*.sh)
            [ -f "${suites[0]}" ] || continue
            x="${dir#skills/}"
            x="${x%%/*}"
            case "$x" in
              orch) needle="run: bash skills/$x/tests/run-all.sh" ;;
              review-gate) needle="skills/$x/tests/*.test.sh" ;;
              github | slack | mailbox) needle="--battery skills/$x/tests" ;;
              commit-guards | linear | bot-instructions | preflight | worktree)
                needle="skills/$x/tests/*.sh" ;;
              *) needle="" ;;
            esac
            if [ -n "$needle" ]; then
              if printf '%s\n' "$claims" | grep -qF -- "$needle"; then
                continue
              fi
              echo "no other shard runs $needle: running $dir here"
            fi
            set --
            case "$x" in
              github) set -- --alone bounded-signal.test --alone pr-merge.test --alone pr-view.test --alone native-contracts.test ;;
              harness-ci) set -- --alone wiring-errors.test ;;
              orch) set -- --alone open-terminal-lane --alone oversee_watch_lifecycle ;;
              reviewer) set -- --alone mutation-stability.test ;;
              second-opinion)
                set -- --alone cli-failure-gate.test --alone detached-run.test \
                  --alone execution-fallback.test --alone process-tree.test ;;
              slack) set -- --alone mailbox.test --alone reload.test --alone socket.test ;;
            esac
            batteries+=(--battery "$dir" "$@")
          done
          # Run 38452700793 reached the deadline before the reviewer and
          # second-opinion packages started. One pool removes package barriers.
          bash skills/orch/tests/run-all.sh "${batteries[@]}"

      # ---- shard: node — every node and bun suite here but the bridge's,
      # which the shard below runs -----------------------------------------
      # setup-node also serves the `pi-claude-bridge` shard's two steps below.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.shard == 'node' || matrix.shard == 'pi-claude-bridge'
        with:
          node-version: 22.19.0

      - name: deep-research node suite
        if: matrix.shard == 'node'
        run: node --test skills/deep-research/tests/deep-research.test.mjs

      - name: pi-extension package policy suite
        if: matrix.shard == 'node'
        run: node --test pi-extensions/package-policy.test.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.shard == 'node'
        with:
          bun-version-file: .bun-version

      # Every peer installs at pi-qol's coding-agent peer floor. The suite
      # reads PI_QOL_PEER_VERSION, and tests/runtime-copy-peers.test.ts refuses
      # a peer installed at any other version.
      - name: pi-qol regression suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-qol
        env:
          PI_QOL_PEER_VERSION: 0.86.0
        run: |
          npm install --save-prod --no-save --no-package-lock --ignore-scripts --no-audit --no-fund "@earendil-works/pi-agent-core@$PI_QOL_PEER_VERSION" "@earendil-works/pi-ai@$PI_QOL_PEER_VERSION" "@earendil-works/pi-coding-agent@$PI_QOL_PEER_VERSION" "@earendil-works/pi-tui@$PI_QOL_PEER_VERSION"
          npm test

      - name: pi-output-policy suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-output-policy
        run: npm test

      # The pi-hooks lane wake suite runs a whole Pi session in process, and
      # the package's own test script installs the Pi its devDependencies pin.
      - name: pi-hooks suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-hooks
        run: npm test

      # pi-nested-agents-md imports only types from pi-coding-agent, which
      # bun erases, so its suite runs with no install.
      - name: pi-nested-agents-md suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-nested-agents-md
        run: npm test

      # The package test command installs the development dependencies its manifest pins.
      # The suite's preload starts a tmux server of its own and fails the
      # run when it cannot, so the runner needs the tmux binary; the
      # GitHub image does not carry it. The whole directory is globbed, so
      # all test files run here without editing this step.
      - name: pi-agents-tmux suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-agents-tmux
        run: |
          git fetch --no-tags --depth=1 origin "$(sed -n 's/^export const BENCHMARK_BASELINE = "\([0-9a-f]*\)";.*/\1/p' tests/browser-fixture.ts)"
          npm test

      # undici is pinned to the package's own declared range: installing it
      # unversioned resolves the registry's latest major, so the proxy
      # transport test would validate a different major than consumers
      # actually install.
      - name: pi-codex-minimal-tools suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-codex-minimal-tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@0.87.1 @earendil-works/pi-coding-agent@0.87.1 @earendil-works/pi-tui@0.87.1 typebox 'undici@^7.29.1'
          npm run typecheck
          npm test

      # pi-questions unit tests are dependency-free by design (question-model
      # and rpc-fallback import nothing outside the package), so unlike the
      # suites above no npm install is needed.
      - name: pi-questions suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-questions
        run: npm test

      # The renderer's batch guard regression needs Pi's nested execution API.
      # pi-ai and pi-agent-core are pinned alongside them because
      # pi-coding-agent pulls them transitively and an unpinned resolution
      # mismatches its exports.
      - name: pi-tool-renderer suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-tool-renderer
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.99.1 @earendil-works/pi-ai@0.99.1 @earendil-works/pi-coding-agent@0.99.1 @earendil-works/pi-tui@0.99.1
          npm test

      # Prompt stash mocks its Pi TUI value imports, so its suite needs no
      # package install.
      - name: pi-prompt-stash suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-prompt-stash
        run: npm test

      # pi-session-bridge imports nothing from Pi outside type positions, the
      # same case as pi-nested-agents-md above, so its suite runs with no install.
      - name: pi-session-bridge suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-session-bridge
        run: npm test

      # The suite mocks @earendil-works/pi-tui with bun's mock.module and
      # imports only the package's leaf modules, so the Pi value imports
      # elsewhere in the package are never loaded and no install is needed.
      - name: pi-session-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-session-manager
        run: npm test

      # pi-ai-compat.ts value-imports pi-ai, so unlike the two above this
      # suite needs a real install. The 0.84.1 line is what the extensions are
      # audited against; pi-agent-core, pi-coding-agent and pi-tui are pinned
      # alongside it because the package value-imports them too and an
      # unpinned resolution mismatches pi-coding-agent's exports.
      - name: pi-skills-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-skills-manager
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1
          npm test

      # `npm ci` rather than a pinned argument list because this suite needs
      # only what the package itself declares: tsx, which its script runs the
      # suite under. It imports Pi in type position only, so nothing it needs
      # falls outside the lockfile. The steps that pass explicit pins do so
      # because their suites need Pi packages declared as peer dependencies,
      # which a lockfile of theirs never resolves.
      - name: pi-caveman suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-caveman
        run: |
          npm ci --no-audit --no-fund
          npm test

      # youtube-transcript-plus is pinned to the package's own declared range
      # for the reason undici is above: unversioned resolves the registry's
      # latest major, so the transcript tests would validate a different major
      # than consumers install. The Pi packages and typebox are value imports
      # on the paths the suite exercises, and tsx is what the test script runs
      # the suite under.
      - name: pi-web-tools suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-web-tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1 typebox tsx 'youtube-transcript-plus@^2.0.1'
          npm test

      # The suite mocks every Pi module and typebox it imports with bun's
      # mock.module, so like pi-session-manager it needs no install.
      - name: pi-background-tasks suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-background-tasks
        run: npm test

      # The package value-imports pi-tui with no mock standing in for it. No
      # module the suite loads reaches that import today, so the install is
      # what keeps a test file that does reach it failing as a test rather
      # than as an unresolved module.
      - name: pi-extension-manager suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-extension-manager
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @earendil-works/pi-agent-core@0.84.1 @earendil-works/pi-coding-agent@0.84.1 @earendil-works/pi-tui@0.84.1
          npm test

      # Mocks its Pi imports the way pi-background-tasks does, so no install.
      # Two of its three files are node:test and one is bun:test; bun's runner
      # executes both, which is why one `npm test` covers the directory.
      - name: pi-task-panel suite
        if: matrix.shard == 'node'
        working-directory: pi-extensions/pi-task-panel
        run: npm test

      # ---- shard: pi-claude-bridge — the node shard's hottest step, split
      # off so its build-plus-suite overlaps the rest instead of extending it.
      # The one package whose CI entry point is `test:ci` rather than `test`:
      # its `test` script also runs integration suites that need API keys and
      # a live provider, which a runner has neither of. `test:ci` is the
      # subset CI can prove, and declaring it in the package is what keeps
      # that exclusion visible to the inventory case in
      # pi-extensions/package-policy.test.mjs instead of reading as an
      # uncovered package. It builds first because one suite loads
      # bundle/connector-inventory.js rather than src, so a src change without
      # a rebuild has to fail here.
      # `npm ci` is deliberately NOT allowed to fall back to `npm install`:
      # the bundle assertion below only proves the artifact came from the
      # committed lockfile if the install itself was lockfile-strict.
      - name: pi-claude-bridge unit suite
        if: matrix.shard == 'pi-claude-bridge'
        working-directory: pi-extensions/pi-claude-bridge
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci

      # bundle/index.js is the artifact Pi loads and npm publishes. A clean
      # lockfile build must reproduce the committed bytes exactly.
      - name: pi-claude-bridge bundle matches a clean lockfile build
        if: matrix.shard == 'pi-claude-bridge'
        working-directory: pi-extensions/pi-claude-bridge
        run: git diff --exit-code -- bundle/

      - name: Report final job budget
        if: success()
        run: bash skills/orch/tests/run-all.sh --report-job

  # THE NIGHTLY macOS ROSTER, on the daily schedule or a manual dispatch.
  # changes is skipped there, so the shared matrix expression uses its
  # full-roster fallback. The suite steps and budgets have one owner.
  skill-suites-macos:
    name: Skill suites shard (${{ matrix.shard }}, ${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        shard: *skill-suite-shards
        os: [macos-latest]
        # The native eligibility owner declares unsupported and empty shards.
        # The partition proof holds these exclusions to its actual native files.
        exclude:
          - os: macos-latest
            shard: node
          - os: macos-latest
            shard: pi-claude-bridge
          - os: macos-latest
            shard: linear-controls-a
          - os: macos-latest
            shard: linear-controls-b
          - os: macos-latest
            shard: orch-oversee-watch
          - os: macos-latest
            shard: worktree-restack
          - os: macos-latest
            shard: guards-scans
          - os: macos-latest
            shard: guards-tools-tail
          - os: macos-latest
            shard: guards-commit-tail
    runs-on: ${{ matrix.os }}
    timeout-minutes: *skill-suite-timeout
    env: *skill-suite-env
    steps: *skill-suite-steps

  # THE PATCH'S macOS LEGS: merge groups run the shards the changes job's
  # `queue_macos_shards` list names; tools/ci-job-set's header states when
  # it is empty. Where the classifier published nothing the nightly roster
  # less its Linux-only shards runs. CI holds this job to the same list, so
  # a failed or cancelled leg ejects the entry and an unselected one does
  # not.
  skill-suites-macos-queue:
    name: Skill suites shard (${{ matrix.shard }}, ${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.queue_macos_shards != '[]') }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.result != 'success' && '["review-gate", "refresh", "orch-terminal", "orch-oversee", "orch-oversee-succeed", "orch-dev", "orch-state", "orch-rest", "guards-commit", "guards-hooks", "guards-hooks-tail", "guards-tools", "linear", "worktree", "rest", "slack", "mailbox"]' || needs.changes.outputs.queue_macos_shards) }}
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: *skill-suite-timeout
    env: *skill-suite-env
    steps: *skill-suite-steps

  # Full UI validation reaches the required aggregator on every merge group
  # that selects it.
  ui-tests:
    name: UI (vitest, tsc, biome)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      # `npm ci`, never `npm install`: a suite proving the app against
      # resolutions the tree does not commit proves them for nobody else.
      - name: install
        working-directory: ui
        run: npm ci --no-audit --no-fund
      - name: vitest
        working-directory: ui
        run: npm test
      # One step per ui/package.json script, because a script that short-
      # circuits another hides its findings: `check` runs `check:types` before
      # `check:lint`, so a type error would report no lint failure at all.
      # tools/guard --full runs these same three scripts, which is what keeps the two
      # callers from drifting — the commands live in package.json, not here.
      # always(): a red step above must not hide the ones after it.
      - name: check:types
        if: always()
        working-directory: ui
        run: npm run check:types
      - name: check:lint
        if: always()
        working-directory: ui
        run: npm run check:lint

  preflight:
    # Dogfoods the preflight skill on this repo's own changes. It is
    # diff-scoped, against the merge group's base, which is the tree the
    # change lands on; its findings (fail-open bash, dead doc citations,
    # broken JSON/TOML) are the classes that otherwise surface as bot-review
    # round-trips. CI requires it on every merge group.
    name: Preflight (diff-scoped deterministic checks)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: preflight against the group's base
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: skills/preflight/scripts/preflight --base "$BASE"

  markdown:
    # The range scan checks the change against the merge group's base. The
    # full scan keeps the repository's configured all-tree push scope. This
    # required check prevents a hook bypass from putting Markdown on main
    # that the next local push must refuse. CI requires it on every merge
    # group.
    name: Markdown (format + references)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: markdown format against the group's base and across the full tree
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          skills/commit-guards/scripts/md-format --against "$BASE"
          skills/commit-guards/scripts/md-format --all
      - name: markdown references against the group's base
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: skills/commit-guards/scripts/md-refs --against "$BASE"

  # CARGO, SHARDED BY PACKAGE on the two platforms whose workspace job had
  # passed five minutes: Linux at 329s and macOS at 631s, means of the last
  # ten runs. Windows, at 230s, stays one job below. On macOS the kendex-cli
  # package is sharded again, by `--test` target, for the reasons the roster
  # step in that job gives. Every lane compiles in a step of its own
  # (`--no-run`) so a compile failure reads as one, and on the push to main
  # that step is the whole job on every platform: it saves the compile cache
  # under the merged lockfile, the entry the next group and night restore.
  # The nightly run compiles on every platform and tests on macOS and
  # Windows, which catches a failure that changes passing alone cause in
  # combination. Splitting a lane adds legs under `CI` and changes no
  # required context name.
  #
  # One compile cache per shard, keyed by the action on the lockfile, the
  # toolchain and RUSTFLAGS, plus the crate — and on macOS the leg — through
  # `key:` so parallel shards never race one entry. A pull request runs no
  # lane and saves none; the main and nightly runs save the entries every
  # other ref restores, and a change to the lockfile restores the nearest
  # older entry.
  cargo-linux:
    name: Cargo ${{ matrix.crate }} (Linux)
    needs: changes
    # What selects this lane, and why: tools/ci-job-set, cargo_linux.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.cargo_linux == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        crate: [kendex-core, kendex-cli, kendex-app]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Full debuginfo across the Tauri workspace out-links the runner's
      # memory — three group runs died with the cargo step "cancelled" and
      # no step output, the OOM-kill signature. Tests don't read debuginfo.
      # Incremental artifacts are dead weight on a fresh runner and
      # double what cargo writes.
      RUSTFLAGS: -C debuginfo=0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
      # THE load-bearing crate guard, the cargo twin of the shard guard above:
      # a workspace member the matrix does not name compiles under the lint
      # job's --workspace and is tested nowhere, while both required contexts
      # stay green. Every `crate:` line in this file must spell the member set
      # cargo reports, so a new member fails here until it is sharded.
      - name: crate matrix agrees with the workspace members
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          members="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[].name' | sort -u)"
          [ -n "$members" ] || { echo "no workspace member read from cargo metadata"; exit 1; }
          lines="$(sed -n 's/^ \{8\}crate: \[\(.*\)\]$/\1/p' "$wf")"
          [ -n "$lines" ] || { echo "no crate matrix read from $wf"; exit 1; }
          while IFS= read -r line; do
            declared="$(printf '%s\n' "$line" | tr -d ' ' | tr ',' '\n' | sort -u)"
            diff <(printf '%s\n' "$members") <(printf '%s\n' "$declared") || { echo "crate matrix [$line] disagrees with the workspace: '<' a member no shard tests; '>' a name that is not a member"; exit 1; }
          done <<<"$lines"
      # Its file twin: autodiscovery is off in every crate, so a file under
      # tests/ that no [[test]] root declares compiles nowhere while the
      # compile step below stays green. tools/test-roster holds that roster
      # and tools/guard runs it at commit time; this step runs it where a
      # commit made without the armed hook merges.
      - name: every test file is compiled by a harness
        run: tools/test-roster
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.crate }}
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      # The keychain store links dbus in every crate; the app shell links
      # webkit and gtk in its own.
      - name: System dependencies
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -u
          pkgs=(libdbus-1-dev)
          [ "$CRATE" != kendex-app ] || pkgs+=(libwebkit2gtk-4.1-dev libgtk-3-dev)
          sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update && sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y "${pkgs[@]}"
      # pi_carrier.rs runs the `pi-hooks` carrier for its end-to-end case — a
      # hook declared in kendex.toml firing under Pi — and skips without bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.crate == 'kendex-core'
        with:
          bun-version-file: .bun-version
      - name: compile
        timeout-minutes: 20
        run: cargo test -p ${{ matrix.crate }} --locked --no-run
      # Tests alone on a warm cache, last ten runs: kendex-cli ~150s
      # (catalog_render_lint 103s and guard_hooks 25s of it), kendex-core
      # ~20s, kendex-app ~10s. This leg is not split: 150s sits inside the
      # five-minute Linux trigger the header sets, and the test that costs
      # the macOS leg its own leg costs 103s here. The merge group runs the
      # Linux tests; the main and nightly runs compile only.
      - name: test
        if: github.event_name == 'merge_group'
        timeout-minutes: 10
        run: cargo test -p ${{ matrix.crate }} --locked --no-fail-fast
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ matrix.crate == 'kendex-cli' && github.token || '' }}

  # The app ships on macOS. tools/guard --full checks the core and CLI Apple
  # targets when explicitly requested; these shards execute the tests on the
  # platform.
  cargo-macos:
    name: macOS cargo ${{ matrix.crate }}${{ matrix.leg != 'whole' && format(' ({0})', matrix.leg) || '' }}
    needs: changes
    # What selects this lane, and why: tools/ci-job-set, cargo_macos.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.cargo_macos == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        crate: [kendex-core, kendex-cli, kendex-app]
        # kendex-cli runs as four legs over targets and test names; the other two
        # crates run whole. The excludes prune the combinations those two
        # lists do not mean, and the `crate:` line still spells the workspace
        # member set the guard in the steps below reads.
        leg: [whole, render-lint, rest, verify-lock, apply-locked]
        exclude:
          - crate: kendex-core
            leg: render-lint
          - crate: kendex-core
            leg: rest
          - crate: kendex-core
            leg: verify-lock
          - crate: kendex-core
            leg: apply-locked
          - crate: kendex-app
            leg: render-lint
          - crate: kendex-app
            leg: rest
          - crate: kendex-app
            leg: verify-lock
          - crate: kendex-app
            leg: apply-locked
          - crate: kendex-cli
            leg: whole
    runs-on: macos-latest
    # Every CLI job reserves the existing 20-minute cold-compile allowance,
    # its measured test bound, and 5 minutes for setup and cleanup. The
    # calculation and warm-cache evidence are beside the cited runs at test.
    # Warm job maxima cannot bound a cold build, including the new leg's key.
    # The whole-crate jobs retain their compile + test + setup allowance.
    timeout-minutes: ${{ matrix.leg == 'render-lint' && 33 || matrix.leg == 'rest' && 38 || matrix.leg == 'verify-lock' && 37 || matrix.leg == 'apply-locked' && 38 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
      # The same guard as the Linux shard's, on this file's own crate lines.
      - name: crate matrix agrees with the workspace members
        run: |
          set -u
          wf=.github/workflows/skill-tests.yml
          members="$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[].name' | sort -u)"
          [ -n "$members" ] || { echo "no workspace member read from cargo metadata"; exit 1; }
          lines="$(sed -n 's/^ \{8\}crate: \[\(.*\)\]$/\1/p' "$wf")"
          [ -n "$lines" ] || { echo "no crate matrix read from $wf"; exit 1; }
          while IFS= read -r line; do
            declared="$(printf '%s\n' "$line" | tr -d ' ' | tr ',' '\n' | sort -u)"
            diff <(printf '%s\n' "$members") <(printf '%s\n' "$declared") || { echo "crate matrix [$line] disagrees with the workspace: '<' a member no shard tests; '>' a name that is not a member"; exit 1; }
          done <<<"$lines"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The leg is in the key because the kendex-cli legs compile
          # different target sets and would otherwise race one entry.
          key: ${{ matrix.crate }}-${{ matrix.leg }}
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      # pi_carrier.rs is a unix test, so with bun installed it runs here too
      # instead of skipping on the platform the app ships on.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.crate == 'kendex-core'
        with:
          bun-version-file: .bun-version
      # THE cargo twin of the shell shards' rosters. The crate guard above
      # spells the workspace MEMBERS and covers no list of test targets, so a
      # [[test]] target added to crates/cli/Cargo.toml and named by neither
      # leg would compile under --no-run and run nowhere while both required
      # contexts stayed green. Every test target `cargo metadata` reports for
      # kendex-cli is named by exactly one leg below, except `integration`,
      # whose tests are split by the harness's own name filters. The suite
      # tools/tests/orch-shard-partition.test.sh runs this step once per leg
      # and reds on a test claimed by none or by two. A test FILE is not a
      # target: every file under crates/cli/tests except the [[test]] targets
      # Cargo.toml declares is a module of the `integration` harness, and
      # tools/test-roster holds that roster, run by tools/guard at commit
      # time and by the Linux cargo job above.
      #
      # The seam is where the seconds are. Over seventeen macOS kendex-cli
      # runs of this workflow the one test in `catalog_render_lint` took
      # 801-1012s, and over the eleven of those whose step was not killed at
      # its bound every other target together took 235-267s. That test
      # installs every package on every harness and lints the result, so it
      # carries the lane and it carries a leg of its own.
      # Doc tests ride this roster too. A leg that selects no target at all
      # gets them from cargo, but `--doc` cannot be mixed with a target
      # selection, so a leg that names targets owes them a second invocation
      # or they run on Linux and nowhere here. Exactly one kendex-cli leg
      # carries `--doc`, rest; orch-shard-partition.test.sh holds
      # that count, since no `--test` roster can show a missing `--doc`.
      - name: cargo test targets for this leg
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -u
          doc=''
          filters=''
          integration=''
          case "$LEG" in
            whole) flags='' ;;
            render-lint) flags='--test catalog_render_lint' ;;
            verify-lock)
              flags=''
              integration='--test integration'
              filters='verify_ lock_record:: toggle_locked::'
              ;;
            apply-locked)
              flags=''
              integration='--test integration'
              filters='apply_locked:: refresh_ --skip verify_'
              ;;
            rest)
              doc='--doc'
              flags='--lib --bins'
              integration='--test integration'
              filters='--skip verify_ --skip lock_record:: --skip toggle_locked:: --skip apply_locked:: --skip refresh_'
              flags="$flags --test cli_smoke"
              ;;
            *) echo "no target roster for leg $LEG"; exit 1 ;;
          esac
          echo "cargo-targets: $flags $integration"
          echo "cargo-main-targets: $flags"
          echo "cargo-doc: $doc"
          echo "cargo-filters: $filters"
          echo "cargo-integration: $integration"
          echo "CARGO_TARGETS=$flags" >> "$GITHUB_ENV"
          echo "CARGO_DOC=$doc" >> "$GITHUB_ENV"
          echo "CARGO_FILTERS=$filters" >> "$GITHUB_ENV"
          echo "CARGO_INTEGRATION=$integration" >> "$GITHUB_ENV"
      # 44-210s warm across the three crates; the bound is for a cold cache.
      - name: compile
        timeout-minutes: 20
        run: cargo test -p ${{ matrix.crate }} --locked --no-run $CARGO_TARGETS $CARGO_INTEGRATION
      # Reuse rest's compiled integration harness to list this platform's
      # test names. The shell shard checks its own partition without Cargo.
      - name: CLI integration name partition
        if: matrix.crate == 'kendex-cli' && matrix.leg == 'rest' && github.event_name != 'push'
        run: bash tools/tests/orch-shard-partition.test.sh --cargo-only
      # CLI measurements: 15 successful main-push Skill Tests runs on
      # 2026-10-09: 37882328114, 37880822013, 37880007749, 37879167232,
      # 37878878860, 37876175474, 37875494584, 37875447295, 37872580775,
      # 37872477875, 37872452783, 37867125177, 37866360021, 37865707185,
      # 37865455977. Raw job timestamps and rest logs are attached to KEN-3530.
      # Step maxima: render-lint 382s, unsplit rest 618s, verify-lock 538s.
      # Each bound is ceil(maximum * 1.25 / 60): 8, 13, 12 minutes.
      # CLI job ceilings reserve 20 minutes for compile + this test bound +
      # 5 minutes for setup: render-lint 33, rest 38, verify-lock 37,
      # apply-locked 38. Measured warm job maxima are 478s, 760s, 682s
      # respectively; those cache-hit samples do not measure cold builds.
      # Cold-cache job time remains unmeasured, so its compile reserve stays.
      # Historical apply_locked:: work finished within 136.405s of the
      # integration harness starting, including preceding and concurrent
      # tests. This is an estimate, not a standalone leg measurement.
      # Across KEN-4013's merge-group sample, apply-locked's test step had
      # a 205s median and 356s maximum; rest's median was 764s against its
      # 780s limit. Moving non-verification refresh tests into apply-locked
      # uses that existing leg's room. verify_ remains with verify-lock.
      # The split removes that family from rest to meet the 600s split figure;
      # hosted PR timing must confirm both legs, independently of their bounds.
      # All filters are libtest substrings; new integration tests still land
      # in one leg. Whole-crate bounds retain their measured 534s core and
      # 81s app maxima with the existing allowance.
      # --no-fail-fast: one run reports
      # every platform-specific failure instead of one per queue attempt.
      # Every selected invocation runs and the step fails if any did, the same
      # reason --no-fail-fast has: one run reports everything. The doc run is
      # 0 tests and half a second today, well inside the bound above.
      # Integration filters get their own invocation: passing them alongside
      # --lib, --bins or cli_smoke would also filter those unrelated tests.
      # The push to main compiles for the cache alone; the merge group and
      # the nightly run test.
      - name: test
        if: github.event_name != 'push'
        timeout-minutes: ${{ matrix.leg == 'render-lint' && 8 || matrix.leg == 'rest' && 13 || matrix.leg == 'verify-lock' && 12 || matrix.leg == 'apply-locked' && 13 || 12 }}
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ matrix.crate == 'kendex-cli' && (matrix.leg == 'rest' || matrix.leg == 'verify-lock' || matrix.leg == 'apply-locked') && github.token || '' }}
        run: |
          set -u
          rc=0
          if [ -n "$CARGO_TARGETS" ] || [ -z "$CARGO_INTEGRATION" ]; then
            cargo test -p ${{ matrix.crate }} --locked --no-fail-fast $CARGO_TARGETS || rc=$?
          fi
          if [ -n "$CARGO_INTEGRATION" ]; then
            cargo test -p ${{ matrix.crate }} --locked --no-fail-fast $CARGO_INTEGRATION -- $CARGO_FILTERS || rc=$?
          fi
          if [ -n "$CARGO_DOC" ]; then
            cargo test -p ${{ matrix.crate }} --locked "$CARGO_DOC" || rc=$?
          fi
          exit "$rc"
      # Nothing platform-gated is skipped in silence: the files whose
      # whole-body cfg gate excludes this platform are listed, with a warning
      # that names the count, so the coverage this lane does not give is on
      # the run that did not give it.
      - name: files under crates/*/tests this platform never runs
        run: |
          set -u
          gated="$(grep -rlE '^#!\[cfg\(target_os = "linux"' --include='*.rs' crates/*/tests | sort)" || true
          n="$(printf '%s\n' "$gated" | grep -c . || true)"
          [ "$n" != 0 ] || { echo "no test file under crates/*/tests is gated off macOS"; exit 0; }
          printf '%s\n' "$gated"
          echo "::warning title=platform-gated tests::$n files under crates/*/tests carry a whole-file cfg gate that excludes macOS; the list is in this step"

  # Rides beside the Linux shards rather than inside one: the workspace
  # lints compile every target under clippy, and a test shard that
  # carried them would pay that on top of its own compile. `--all-targets` is
  # the point: without it the workspace denials in Cargo.toml never reach
  # test targets, which is most of the code in this repo. What they then
  # catch is helper code in the integration tests under `crates/*/tests/`:
  # clippy.toml's allows (`unwrap_used`, `expect_used`, `print_stdout`,
  # `print_stderr`) cover a whole `#[cfg(test)]` module, helpers included,
  # but outside one they reach only a `#[test]` body. `dbg_macro`, `todo`,
  # `unimplemented` are denied in test code either way. The default native
  # targets retain the length denial for production and build scripts;
  # test compilations, including their private helpers, have no length cutoff.
  cargo-lint:
    name: Cargo lints (clippy, fmt, doc)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'merge_group' && (needs.changes.result != 'success' || needs.changes.outputs.cargo_lint == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTFLAGS: -C debuginfo=0
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: System dependencies for the keychain store and the app shell
        run: sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update && sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: cargo clippy
        timeout-minutes: 20
        run: |
          status=0
          cargo clippy --workspace --locked -- -D clippy::too_many_lines || status=1
          cargo clippy --workspace --all-targets --locked || status=1
          exit "$status"
      # always(): a red step above must not swallow the ones after it.
      - name: cargo fmt
        if: always()
        run: |
          cargo fmt --check || echo '::warning title=Rust formatting::cargo fmt --check reported formatting differences'
      # Private rustdoc links are checked on lib and bin targets. Rustdoc
      # offers no test-target flag for integration-test documentation.
      - name: cargo doc
        if: always()
        timeout-minutes: 10
        run: cargo doc --no-deps --document-private-items --workspace --locked

  # The app ships on Windows and release.yml builds it there. `cargo check`
  # does not link, so the Linux runner proves the Windows targets compile
  # without one, and it answers in a minute where the executing lane below
  # takes the workspace build first — a `std::os::unix` reach in test code
  # fails here before that one has finished linking. Scope matches
  # tools/guard --full's cross-target lane: app needs the platform's C toolchain,
  # core and CLI are portable.
  cargo-check-windows:
    name: Windows cargo (core and CLI targets compile)
    needs: changes
    # What selects this lane, and why: tools/ci-job-set, cargo_windows_check.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.cargo_windows_check == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      # rust-toolchain.toml overrides the toolchain the action installed, so
      # the target belongs on the pinned one — an action `targets:` input
      # lands on the other and surfaces as E0463 at compile time. `rustc
      # --version` resolves the pin; the add is its own step, so a target
      # that will not install reads as a setup failure.
      - name: Windows target for the pinned toolchain
        run: |
          rustc --version
          rustup target add x86_64-pc-windows-msvc
      - name: cargo check
        timeout-minutes: 15
        run: cargo check -p kendex-core -p kendex-cli --all-targets --locked --target x86_64-pc-windows-msvc

  # One job, under five minutes (230s mean, 161s of it the cargo step on a
  # warm cache): 935 unit tests and the handful of integration files with no
  # unix gate. What it does not run is listed by the last step.
  cargo-tests-windows:
    name: Windows cargo (workspace tests)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.cargo_windows == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      - name: compile
        timeout-minutes: 25
        run: cargo test --workspace --locked --no-run
      - name: test
        if: github.event_name != 'push'
        timeout-minutes: 10
        run: cargo test --workspace --locked --no-fail-fast
      # Same posture as the macOS step of that name: Windows is where most of
      # the integration tree is gated off, so the count here is the finding.
      - name: files under crates/*/tests this platform never runs
        shell: bash
        run: |
          set -u
          gated="$(grep -rlE '^#!\[cfg\((unix|all\(not\(windows\)|target_os = "linux")' --include='*.rs' crates/*/tests | sort)" || true
          n="$(printf '%s\n' "$gated" | grep -c . || true)"
          [ "$n" != 0 ] || { echo "no test file under crates/*/tests is gated off Windows"; exit 0; }
          printf '%s\n' "$gated"
          echo "::warning title=platform-gated tests::$n files under crates/*/tests carry a whole-file cfg gate that excludes Windows; the list is in this step"

  # The main and nightly runs run both checks whatever the paths: external
  # releases can change without a repository path changing.
  # The default catalog must pass the released engine's strict validation.
  catalog:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.catalog == 'true') }}
    permissions:
      contents: read
    # The package-suites leg runs the suites a Linux shard gives a kendex.
    # For orch those are the orch-terminal and orch-rest shards, 800s and 436s
    # of suites in merge-group run 39197875058, together past that run's
    # slowest other job, 1204s. A merge group splits them over two jobs, each
    # rendering the catalog again; other events run one.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'merge_group' && '["1/2", "2/2"]' || '["1/1"]') }}
    uses: ./.github/workflows/catalog-check.yml
    with:
      path: .
      strict: true
      # Each part renders the catalog and runs its share of the kendex suites;
      # a part that cannot read which suites those are fails instead of
      # running the package whole.
      timeout-minutes: 90
      # Exercise this branch's CI scripts, never a binary built from it.
      ref: ${{ github.sha }}
      # Every changed package's suites see one tmux, the release the
      # `tmux for pane delivery tests` step installs and gives its reason for.
      suite-command: >-
        ${{ github.event_name == 'merge_group' && format('
        brew=/home/linuxbrew/.linuxbrew/bin/brew;
        "$brew" install tmux;
        tmux_dir="$("$brew" --prefix tmux)/bin";
        export PATH="$tmux_dir:$PATH";
        tmux -V;
        orch_paths=$(git diff --name-only "$CATALOG_BASE" -- skills/orch .agents/skills/orch);
        if [ -n "$orch_paths" ]; then
          if ! command -v fish >/dev/null; then sudo apt-get update; sudo apt-get install -y fish; fi;
          if ! command -v claude >/dev/null; then
            npm install --prefix "$RUNNER_TEMP/release-suite-tools" --no-save --no-package-lock --no-audit --no-fund @anthropic-ai/claude-code;
            export PATH="$RUNNER_TEMP/release-suite-tools/node_modules/.bin:$PATH";
          fi;
        fi;
        tools/guard --released-packages "$HOME/.local/bin/kendex" --part {0} --range "$CATALOG_BASE"', matrix.part) || '' }}

  # Each installed harness CLI reads the sample catalog emitted by this
  # checkout's renderers. The reusable workflow uses the released engine
  # and does not test these renderer binaries.
  smoke:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (github.event_name != 'merge_group' || needs.changes.result != 'success' || needs.changes.outputs.smoke == 'true') }}
    name: real-CLI round trip
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable; upstream has no vX.Y.Z release
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      - name: System dependencies for the keychain store
        run: sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} update && sudo apt-get ${{ env.APT_ACQUIRE_OPTIONS }} install -y libdbus-1-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The workflow is the key input, so a changed group can miss main.
          cache: ${{ github.event_name != 'merge_group' && 'npm' || '' }}
          cache-dependency-path: .github/workflows/skill-tests.yml
      - name: Install the freely installable harness CLIs
        # Latest releases detect changes in harness file readers. Version
        # probes catch launchers whose optional platform binaries failed to
        # install before the Rust tests start.
        run: |
          npm install -g \
            opencode-ai \
            @google/gemini-cli \
            @openai/codex \
            @github/copilot
          # Only CLIs whose version flag is confirmed; adding one means
          # confirming it first, because a wrong probe here reds the build
          # for a reason that has nothing to do with kendex.
          for cli in opencode codex gemini copilot; do "$cli" --version; done
      - name: Round-trip the emitted trees
        env:
          KENDEX_CLI_SMOKE: "1"
        run: cargo test -p kendex-cli --test cli_smoke -- --nocapture

  # The aggregate CI context follows the repository required-checks ruleset.
  # Every other job reports into it except the nightly macOS skill suites.
  # GitHub counts a skipped required context as satisfied. `always()` keeps
  # a failed or skipped need from skipping this context on pull_request and
  # merge_group. It does not run on the main or nightly runs, where nothing
  # requires it.
  #
  # On a pull request every other job is skipped and this context passes:
  # GitHub admits the pull request to the queue on it, and the merge group
  # proves the head. On a merge group tools/ci-aggregate accepts a skipped
  # lane only where the changes job selected it `false`; every job it needs
  # that no lane names must succeed.
  ci:
    name: CI
    needs: [changes, bot-instructions, skill-suites-shard, skill-suites-macos-queue, ui-tests, preflight, markdown, cargo-linux, cargo-macos, cargo-lint, cargo-check-windows, cargo-tests-windows, catalog, smoke]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: a pull request runs no lane
        if: github.event_name == 'pull_request'
        run: echo 'ci-pull-request event=pull_request lanes=none proof=merge_group'
      # This source repository proves tools/ci-aggregate on its own merge group.
      # Review holds this candidate helper; consumers use the default-branch helper.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'merge_group'
        with:
          persist-credentials: false
      - name: every needed job succeeded
        if: github.event_name == 'merge_group'
        env:
          RESULTS: ${{ toJSON(needs) }}
          SHELL_SHARDS: ${{ needs.changes.outputs.shell_shards == 'true' && needs.changes.outputs.shell_os != '["macos-latest"]' }}
          MACOS_QUEUE: ${{ needs.changes.outputs.queue_macos_shards != '[]' }}
          UI: ${{ needs.changes.outputs.ui }}
          BOT_INSTRUCTIONS: ${{ needs.changes.outputs.bot_instructions }}
          CARGO_LINUX: ${{ needs.changes.outputs.cargo_linux }}
          CARGO_MACOS: ${{ needs.changes.outputs.cargo_macos }}
          CARGO_LINT: ${{ needs.changes.outputs.cargo_lint }}
          CARGO_WINDOWS: ${{ needs.changes.outputs.cargo_windows }}
          CARGO_WINDOWS_CHECK: ${{ needs.changes.outputs.cargo_windows_check }}
          CATALOG: ${{ needs.changes.outputs.catalog }}
          SMOKE: ${{ needs.changes.outputs.smoke }}
        run: |
          echo "$RESULTS"
          tools/ci-aggregate --results "$RESULTS" --classifier changes \
            --lane "$SHELL_SHARDS:skill-suites-shard" \
            --lane "$MACOS_QUEUE:skill-suites-macos-queue" \
            --lane "$UI:ui-tests" \
            --lane "$BOT_INSTRUCTIONS:bot-instructions" \
            --lane "$CARGO_LINUX:cargo-linux" \
            --lane "$CARGO_MACOS:cargo-macos" \
            --lane "$CARGO_LINT:cargo-lint" \
            --lane "$CARGO_WINDOWS_CHECK:cargo-check-windows" \
            --lane "$CARGO_WINDOWS:cargo-tests-windows" \
            --lane "$CATALOG:catalog" \
            --lane "$SMOKE:smoke"
