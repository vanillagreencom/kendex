[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "5.0.1"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
kendex-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
dirs = "6"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri = "2"
tauri-build = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tempfile = "3"
sha2 = "0.11"
# One diff engine covers cached version trees and installed files that live
# in no repository; `git diff` cannot see the latter.
similar = "2"
yaml-rust2 = "0.10"
fd-lock = "4"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

# A doc citation naming something that no longer exists is worse than none:
# it sends a reader looking for a symbol the rename already took away. The
# guard documents private items, so an unresolvable citation is caught
# whether what it named was public or not. What that leaves is rustdoc
# saying a public comment's link to a private item would break in a page
# built without that flag — and these comments are written for whoever is
# reading the source, not for a page anybody builds.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
