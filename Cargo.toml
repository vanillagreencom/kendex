[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/cli"]

[workspace.package]
version = "5.0.1"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
kendex-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
# The format-preserving half of the same parser: kendex.toml is written by
# hand, so a write folds the changed keys into that document instead of
# re-serializing over it.
toml_edit = "0.25"
dirs = "6"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
# The CLI's terminal rendering: intro/outro framing, grouped log blocks,
# confirm prompts and spinners. The plain rendering uses none of it.
cliclack = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri = "2"
tauri-build = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "toml"] }
specta-typescript = "0.0.12"
tempfile = "3"
sha2 = "0.11"
# One diff engine covers cached version trees and installed files that live
# in no repository; `git diff` cannot see the latter.
similar = "2"
yaml-rust2 = "0.10"
fd-lock = "4"
# Already in the tree under fd-lock; used directly for the explicit unlock
# that releases a lock's open file description before the fd closes, and
# for the effective uid, which is how a run learns it is privileged without
# reading a variable whoever invoked it chose.
rustix = { version = "1", features = ["fs", "process"] }
# Already in the tree under rustix and tempfile; used directly for the
# security descriptor a private credential file is created with on
# Windows, which std exposes no way to pass.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
unicode-normalization = "0.1"
semver = "1"
# The app already verifies its own downloads with these, through
# tauri-plugin-updater; `kendex update` reaches for them directly so the
# two delivery paths for one AppImage hold the same bar.
minisign-verify = "0.2"
base64 = "0.22"
# Where a markdown document's blocks are, and which of its backticks pair
# into a code span. A safety rule reads a switch inside a span as a mention
# and one outside it as a use, so the reading has to be markdown's own: a
# hand-written walk is correct for the shapes it models and silently
# fail-open for every one it does not. This is the parser rustdoc reads
# with. The HTML writer and the CLI's argument parsing come with it by
# default and neither is wanted, so both are off.
pulldown-cmark = { version = "0.13", default-features = false }

# Denied rather than forbidden so a Win32 call that has no safe binding
# can allow it per function with a reason; everywhere else an `unsafe`
# block is still refused. Where that boundary sits is recorded in
# `crates/core/AGENTS.md`, not here.
[workspace.lints.rust]
unsafe_code = "deny"

# A doc citation to a missing item sends a reader to a symbol that does not
# exist. The
# guard documents private items, so an unresolvable citation is caught
# whether what it named was public or not, across the lib and bin targets
# cargo doc builds. It offers no test-target flag, so the citations under
# crates/*/tests/ go unchecked. What that leaves is rustdoc saying a public
# comment's link to a private item would break in a page built without that
# flag — and these comments are written for whoever is reading the source,
# not for a page anybody builds.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"

# What an agent lane builds to learn that the tree compiles and its tests
# pass: release without link-time optimization, which the github helper's
# `pr-cross-check --verify` selects once this table exists. The shipped
# binary and the benchmarks keep the release profile, so this table adds a
# build and changes none.
[profile.agent]
inherits = "release"
lto = "off"
opt-level = 1
codegen-units = 16
