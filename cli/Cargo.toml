[package]
name = "vstack"
version = "4.9.0"
edition = "2024"
description = "CLI tool for installing vstack skills and agents across AI coding harnesses"
license = "MIT"

[dependencies]
# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28", "underline-color"] }
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
# Format-preserving TOML editing: every write to a user's `config.toml` keeps
# their comments, spacing and key order while staying syntax-aware. Already in
# the tree as `toml`'s own parser, so this is a promotion, not a new dependency.
toml_edit = "0.22"
# Format-preserving JSONC: the same promise `toml_edit` makes for codex's
# `config.toml`, for the harness configs whose own loader accepts comments.
# Its CST parses and re-renders a document byte-faithfully, so an install or a
# removal edits the one value it owns and leaves every comment, blank line and
# key order the user wrote exactly where it was.
jsonc-parser = { version = "0.33", default-features = false, features = ["cst", "serde_json"] }

# Regex (lightweight)
regex-lite = "0.1"

# Filesystem
walkdir = "2"
zip = "0.6"

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
dirs = "6"

# Advisory file locking for the remote source cache (unix flock)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
