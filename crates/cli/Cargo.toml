[package]
name = "kendex-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The integration tests are one harness, tests/main.rs, and every other file
# under tests/ is a module of it: autodiscovery off, or cargo would still
# build each file as a test binary of its own, linking this crate and its
# dependencies once per file.
autotests = false

[lib]
name = "kendex_cli"

[[bin]]
name = "kendex"
path = "src/bin/kendex.rs"

[dependencies]
kendex-core.workspace = true
clap.workspace = true
serde_json.workspace = true
cliclack.workspace = true
console.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Fixtures write manifests, and the serializer is what decides how a host
# path is quoted in one. Already in the workspace; the CLI itself parses
# no TOML.
toml.workspace = true
# Fixtures serve the release feed off disk, and a `file://` URL for a host
# path is a grammar, not a substitution. Already in the tree under tauri.
url = "2"

[target.'cfg(unix)'.dev-dependencies]
# The effective uid, read straight from the syscall so a suite can say why
# it can observe no record on a runner that is already root — a read the
# guard under test cannot answer for. Already in the workspace under core.
#
# `pty` is for the one thing a pipe cannot show: what a terminal is sent.
# The framed rendering's spinner draws through `indicatif`, which writes
# nothing at all unless stderr is a terminal, so its line is invisible to
# every other test here.
rustix = { workspace = true, features = ["pty"] }

[[test]]
name = "integration"
path = "tests/main.rs"

# The two targets workflows select by name: the macOS cargo leg of its own in
# .github/workflows/skill-tests.yml, and the round trip own-catalog.yml runs
# against the real CLIs.
[[test]]
name = "catalog_render_lint"
path = "tests/catalog_render_lint.rs"

[[test]]
name = "cli_smoke"
path = "tests/cli_smoke.rs"

[lints]
workspace = true
