schema = 6

[sources.kendex]
repo = "vanillagreencom/kendex"

[install]
harnesses = [
    "claude",
    "codex",
    "pi",
]
method = "symlink"

[bundles.workflow]
source = "kendex"
harnesses = [
    "claude",
    "codex",
    "pi",
]

[skill-instructions]
all = "Problems with a kendex-owned skill go through `kendex report`; check ownership in the file first."

[agent-additional-instructions]
all = "Problems with a kendex-owned skill go through `kendex report`; check ownership in the file first."

[bot-instructions]
schema = 1

[bot-instructions.repo]
name = "kendex-web"
summary = "kendex-web runs kendex.ai, the website and community API for kendex. A Next.js app on Vercel serves the pages and API routes, Neon Postgres holds the directory and accounts, and Vercel Blob stores indexed README content. A GitHub Actions indexer writes marketplace listings through an authenticated API."
tracker = "KEN"

[bot-instructions.bots]
# Setup evidence and remaining vendor checks: .bot-instructions/README.md.
codex = false
copilot = false
coderabbit = false
qodo = false
qodo_best_practices = false
qodo_review_md = false
macroscope = false

[bot-instructions.cadence]
coderabbit_incremental = true
coderabbit_drafts = false
qodo_commands = ["/agentic_review"]
qodo_push_trigger = false

[bot-instructions.tone]
coderabbit = "Terse and technical. Give the defect, its triggering input, and the consequence. No praise, diff restatement, or summary. One finding per thread."

[bot-instructions.exclusions]
derive_render = true

[[bot-instructions.exclusions.path]]
glob = "pnpm-lock.yaml"
reason = "pnpm writes the lockfile; a finding on it is a finding about the dependency change in package.json"

[[bot-instructions.exclusions.path]]
glob = ".github/workflows/review-gate-writer.yml"
reason = "verbatim copy of the review-gate template kendex ships; validate.sh holds it to equality, so a defect is fixed upstream"

[[bot-instructions.exclusions.path]]
glob = "src/components/ui/**"
reason = "shadcn registry output added unchanged by the shadcn CLI; a finding on it is a finding about the registry, and the next add overwrites a local edit"

[[bot-instructions.exclusions.path]]
glob = ".agents/skills/neon/**"
reason = "third-party skill hash-pinned by skills-lock.json from neondatabase/agent-skills; a local edit breaks the pin, so a finding goes upstream"

[[bot-instructions.exclusions.path]]
glob = ".agents/skills/neon-postgres/**"
reason = "third-party skill hash-pinned by skills-lock.json from neondatabase/agent-skills; a local edit breaks the pin, so a finding goes upstream"

[[bot-instructions.exclusions.path]]
glob = ".bot-instructions/coderabbit-schema.json"
reason = "CodeRabbit's published schema, retrieved verbatim for the bot-instructions renderer; the vendor owns its content"
