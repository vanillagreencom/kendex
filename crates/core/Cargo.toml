[package]
name = "kendex-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# The integration tests are one harness, tests/main.rs, and every other file
# under tests/ is a module of it: autodiscovery off, or cargo would still
# build each file as a test binary of its own, linking this crate and its
# dependencies once per file.
autotests = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
dirs.workspace = true
thiserror.workspace = true
specta.workspace = true
sha2.workspace = true
similar.workspace = true
yaml-rust2.workspace = true
fd-lock.workspace = true
unicode-normalization.workspace = true
tempfile.workspace = true
keyring.workspace = true
semver.workspace = true
minisign-verify.workspace = true
base64.workspace = true
pulldown-cmark.workspace = true
# The commit offer reads a git remote's host and strips its credentials
# before printing it. Already in the tree under tauri.
url = "2"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
fd-lock.workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# Swaps a process-global keyring builder, so it shares a process with no
# other test.
[[test]]
name = "credential_store_refusals"
path = "tests/credential_store_refusals.rs"

[lints]
workspace = true
