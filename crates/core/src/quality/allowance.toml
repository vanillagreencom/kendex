# Findings kendex accepts in its own packages, one row per finding, keyed
# on the text of the line the finding fired on. A row is added by hand and
# reviewed with the finding it accepts; `cargo test -p kendex-core --
# --ignored regenerate_allowance` refreshes the line hash and message of
# the rows already here and refuses a file whose findings no longer match
# its rows one per row (`AcceptedFile::refreshed` states when), and
# `crates/core/tests/allowance.rs` fails while the table is stale. Read by
# `crates/core/src/quality/allowance.rs`.

ruleset = 8

[[package]]
kind = "skill"
name = "orch"

[[package.file]]
path = "scripts/lib/lane-launch.sh"

[[package.file.finding]]
rule = "safety-bypass"
line-hash = "36f56839c770e9d1e4f567fba984079248fa0223b9ea72f0f94df0578e887e87"
message = "`--dangerously-skip-permissions` turns off permission prompts"

[[package]]
kind = "skill"
name = "harness-ci"

[[package.file]]
path = "references/wiring.md"

[[package.file.finding]]
rule = "rce"
line-hash = "b2646f7c3e1017f7ad14dc8102adeee12172a7183278d46b780eba666dae2458"
message = "this line pipes a download straight into a shell with `https://kendex.ai/install.sh`, so whatever the far end serves is what runs"

[[package]]
kind = "skill"
name = "review-gate"

[[package.file]]
path = "templates/review-gate-writer.yml"

[[package.file.finding]]
rule = "rce"
line-hash = "618f4343fe7c8f11804fe06194842baf1a8df814e3e8bddbe55faa277cace1ed"
message = "this line pipes a download straight into a shell from `https://raw.githubusercontent.com/$KENDEX_INSTALLER_REPO/$KE… c4e2972fc18a3f5a`, so whatever the far end serves is what runs"
