schema = 7

[install]
harnesses = ["claude", "pi"]
method = "copy"

[agents.generalist]
source = "cat"

[agents.engineer]
source = "cat"

[skills.review]
source = "cat"

[agent-skills]
generalist = ["review"]
engineer = ["review"]

[agent-additional-instructions]
generalist = "Consumer maintainer instructions."
engineer = "Consumer runtime instructions."

[agent-launch-instructions]
generalist = "Launch agent:engineer."
engineer = "Launch agent:generalist."

[agent-frontmatter.pi]
generalist = { allowed-subagents = ["engineer"] }
engineer = { allowed-subagents = ["generalist"] }

[skill-instructions]
review = "Use agent:generalist and agent:engineer. Keep agent:engineer-extra."

[[custom-hooks]]
name = "scalar"
event = "PreToolUse"
command = "./scalar.sh"
agents = "generalist"

[[custom-hooks]]
name = "list"
event = "PostToolUse"
command = "./list.sh"
agents = ["generalist", "reviewer", "all"]

[[custom-hooks]]
name = "role"
event = "Stop"
command = "./role.sh"
agents = "engineer"

[[custom-hooks]]
name = "role-list"
event = "SubagentStop"
command = "./role-list.sh"
agents = ["engineer"]

[[custom-hooks]]
name = "everyone"
event = "PreToolUse"
command = "./everyone.sh"
agents = "all"
