# Public kendex settings seeded from installed skill defaults.
# Skill scripts read this [env] table; process env and .env.local override it.
# Keep secrets, tokens, and personal overrides in .env.local.
# Linear credentials go in .env.local: skills/linear/README.md § Setup.

[env]

# The owner's order for this organization's repositories: Claude CLI, GPT through the Copilot seat, Codex CLI as fallback (Slack1793558900.347579,2026-11-01).
SECOND_OPINION_MODELS = "claude pi-copilot-gpt codex"

# A lane publishes a draft and runs internal review while CI is pending, the
# order for this repository's queue-only merges
# (docs/decisions/D027-merge-queue-proves-every-change.md).
ORCH_PR_ORDER = "push-first"

ORCH_OWNER_ASK_LABEL = "owner-gated"
# This checkout's Linear team. No default: with it unset, existing-issue
# writes route by the issue identifier and run with the cross-team guard
# inactive, other writes refuse, and reads drop the team filter
# (skills/linear/SKILL.md § Team Target). Confirm with
# `linear.sh auth-check --strict`.
LINEAR_TEAM = "kendex"

# Issue identifier prefix used in examples (e.g. PROJ-123).
LINEAR_TEAM_PREFIX = "KEN"

# Declared agent-routing label set (e.g. "agent:maintainer, agent:rust").
# Non-empty makes `issues create` refuse a create carrying none of them —
# such an issue is invisible to agent routing. Empty = guard off.
LINEAR_AGENT_LABELS = "agent:maintainer, agent:researcher, agent:multi, agent:human, agent:runtime, agent:rust, agent:iced, agent:frontend, agent:swift"

# Non-empty makes `issues create` hold the presence half of the creation bar
# in the project-management skill's SKILL.md, § Disposition → **Name what
# reaches it**; what the guard refuses: skills/linear/README.md § Setup.
# Empty = guard off.
LINEAR_REQUIRE_REACH = "1"

# Seconds of one review period before the on-timeout policy applies; a
# PR_REVIEW_WAIT_SECS= prefix on the call wins.
PR_REVIEW_WAIT_SECS = "900"

# When the review signal never arrives: "block" reports a timeout;
# "proceed" moves on only where no reviewer engaged and no thread is open
# (skills/orch/references/settings.md). Comment-only bots can go silent on a
# trivial head, so a silent round proceeds rather than stalling the session.
PR_REVIEW_ON_TIMEOUT = "proceed"

# Max automated ci-fix rounds per PR before a human takes over.
CI_FIX_MAX_CYCLES = "6"

# Max internal re-review cycles per issue before the verdict pass: "1" is one
# fix round and one re-review of it (skills/orch/references/settings.md).
REVIEW_MAX_CYCLES = "1"

# Max external review rounds on an open PR; at or past it the cap rule of
# skills/orch/workflows/review-pr-comments.md § 6.1 applies.
REVIEW_MAX_EXTERNAL_ROUNDS = "4"

# Total concurrent agent-session budget, counting the primary; "0" =
# unlimited. How reviews fit it:
# skills/orch/references/skill-rules.md § Reviewer persistence is budget-conditional.
# On the Codex runtime, set the cap `spawn-adapter slots` reports.
REVIEWER_SLOT_BUDGET = "0"

# Who the overseer is talking to: "ceo" or "engineer"; what each value
# means: skills/orch/references/communication-modes.md.
# values: ceo | engineer
ORCH_USER_MODE = "ceo"

# Post-PR choices: "auto-recommended" continues within each budget; "ask" prompts.
ORCH_DECISION_MODE = "auto-recommended"

# "ask" presents the merge decision; "auto" merges once every gate is green.
# values: auto | ask
ORCH_MERGE_AUTONOMY = "auto"

# Execute the audit's accepted creations and cancellations without a question.
PM_CREATE_AUTONOMY = "auto"

# Minutes between two overseer status reports.
ORCH_REPORT_EVERY_MINUTES = "120"

# Rebuild the installed CLI only when the synchronized range changes a build
# input, with the commit it was built from in its --version. tools/harness-smoke
# reads that commit, and its BUILD_INPUTS must name the same paths as this diff.
ORCH_POST_MERGE_CMD = "if git diff --quiet $ORCH_POST_MERGE_BEFORE $ORCH_POST_MERGE_AFTER -- crates/ Cargo.toml Cargo.lock rust-toolchain.toml .cargo; then exit 0; else rc=$?; [ $rc -eq 1 ] || exit $rc; fi; KENDEX_SOURCE_COMMIT=$(git rev-parse HEAD) cargo build --release -p kendex-cli && cp -f target/release/kendex ~/.cargo/bin/kendex"

# Seconds the runtime's launch waits for a harness to come up in its window
# before it records the launch unconfirmed; its other confirmation reads share
# the bound.
AGENT_RUNTIME_TMUX_VERIFY_SECS = "15"

# Long provider processes lane-host runs at once, per home: every overseer and
# checkout on the machine shares the count.
ORCH_LANE_HOST_MAX_CALLS = "4"

# Short provider calls have their own per-home cap, so a held create cannot
# stop mailbox reads. Verb placement is in orch's schemas/lane-host.md.
ORCH_LANE_HOST_SHORT_MAX_CALLS = "4"

# Seconds a short provider call at the ORCH_LANE_HOST_SHORT_MAX_CALLS cap
# waits for a slot before it refuses as lane-host-busy with exit 69.
ORCH_LANE_HOST_SHORT_BUSY_WAIT_SECS = "30"

# The kendex owner program spends a live Claude API grant first, as a Pi lane on anthropic/; a grant past its end reads walled, so the walk then takes Claude cloud, with Codex on its own accounts as fallback.
ORCH_LANE_PREFERENCE = "pi:anthropic/claude-opus-5-5:high,claude@claude-cloud:claude-opus-5-5:high,codex:gpt-6.1-sol:high"

# Accounts a cloud-session pick may hand a kendex lane: each entry states the
# repository the account was given access to, and the pick refuses any other
# account as cloud-repo-unset. The saved setup line is fail-open: it ends with
# `|| echo kendex-install-failed`, so a cloud session can start without
# kendex on PATH.
ORCH_LANE_CLOUD_REPOS = "2claude=vanillagreencom/kendex,3claude=vanillagreencom/kendex,4claude=vanillagreencom/kendex,10claude=vanillagreencom/kendex,1claude=vanillagreencom/kendex,7claude=vanillagreencom/kendex,claude=vanillagreencom/kendex"

# Seconds a lane-host call at the ORCH_LANE_HOST_MAX_CALLS cap waits for a
# slot before it refuses as lane-host-busy with exit 69.
ORCH_LANE_HOST_BUSY_WAIT_SECS = "30"

# Maximum Kendex lanes held by this overseer.
ORCH_OVERSEER_LANES = "20"

# Repositories this overseer may launch lanes in beside kendex, blank-separated
# OWNER/REPO; the launch's refusal of a checkout of any other:
# skills/orch/references/lane-directive.md § Launch gate.
ORCH_CONNECTED_REPOS = "vanillagreencom/kendex-web"

# The turn-end hook uses this pgrep -f pattern to find the session's wake process.
ORCH_WAKE_PROCESS = ""

# The turn-end hook prints this command to start the session's missing wake process.
ORCH_WAKE_START = ""

# The account folders the account reading lists, each relative to the home folder.
AGENT_RUNTIME_ACCOUNT_DIRS = ".claude:.1claude:.2claude:.3claude:.4claude:.5claude:.6claude:.codex:.3codex:.1copilot"

# The orch account judge refuses an account at or above 95 percent used on the
# window that binds the lane: with --native-model the fullest of the plan
# windows and that model's own window, else the account's binding bucket.
AGENT_RUNTIME_ACCOUNT_MAX_PCT = "95"

AGENT_RUNTIME_CODEX_CREDIT_FLOOR = "0"

# The overseer moves before its account walls when its current binding bucket
# reaches 5 percent headroom or its projected wall is within 20 minutes. A
# seat account (one an overseer or Jarvis session runs on) keeps this headroom
# for its session; skills/orch/references/settings.md states how a worker's
# pick and the lanes on it keep it.
AGENT_RUNTIME_CONTROLLER_HEADROOM_PCT = "5"
ORCH_OVERSEER_WALL_MINUTES = "20"

# A lane whose account reaches 97 percent used is marked for handoff, which
# follows skills/orch/references/skill-rules.md § Round Closure.
ORCH_HANDOFF_HEADROOM_PCT = "3"

# The watch relaunches a lane its account walled where it can; when it does,
# and what it reports:
# skills/orch/references/oversee-events.md § Event kinds, lane-relaunched and usage-limit.
ORCH_WALL_RELAUNCH = "auto"

# Lane pane output. "quiet" prints one line per completed step and writes
# each <output_format> block the lane fills itself to a file instead;
# "normal" prints every block as written; any other value refuses the launch
# as setting-invalid. Why
# no lane narrates, each destination and what the mode never touches:
# skills/orch/references/skill-rules.md, Lane Output.
ORCH_LANE_OUTPUT = "quiet"

# Disk use, in percent of the volume holding a lane worktree's target/, at or
# past which the prune-round request removes that worktree's Cargo output at a
# round's start. Below the mark on a 30 GB sandbox more than 7.5 GB is free, above
# GUARD_MIN_FREE_GB, so a round the prune skips still passes tools/guard's
# start floor and validates warm; one full run writes about 3.0 GiB.
ORCH_ROUND_PRUNE_DISK_PCT = "75"

# Kendex's roster is declared above. The two Copilot entries retain the
# package command, model, room check and inline diff. The keys below are
# kendex's differences:
# the claude and codex entries pin their model and run on a fleet seat with
# room. The checks assume the orch fleet's accounts, which agent-runtime's
# account judge measures with the lanes orch runs on each counted; a
# contributor off the fleet overrides them in .env.local. The judge reads this
# machine's own login, the one the reviewer runs on, never a lane-host
# provider's copy.

# Opinions a review collects; 2+ unions distinct models on one diff.
SECOND_OPINION_COUNT = "1"

# Claude pinned to Opus 5.5, where the package default takes the standard tier.
SECOND_OPINION_CLAUDE_CMD = "claude -p --output-format json --no-session-persistence --model claude-opus-5-5 --effort high --restricted --permission-mode dontAsk --tools Bash,Read,Glob,Grep --allowedTools Bash(read-only:true),Read,Glob,Grep --setting-sources="
# A Claude review runs on the seat the account judge finds room on; a walled seat is skipped.
SECOND_OPINION_CLAUDE_ROOM_CMD = ".agents/skills/agent-runtime/scripts/agent-runtime accounts pick --env --harness claude --native-model claude-opus-5-5"

# Codex pinned to GPT-6.1 Sol, where the package default takes Codex's own.
SECOND_OPINION_CODEX_CMD = "codex exec -m gpt-6.1-sol -s read-only -c model_reasoning_effort=xhigh --disable hooks --ephemeral"

# A Codex review runs on the seat the account judge finds room on, as a codex
# lane would.
SECOND_OPINION_CODEX_ROOM_CMD = ".agents/skills/agent-runtime/scripts/agent-runtime accounts pick --env --harness codex --native-model gpt-6.1-sol --binding-floor"

# Seconds to wait for the external CLI.
SECOND_OPINION_TIMEOUT = "1080"

# Home for review/audit records written without --output; what the script
# writes into a directory it creates: `second-opinion --help`.
SECOND_OPINION_ARTIFACT_DIR = "tmp/second-opinion"

# Repo instruction files appended to the review prompt (repo-rule lens).
# Empty disables.
SECOND_OPINION_REVIEW_INSTRUCTIONS = "AGENTS.md .github/instructions/code-review.md .github/instructions/*.instructions.md .github/copilot-instructions.md"

# The contexts kendex's own required-checks ruleset requires once "Review
# gate" leaves it: the CI jobs the ruleset lists, by name.
REVIEW_GATE_STANDARD_CONTEXTS = "CI"

# This repository uses remote review and keeps the full review output.
GITHUB_STANDARD_BOT_REVIEW = "on"

# The organization's standard admits no bypass actor on either ruleset
# (docs/decisions/D029-owner-merges-ci-input-repair.md), so the
# standard-bypass-actors row reports any bypass, the repository owner's
# temporary one-head repair bypass included.
REVIEW_GATE_STANDARD_QUEUE_BYPASS = ""
REVIEW_GATE_STANDARD_CHECKS_BYPASS = ""

# This repository sets no HARNESS_CI_PER_PUSH_REASON, so every change is
# queue-only (docs/decisions/D027-merge-queue-proves-every-change.md); what a
# reason would change: skills/harness-ci/README.md.

# Product content a user reads or accepts: the authoring reference the app
# compiles in, and the Terms and Privacy Policy the first-run accept step
# records. An edit to one answers standard at any size, never a narrow class.
HARNESS_CI_STANDARD_PATHS = "docs/authoring/README.md docs/legal/*"

# ── Skill settings ───────────────────────────────────────────────────────
# What the installed skills read for repo-specific names, paths and commands.

# Commit identity for agent-authored work. Empty uses the ambient git identity.
BOT_EMAIL = ""
BOT_NAME = ""
BOT_REMOTE_NAME = ""

# Where the decider skill keeps architecture decision records.
DECISIONS_DIR = "docs/decisions"

# Local rounds validate the branch range. CI holds the full validation
# record, and the merge waits on the merge-group run.
DEV_VALIDATE_CMD = "base=$(.agents/skills/orch/scripts/resolve-base-branch .) && base=$(git merge-base HEAD origin/$base) && tools/guard --range $base"

# A full run with CARGO_INCREMENTAL=0 writes one artifact set. Measured from a
# clean target/ at rustc 1.96.1, its test, clippy and doc invocations wrote
# 2.7 GiB and the two cross-target checks 0.3 GiB; the floor is twice that.
# A target/ past one artifact set holds incremental caches and superseded
# artifacts, which the round-start prune at ORCH_ROUND_PRUNE_DISK_PCT bounds.
GUARD_MIN_FREE_GB = "6"

# The free space a full run needs at its start and has left at its end, for the
# validation log, sentinel, and shell operations.
GUARD_EXHAUSTED_FREE_MB = "512"

# A review-fix round validates its own changes: the default rules, cargo
# clippy for the crates they touch, the UI checks, and the suites of the
# trees they touch, and none of what --full adds beyond that: the workspace
# test run, cross-target checks, the documentation build, the Bash 3.2 parse,
# the working-tree bot-instructions check, the decision-ID check, the
# free-space floor above and the class lane selection.
# A restack also runs it, as skills/orch/workflows/merge-pr-restack.md sets out.
# CI runs the selected lanes and the decision-ID check, and the merge waits
# on the merge-group run.
DEV_VALIDATE_RANGE_CMD = "tools/guard --range $DEV_VALIDATE_BASE"

# Preview the same suite selection before launching validation; how a run
# uses it: `.agents/skills/orch/scripts/dev-validate-run --help`. CI holds the
# full record.
DEV_VALIDATE_SELECTION_CMD = "base=${DEV_VALIDATE_BASE:-}; if test x$base = x; then branch=$(.agents/skills/orch/scripts/resolve-base-branch .) && base=$(git merge-base HEAD origin/$branch) || exit; fi; tools/guard --selection --range $base"

# The required CI context runs the tools/guard lanes through tools/ci-job-set.
# Every kendex change is queue-only
# (docs/decisions/D027-merge-queue-proves-every-change.md), so a round that
# leaves its validation to this check records the merge-group run as its
# proof.
DEV_VALIDATE_CI_CONTEXT = "CI"

# Whether a red merge group's failed checks are ones the change's own paths
# select, as the queue wait reads them on an ejection: tools/ci-reach maps
# each check to the tools/ci-job-set lane or shard that runs it.
QUEUE_WAIT_REACH_CMD = "tools/ci-reach"

# The prefix tools/guard prints each finding with; a run whose log holds no
# line with it is finding-free, and what that run may supply:
# skills/orch/references/artifact-checks.md.
DEV_VALIDATE_FINDING_PREFIX = "guard: "

# The bound on either run, in whole seconds; what happens past it, and the
# wait derived from it: `.agents/skills/orch/scripts/dev-validate-run --help`.
DEV_VALIDATE_TIMEOUT_SECS = "3600"

# Whether `tools/guard --full` runs the macOS and Windows cross-target checks
# and cargo doc: "run" runs them unless the branch provably touched no crate,
# no workspace compiler input and no file compiled code includes; "ci" leaves
# them to CI, whose cargo_lint, cargo_macos and cargo_windows_check lanes
# tools/ci-job-set selects. A lane short on disk or time sets
# GUARD_FULL_CROSS_DOC=ci in .env.local or its environment.
GUARD_FULL_CROSS_DOC = "run"

# The repo-root executable the commit-guards pre-commit chain runs last
# (skills/commit-guards/SKILL.md). tools/guard holds this repository's own
# scans and compile checks for changed crates or UI files.
COMMIT_GUARDS_PRE_COMMIT_LOCAL = "tools/guard"

# The paths tools/guard reads when the chain runs it, so the chain runs it only
# for a commit that touches one: the trees its scans read (skills, hooks,
# agents, pi-extensions, refresh, crates, ui, packaging), the command-safety
# document, the render roots and the manifests its render rule reads, the
# workspace Rust inputs tools/rust-reads lists, and tools/ itself. A commit
# touching none of them, such as settings, changelog fragments or other
# Markdown, keeps the other lanes and skips tools/guard. A tools/guard rule
# over a path outside this list adds the path here in the same change.
COMMIT_GUARDS_PRE_COMMIT_LOCAL_PATHS = "tools/* crates/* ui/* skills/* hooks/* agents/* pi-extensions/* refresh/* packaging/* .agents/* .claude/* .codex/* .pi/* docs/authoring/command-safety.md kendex.toml kendex-local.toml Cargo.toml Cargo.lock rust-toolchain rust-toolchain.toml .cargo .cargo/* clippy.toml .clippy.toml rustfmt.toml .rustfmt.toml"

# The fragment scope of the changelog-entries lane. The two-segment glob
# keeps changelog.d/README.md out: its bullets document the format and are
# not entries. Which content writes a fragment: AGENTS.md § Conventions; the
# record the fragments collate into: skills/commit-guards/SKILL.md.
COMMIT_GUARDS_CHANGELOG_PATHS = "changelog.d/*/*.md"

# The app version equals the workspace version (crates/cli/tests/compat.rs).
# Package manifests keep their own adjacent release records.
COMMIT_GUARDS_CHANGELOG_VERSION_PATHS = "crates/app/tauri.conf.json pi-extensions/*/package.json"

# Disable catalog package fragments. Independent Pi package versions keep
# their own checks through COMMIT_GUARDS_CHANGELOG_VERSION_PATHS above.
COMMIT_GUARDS_CHANGELOG_PACKAGE_PATHS = ""

# Paths whose change obliges a changelog entry, checked by the commit-msg
# lane: crates/ and ui/ are what a consumer sees. The escape for a change no
# consumer notices: AGENTS.md § Conventions.
COMMIT_GUARDS_CHANGELOG_REQUIRED_PATHS = "crates/* ui/*"

# md-refs checks every configured document at every push, even one whose
# range carries no change; under "touched" it checks them only when the
# commit or range changes something. md-type reads the changed files under
# either value.
COMMIT_GUARDS_MD_SCOPE = "all"

# Catalog scripts include extensionless files; judge their citations here.
COMMIT_GUARDS_MD_REFS_SOURCE_PATHS = "*"

GH_BOT_USERNAME = ""
GH_VERIFY_CMD = ""

# Branch names match Linear issue identifiers case-insensitively. GitHub
# issues are deliberately absent because a PR's Closes line identifies them.
GH_ISSUE_PATTERN = "ken-[0-9]+"

LINEAR_FORMAT = "safe"
ORCH_STATE_DIR = "tmp"

# ── Worktrees ────────────────────────────────────────────────────────────
# What a fresh issue worktree gets from this checkout: only paths git does
# not carry, by the rule of skills/worktree/README.md § Setup. The harness
# trees (.agents, .claude, .codex, .pi) are committed whole, so a worktree
# gets them from its
# own branch. A render installed in the main checkout and left uncommitted is
# deliberately not linked in: a worktree's harness matches its branch, and
# commit the render to hand it to every worktree. A single tracked FILE is
# the opposite hazard — it becomes a link git cannot write through, so
# .claude/settings.json is absent here and each worktree carries git's own copy.
#
# .opencode is absent for a different reason: kendex-local.toml's [install]
# harnesses names claude, codex and pi, not opencode, so nothing renders
# there. The tree holds no files, and an entry would link an empty directory.
#
# Nothing is copied: the install record (.kendex-lock.json) is committed and
# arrives with the branch, and this machine's half of it sits under .cache,
# which is linked below.
WORKTREE_BASE_DIR = "~/dev/.worktrees/kendex"
WORKTREE_DEFAULT_BRANCH = "main"
WORKTREE_MKDIRS = "tmp"
# ui/node_modules: tools/guard's UI lanes run ui/package.json's scripts, and
# this store is what supplies their binaries at the pinned versions. `npm run`
# puts it at the front of PATH but falls through to the ambient one, so a
# worktree without the store reds guard on its first commit wherever tsc,
# biome and vitest are not installed globally — the normal case, not a
# guarantee the code makes. The link shares the main checkout's real install
# (npm — ui/package-lock.json), so a ui/ dependency change follows
# AGENTS.md § Commands: an install in a linked worktree would write through
# the link.
# .gitignore's bare `node_modules` pattern covers the symlink.
WORKTREE_SYMLINKS = ".env.local .cache ui/node_modules"

# AGENTS.md instruction files are tracked and arrive through git.
# A relative symlink here would shadow tracked content.
WORKTREE_RELATIVE_SYMLINKS = ""

# Seconds a 1Password token resolution may take.
KENDEX_GITHUB_OP_TIMEOUT = "10"

# Seconds the `gh` auth preflight may take.
KENDEX_GITHUB_AUTH_TIMEOUT = "10"

# Seconds a single `pr-view` read may take.
KENDEX_GITHUB_PR_VIEW_TIMEOUT = "30"

# Path to the worktree CLI the orch runtime drives. Empty resolves the
# installed worktree skill's `scripts/worktree`.
WORKTREE_CLI = ""

# A file a Jarvis session touches while it answers the overseer; the hold it
# sets and its resume: skills/slack/README.md § The Jarvis session hold.
# Empty: no hold.
SLACK_JARVIS_SESSION_FILE = "~/.fleet/master-live"
SLACK_JARVIS_SESSION_MAX_AGE = "1800"
