# Public kendex settings seeded from installed skill defaults.
# Skill scripts read this [env] table; process env and .env.local override it.
# Keep secrets, tokens, and personal overrides in .env.local.
# Linear credentials: LINEAR_CLIENT_ID and LINEAR_CLIENT_SECRET in .env.local
# select the application with the fixed scope read,write,issues:create,
# comments:create,timeSchedule:write,initiative:read,initiative:write,
# customer:read,customer:write.
# LINEAR_API_KEY is the fallback for key-only installs. A token minted from the
# pair is kept until it expires in a private per-user file outside the checkout.

[env]
# The team every Linear write targets. No default: an empty value refuses
# writes instead of guessing inside whatever workspace the API key reaches
# (the create actions still take `--team <name>` per call). Confirm with
# `linear.sh auth-check --strict`.
LINEAR_TEAM = "kendex"

# Issue identifier prefix used in examples (e.g. PROJ-123).
LINEAR_TEAM_PREFIX = "KEN"

# Declared agent-routing label set (e.g. "agent:maintainer, agent:rust").
# Non-empty makes `issues create` refuse a create carrying none of them —
# such an issue is invisible to agent routing. Empty = guard off.
LINEAR_AGENT_LABELS = "agent:maintainer, agent:researcher, agent:multi, agent:human, agent:runtime, agent:rust, agent:iced, agent:frontend, agent:swift"

# Non-empty makes `issues create` hold the presence half of the creation bar
# in the project-management skill's SKILL.md, § Disposition → **Name what
# reaches it**: it refuses a body with no `Reached by:` line, and a
# `--review-born --priority 2` body with no `Symptom:` line. What those lines
# say is the author's to judge. Creation is the chokepoint, since
# `Tracked: <ID>` needs only an issue to exist. Empty = guard off.
LINEAR_REQUIRE_REACH = "1"

# Total review-wait budget in seconds before the on-timeout policy applies;
# an explicit max_wait argument always wins.
PR_REVIEW_WAIT_SECS = "900"

# When the review signal never arrives: "block" reports a timeout;
# "proceed" records a reviewer-down override and moves on, but only with
# zero unresolved threads — a real comment is never bypassed. Comment-only
# bots can go silent on a trivial head, so a silent round proceeds rather
# than stalling the session.
PR_REVIEW_ON_TIMEOUT = "proceed"

# Seconds ci-wait keeps polling before failing when no CI checks registered
# yet, four polls at its 180 s default interval; raise for approval-gated CI
# with slow dispatch.
CI_WAIT_NO_CHECKS_GRACE = "600"

# Max automated ci-fix rounds per PR before a human takes over.
CI_FIX_MAX_CYCLES = "6"

# Max internal re-review cycles per issue before the verdict pass; the
# re-review re-entry raises rereview_cycles and refuses at this, so the number
# set is the number of re-entries allowed: one fix round, one re-review of it.
REVIEW_MAX_CYCLES = "1"

# Max external review rounds on an open PR. At or past it a finding gets a
# disposition and no fix push, except a defect the diff introduces or arms.
REVIEW_MAX_EXTERNAL_ROUNDS = "4"

# Total concurrent agent-session budget, counting the primary; "0" =
# unlimited. Reviews run in waves when the reviewer set exceeds free slots.
# On the Codex runtime, set the cap `spawn-adapter slots` reports.
REVIEWER_SLOT_BUDGET = "0"

# Who the overseer is talking to. "ceo" asks only about outcomes and decides
# the rest itself; "engineer" keeps the package's original wording.
# values: ceo | engineer
ORCH_USER_MODE = "ceo"

# Post-PR choices: "auto-recommended" continues within each budget; "ask" prompts.
ORCH_DECISION_MODE = "auto-recommended"

# "ask" presents the merge decision; "auto" merges once every gate is green.
# MERGE_READY = false never auto-merges.
# values: auto | ask
ORCH_MERGE_AUTONOMY = "auto"

# Execute the audit's accepted creations and cancellations without a question.
PM_CREATE_AUTONOMY = "auto"

# Rebuild the installed CLI only when the synchronized range changes a build
# input, with the commit it was built from in its --version. tools/harness-smoke
# reads that commit, and its BUILD_INPUTS must name the same paths as this diff.
ORCH_POST_MERGE_CMD = "if git diff --quiet $ORCH_POST_MERGE_BEFORE $ORCH_POST_MERGE_AFTER -- crates/ Cargo.toml Cargo.lock rust-toolchain.toml .cargo; then exit 0; else rc=$?; [ $rc -eq 1 ] || exit $rc; fi; KENDEX_SOURCE_COMMIT=$(git rev-parse HEAD) cargo build --release -p kendex-cli && cp -f target/release/kendex ~/.cargo/bin/kendex"

# Seconds per brief-delivery verification pass on tmux handoff lanes.
ORCH_TMUX_VERIFY_SECS = "15"

# Seconds a hosted lane waits for its remote shell prompt after the ssh line is
# typed, and a claude-cloud launch for its session URL. Its own bound, not the
# one above: it measures a route coming up and another machine's login, or a
# cloud machine provisioned. A bound spent with ssh still on the pane interrupts
# that client and waits the bound again for the pane's own shell; the ssh line
# is typed again only once that shell is back, because the pane has to be out
# of ssh before a line pasted into it is run rather than typed into the stalled
# session. The refusal counts the ssh lines typed in its attempts field.
ORCH_LANE_SSH_PROMPT_SECS = "60"

# Long provider processes lane-host runs at once, per home: every overseer and
# checkout on the machine shares the count.
ORCH_LANE_HOST_MAX_CALLS = "4"

# Short provider calls have their own per-home cap, so a held create cannot
# stop mailbox reads. Verb placement is in orch's schemas/lane-host.md.
ORCH_LANE_HOST_SHORT_MAX_CALLS = "4"

# Seconds a short provider call at the ORCH_LANE_HOST_SHORT_MAX_CALLS cap
# waits for a slot before it refuses as lane-host-busy with exit 69.
ORCH_LANE_HOST_SHORT_BUSY_WAIT_SECS = "30"

# The kendex owner program uses the Copilot pool before the native Codex harness.
ORCH_LANE_PREFERENCE = "pi:github-copilot/gpt-6.1-sol:high,codex:gpt-6.1-sol:high"

# Accounts a cloud-session pick may hand a kendex lane. An entry records both
# one-time claude.ai setups of that account on kendex, the cloud environment's
# setup script and repository access; `lanes --help` § pick states what an
# entry attests. The saved setup line is fail-open: it ends with
# `|| echo kendex-install-failed`, so a cloud session can start without
# kendex on PATH.
ORCH_LANE_CLOUD_REPOS = "2claude=vanillagreencom/kendex,3claude=vanillagreencom/kendex,4claude=vanillagreencom/kendex"

# Seconds a lane-host call at the ORCH_LANE_HOST_MAX_CALLS cap waits for a
# slot before it refuses as lane-host-busy with exit 69.
ORCH_LANE_HOST_BUSY_WAIT_SECS = "30"

# Max concurrent lanes the overseer keeps in flight. open-terminal refuses a
# fleet launch past it. A kendex lane is a 4 vCPU / 8 GiB Daytona sandbox, so 20
# take 80 vCPU / 160 GiB of the shared 500 vCPU / 1000 GiB pool; a launch
# Daytona refuses waits for a lane to close or park (fleet D070).
ORCH_OVERSEER_LANES = "20"

# Repositories this overseer may launch lanes in beside kendex, blank-separated
# OWNER/REPO; open-terminal refuses a fleet launch from any other.
ORCH_CONNECTED_REPOS = "vanillagreencom/review-gate-sandbox vanillagreencom/kendex-web"

# The turn-end hook uses this pgrep -f pattern to find the session's wake process.
ORCH_WAKE_PROCESS = ""

# The turn-end hook prints this command to start the session's missing wake process.
ORCH_WAKE_START = ""

# `lanes pick` refuses an account at or above 95 percent used on the window it
# judges, the binding bucket or with --model that model's window.
ORCH_LANE_MAX_PCT = "95"

# The overseer moves before its account walls when its current binding bucket
# reaches 5 percent headroom, its projected wall is within 20 minutes, or the
# qualifying-account trigger fires by the rule oversee-succeed --help states.
ORCH_OVERSEER_HEADROOM_PCT = "5"
ORCH_OVERSEER_WALL_MINUTES = "20"
ORCH_OVERSEER_SUCCESSOR_ACCOUNTS = "1"

# A lane whose account reaches 97 percent used is marked, and the overseer asks
# it for a handoff at the next safe point.
ORCH_HANDOFF_HEADROOM_PCT = "3"

# Lane pane output. No person reads a lane's pane: the overseer learns a lane's
# state from lane-mail, the lane status file and what the watch reads off the
# pane, so narration, recaps and closing summaries are output tokens nobody
# spends.
# "quiet" prints one line per completed step and writes each <output_format>
# block the lane fills itself to a file instead: the artifact that step owns,
# or one of its own under the worktree tmp/. "normal" prints every block as
# written and any other value is quiet. Harness output is never suppressed, so
# the watch's marker reads are unchanged. The destinations in full, and what
# the mode never touches: skills/orch/references/skill-rules.md, Lane Output.
ORCH_LANE_OUTPUT = "quiet"

# Disk use, in percent of the volume holding a lane worktree's target/, at or
# past which round-prune removes that worktree's Cargo output before a dev
# round. Below the mark on a 30 GB sandbox more than 7.5 GB is free, above
# GUARD_MIN_FREE_GB, so a round the prune skips still passes tools/guard's
# start floor and validates warm; one full run writes about 3.0 GiB.
ORCH_ROUND_PRUNE_DISK_PCT = "75"

# Priority-ordered roster, space/comma separated. Per entry:
# SECOND_OPINION_<NAME>_CMD (claude and codex have defaults),
# SECOND_OPINION_<NAME>_MODEL (identity, when the CLI fronts another model)
# and SECOND_OPINION_<NAME>_ROOM_CMD (the check that its account has room).
# pi-copilot runs Claude Opus on Copilot first, then the native claude and
# codex entries. Room checks and execution failures use that order. The checks
# assume the orch fleet's accounts, which lanes pick measures; a contributor
# off the fleet overrides SECOND_OPINION_MODELS in .env.local. Each check runs
# under ORCH_LANE_HOST=local: the reviewer runs on this machine's login, and a
# lane-host provider's reading of an account would judge a copy it never spends.
SECOND_OPINION_MODELS = "pi-copilot claude codex"

# Opinions a review collects; 2+ unions distinct models on one diff.
SECOND_OPINION_COUNT = "1"

# Roster commands (identities claude / codex).
SECOND_OPINION_CLAUDE_CMD = "claude -p --output-format json --no-session-persistence --model claude-opus-5-5 --effort high --restricted --permission-mode dontAsk --tools Bash,Read,Glob,Grep --allowedTools Bash(read-only:true),Read,Glob,Grep --setting-sources="
SECOND_OPINION_CLAUDE_ROOM_CMD = "env ORCH_LANE_HOST=local .agents/skills/orch/scripts/lanes pick --harness claude --model claude-opus-5-5"

SECOND_OPINION_CODEX_CMD = "codex exec -m gpt-6.1-sol -s read-only -c model_reasoning_effort=xhigh --disable hooks --ephemeral"

# A Codex review runs on the seat lanes pick finds room on, as a codex lane
# would; a walled seat is skipped.
SECOND_OPINION_CODEX_ROOM_CMD = "env ORCH_LANE_HOST=local .agents/skills/orch/scripts/lanes pick --harness codex --model gpt-6.1-sol --binding-floor"

# Claude Opus on the Copilot pool, read-only tools only, on the Pi account
# ORCH_LANE_COPILOT_POOL states room for; unstated, it is skipped. That
# reading comes from the settings in the lane's own tree: a hosted lane states
# it in .env.local until its provider forwards it, and one without it records
# the check's refusal. With no shell, it is sent the diff inline.
SECOND_OPINION_PI_COPILOT_CMD = "pi -p --no-session --no-extensions --model github-copilot/claude-opus-5.5 --thinking high --tools read,grep,find,ls"
SECOND_OPINION_PI_COPILOT_MODEL = "github-copilot/claude-opus-5.5"
SECOND_OPINION_PI_COPILOT_ROOM_CMD = "env ORCH_LANE_HOST=local .agents/skills/orch/scripts/lanes pick --harness pi --model github-copilot/claude-opus-5.5"
SECOND_OPINION_PI_COPILOT_INLINE_DIFF = "1"

# Seconds to wait for the external CLI.
SECOND_OPINION_TIMEOUT = "1080"

# Home for review/audit records written without --output; a directory the
# script CREATES is seeded with a "*" .gitignore (a pre-existing one is
# left alone — ignore it yourself).
SECOND_OPINION_ARTIFACT_DIR = "tmp/second-opinion"

# Repo instruction files appended to the review prompt (repo-rule lens).
# Empty disables.
SECOND_OPINION_REVIEW_INSTRUCTIONS = "AGENTS.md .github/instructions/code-review.md .github/instructions/*.instructions.md .github/copilot-instructions.md"

# This organization's standard, which validate-standard.sh checks and
# provision-environment.sh provisions: the lanes app, and the environment
# that holds its two secrets in every repository
# (docs/decisions/D003-one-merge-path.md).
REVIEW_GATE_STANDARD_APP = "vanillagreen-fleet-lanes"
REVIEW_GATE_STANDARD_ENVIRONMENT = "kendex"
REVIEW_GATE_STANDARD_SECRETS = "FLEET_GH_APP_ID;FLEET_GH_APP_PRIVATE_KEY"
# The contexts kendex's own required-checks ruleset requires once "Review
# gate" leaves it: the CI jobs the ruleset lists, by name.
REVIEW_GATE_STANDARD_CONTEXTS = "CI"

# The bypass actors this organization's standard admits, as TYPE:ID:MODE
# (docs/decisions/D013-admin-merge-green-prs.md, and the overseer app of
# the KEN-2067 design note § Copilot-down fallback, attached to that issue): on the merge
# queue ruleset the lanes app, always, and the overseer app in pull-request
# mode; on the required checks ruleset the overseer app alone.
REVIEW_GATE_STANDARD_QUEUE_BYPASS = "Integration:4925608:always;Integration:5115517:pull_request"
REVIEW_GATE_STANDARD_CHECKS_BYPASS = "Integration:5115517:pull_request"

# This repository's own queue-only paths beyond the list harness-ci ships
# (orch's references/narrow-change.conf, which already names this catalog's
# CI inputs). Set empty: the shipped list is the whole list here. Unset, the
# change classifier reads every pull request as queue-only, so pr-merge never
# takes the admin route.
HARNESS_CI_QUEUE_PATHS = ""

# The job selection whose merge-group macOS shards also make a change
# queue-only: a change for which tools/ci-job-set's queue_macos_shards names
# a shard merges through the queue, which runs those shards, never the admin
# route, which skips them (docs/decisions/D013-admin-merge-green-prs.md).
HARNESS_CI_QUEUE_SELECTOR = "tools/ci-job-set queue_macos_shards"

# ── Skill settings ───────────────────────────────────────────────────────
# What the installed skills read for repo-specific names, paths and commands.

# Commit identity for agent-authored work. Empty uses the ambient git identity.
BOT_EMAIL = ""
BOT_NAME = ""
BOT_REMOTE_NAME = ""

# Where the decider skill keeps architecture decision records.
DECISIONS_DIR = "docs/decisions"

# Full validation runs at development completion. Submit reuses that result
# for the same commit; CI runs the suites tools/ci-job-set selects
# independently. dev-validate-run
# hands over the change class, and tools/guard --full runs the lanes
# tools/ci-job-set selects for it.
DEV_VALIDATE_CMD = "tools/guard --full"

# A full run with CARGO_INCREMENTAL=0 writes one artifact set. Measured from a
# clean target/ at rustc 1.96.1, its test, clippy and doc invocations wrote
# 2.7 GiB and the two cross-target checks 0.3 GiB; the floor is twice that.
# The recorded 20 GB target/ was incremental caches and superseded artifacts,
# which the round-start prune at ORCH_ROUND_PRUNE_DISK_PCT bounds.
GUARD_MIN_FREE_GB = "6"

# The free space a full run needs at its start and has left at its end, for the
# validation log, sentinel, and shell operations. This floor stays far above
# the recorded 708 KiB case.
GUARD_EXHAUSTED_FREE_MB = "512"

# A review-fix round validates its own changes: the default rules, cargo
# clippy for the crates they touch, the UI checks, and the suites of the
# trees they touch, and none of what --full adds beyond that: the workspace
# test run, cross-target checks, the documentation build, the Bash 3.2 parse,
# the working-tree bot-instructions check, the decision-ID check, the
# free-space floor above and the class lane selection.
# A restack also runs it, as skills/orch/workflows/merge-pr-restack.md sets out.
# Submit reuses full validation or its CI receipt. CI runs the selected
# lanes and the decision-ID check on both pull requests and merge groups.
DEV_VALIDATE_RANGE_CMD = "tools/guard --range $DEV_VALIDATE_BASE"

# Preview the same suite selection before launching validation. An all-suite
# pre-open run uses this command's scoped route; PR CI holds the full record.
DEV_VALIDATE_SELECTION_CMD = "tools/guard --selection"

# The required CI context runs the tools/guard lanes through tools/ci-job-set,
# so a review-comment fix round on an open pull request leaves its validation
# to that check.
DEV_VALIDATE_CI_CONTEXT = "CI"

# The prefix tools/guard prints each finding with. A run the bound ended whose
# log holds no line starting with it refuted nothing, so dev-validate-run lets
# it answer a later run over no fewer paths and --last-pass passes over it.
DEV_VALIDATE_FINDING_PREFIX = "guard: "

# The bound on either run, in whole seconds. `tools/guard --full` takes well
# under an hour on the supported hosts; past this the run is signalled, killed
# outright ten seconds later, and the round records a failed validation. The
# dev agent's wait is derived from it.
DEV_VALIDATE_TIMEOUT_SECS = "3600"

# Whether `tools/guard --full` runs the macOS and Windows cross-target checks
# and cargo doc: "run" runs them unless the branch provably touched no crate,
# no workspace compiler input and no file compiled code includes; "ci" leaves
# them to CI, whose cargo_lint, cargo_macos and cargo_windows_check lanes
# tools/ci-job-set selects. A lane short on disk or time sets
# GUARD_FULL_CROSS_DOC=ci in .env.local or its environment.
GUARD_FULL_CROSS_DOC = "run"

# The repo-root executable the guard chain runs last, after doc-limits, preflight,
# the bot-instructions check and the commit-guards batch. tools/guard holds this repository's
# own scans and compile checks for changed crates or UI files. Expensive
# tests, documentation builds and cross-target checks run through DEV_VALIDATE_CMD.
COMMIT_GUARDS_PRE_COMMIT_LOCAL = "tools/guard"

# The fragment scope of the changelog-entries lane. The two-segment glob
# keeps changelog.d/README.md out — its bullets document the format and are
# not entries. changelog.d/<package>/<section>/ holds a catalog package's
# own entries, which never move kendex's version; the package setting's
# comment below says which packages carry a version.
# CHANGELOG.md is the lane's other scope,
# COMMIT_GUARDS_CHANGELOG_RECORD, judged by a different rule: entries there
# are the collator's, so only lines this commit ADDS under [Unreleased] are
# refused and the released history no one may rewrite is never measured.
COMMIT_GUARDS_CHANGELOG_PATHS = "changelog.d/*/*.md changelog.d/*/*/*.md"

# The app version equals the workspace version (crates/cli/tests/compat.rs).
# Package manifests keep their own adjacent release records.
COMMIT_GUARDS_CHANGELOG_VERSION_PATHS = "crates/app/tauri.conf.json pi-extensions/*/package.json"

# The catalog packages a changelog.d/<package>/ fragment may name. Skills,
# hooks and agents are declared by their own file and carry no version, so
# a change to one owes no raise.
COMMIT_GUARDS_CHANGELOG_PACKAGE_PATHS = "skills/*/SKILL.md hooks/*.sh agents/*.md"

# Paths whose change obliges a changelog entry, checked by the commit-msg
# lane: crates/ and ui/ are what a consumer sees. [no-changelog] in the
# subject is the escape for a change none of them notices.
COMMIT_GUARDS_CHANGELOG_REQUIRED_PATHS = "crates/* ui/*"

# The markdown lanes judge every tracked markdown file, not only the files a
# commit touches: the tree is reflowed, and tools/md-excludes names the
# vendored text they leave alone.
COMMIT_GUARDS_MD_SCOPE = "all"

GH_BOT_USERNAME = ""
GH_VERIFY_CMD = ""

# Branch names match Linear issue identifiers case-insensitively. GitHub
# issues are deliberately absent because a PR's Closes line identifies them.
GH_ISSUE_PATTERN = "ken-[0-9]+"

LINEAR_FORMAT = "safe"
ORCH_STATE_DIR = "tmp"

# ── Worktrees ────────────────────────────────────────────────────────────
# What a fresh issue worktree gets from this checkout: only paths git does
# not carry. An entry does nothing when git carries every path under it, and
# links the untracked children when it does not. The harness trees (.agents,
# .claude, .codex, .pi) are committed whole, so a worktree gets them from its
# own branch. A render installed in the main checkout and left uncommitted is
# deliberately not linked in: a worktree's harness matches its branch, and
# commit the render to hand it to every worktree. A single tracked FILE is
# the opposite hazard — it becomes a link git cannot write through, so
# .claude/settings.json is absent here and each worktree carries git's own copy.
#
# .opencode is absent for a different reason: kendex-local.toml's [install]
# harnesses names claude, codex and pi, not opencode, so nothing renders
# there. The tree holds no files, and an entry would link an empty directory.
#
# Nothing is copied: the install record (.kendex-lock.json) is committed and
# arrives with the branch, and this machine's half of it sits under .cache,
# which is linked below.
WORKTREE_BASE_DIR = "~/dev/.worktrees/kendex"
WORKTREE_DEFAULT_BRANCH = "main"
WORKTREE_MKDIRS = "tmp"
# ui/node_modules: tools/guard's UI lanes run ui/package.json's scripts, and
# this store is what supplies their binaries at the pinned versions. `npm run`
# puts it at the front of PATH but falls through to the ambient one, so a
# worktree without the store reds guard on its first commit wherever tsc,
# biome and vitest are not installed globally — the normal case, not a
# guarantee the code makes. The link shares the main checkout's real install
# (npm — ui/package-lock.json), and worktree setup re-creates it on every
# pass, replacing anything materialized at this path. So a ui/ dependency
# change is made with the branch checked out in the MAIN checkout, where `npm
# ci --prefix ui` rebuilds the real store from the changed manifests — never
# in a linked worktree, whose install would write through the link.
# .gitignore's bare `node_modules` pattern covers the symlink.
WORKTREE_SYMLINKS = ".env.local .cache ui/node_modules"

# AGENTS.md instruction files are tracked and arrive through git.
# A relative symlink here would shadow tracked content.
WORKTREE_RELATIVE_SYMLINKS = ""

# Seconds a 1Password token resolution may take.
KENDEX_GITHUB_OP_TIMEOUT = "10"

# Seconds the `gh` auth preflight may take.
KENDEX_GITHUB_AUTH_TIMEOUT = "10"

# Seconds a single `pr-view` read may take.
KENDEX_GITHUB_PR_VIEW_TIMEOUT = "30"

# Path to the worktree CLI `open-terminal` drives. Empty resolves the
# installed worktree skill's `scripts/worktree`; a value that is not
# executable stops the launch with that path named.
WORKTREE_CLI = ""

# A file a master session touches while it answers the overseer. While it is
# younger than SLACK_MASTER_MAX_AGE the relay holds its mailbox posts and
# `slack listen --status` shows held-by=master; owner messages still reach the
# overseer. skills/slack/README.md says what posts on resume. Empty: no hold.
SLACK_MASTER_FILE = "~/.fleet/master-live"
