# The kendex catalog: what this repository offers to every kendex install.
# Items live in agents/, skills/, hooks/ and pi-extensions/; the tables
# below say what the catalog states about itself and how its agents and
# skills belong together.

# This file is the canonical catalog, not an install manifest. kendex routes
# this repo's own install state to a sibling kendex-local.toml, so nothing a
# maintainer installs for local use lands in the published catalog.
is_source_catalog = true

[marketplace]
name = "kendex"
description = "The official kendex catalog: agents, skills, hooks and Pi extensions for AI coding harnesses"
author = "vanillagreen"
license = "MIT"
homepage = "https://kendex.ai"
tags = ["agents", "skills", "hooks", "official"]

# Curated sets, drawn from how these packages depend on one another. Install
# a whole set with one preview, or pick from it. Members are bare names in
# one list per kind, the shape `[bundles]` is read in. `workflow` is
# orchestration, code-review and commit-guards plus deep-research and
# bot-instructions in one install; the partial bundles remain available.
[bundles.workflow]
description = "Orchestration, code review and commit guards in one install, with deep-research and bot-instructions"
agents = [
  "reviewer-arch",
  "reviewer-correctness",
  "reviewer-doc",
  "reviewer-error",
  "reviewer-perf",
  "reviewer-quality",
  "reviewer-safety",
  "reviewer-security",
  "reviewer-test",
]
skills = [
  "orch",
  "dev",
  "github",
  "worktree",
  "project-management",
  "decider",
  "reviewer",
  "linear",
  "review-gate",
  "bot-instructions",
  "second-opinion",
  "code-quality",
  "docs-writing",
  "deep-research",
  "growth-guards",
  "size-ratchet",
  "preflight",
]
hooks = [
  "block-bare-cd",
  "block-repo-copy",
  "block-unsafe-rm",
  "block-argv-kill",
  "pre-commit-check",
  "session-drift-check",
  "task-completed-check",
  "doc-drift-check",
  "reviewer-read-only",
  "reviewer-stop-check",
]

[bundles.orchestration]
description = "Multi-agent workflow orchestration and the skills it drives"
skills = [
  "orch",
  "dev",
  "github",
  "worktree",
  "project-management",
  "decider",
  "reviewer",
  "linear",
]

[bundles.code-review]
description = "The review agents and the skills that run a review"
agents = [
  "reviewer-arch",
  "reviewer-correctness",
  "reviewer-doc",
  "reviewer-error",
  "reviewer-perf",
  "reviewer-quality",
  "reviewer-safety",
  "reviewer-security",
  "reviewer-test",
]
skills = [
  "reviewer",
  "review-gate",
  "second-opinion",
  "code-quality",
  "docs-writing",
]
hooks = [
  "reviewer-read-only",
  "reviewer-stop-check",
]

[bundles.research]
description = "Research and planning agents with the deep-research skill"
agents = [
  "researcher",
  "scout",
  "planner",
]
skills = [
  "deep-research",
  "decider",
  "github",
  "linear",
]

[bundles.commit-guards]
description = "Hooks and skills that guard what gets committed"
hooks = [
  "block-bare-cd",
  "block-repo-copy",
  "block-unsafe-rm",
  "block-argv-kill",
  "pre-commit-check",
  "session-drift-check",
  "task-completed-check",
  "doc-drift-check",
]
skills = [
  "growth-guards",
  "size-ratchet",
  "preflight",
]

[bundles.command-safety]
description = "Project-defined shell command restrictions"
hooks = ["command-safety"]
skills = ["growth-guards"]

# Skill mappings per agent — always loaded into context.
[agent-skills]
rust = ["github", "linear"]
iced = ["iced-rs"]
reviewer-arch = ["reviewer"]
reviewer-correctness = ["reviewer"]
reviewer-quality = ["reviewer"]
reviewer-perf = ["reviewer"]
reviewer-safety = ["reviewer"]
reviewer-test = ["reviewer"]
reviewer-doc = ["reviewer"]
reviewer-error = ["reviewer"]
reviewer-security = ["reviewer"]
generalist = ["decider", "github", "dev", "linear", "dep-radar", "review-gate"]
planner = ["github", "linear"]
scout = ["github", "linear"]
tpm = ["decider", "github", "dev", "linear", "project-management"]
researcher = ["deep-research", "decider", "github", "linear"]

# Skills given to all agents of a role.
[role-skills]
analyst = ["linear", "github"]
engineer = ["dev", "github", "decider", "linear", "preflight", "code-quality"]
manager = ["dev", "github", "project-management", "linear", "decider"]
reviewer = ["reviewer"]

# Per-harness frontmatter defaults beneath any project-level overrides.
# tpm plans rather than builds, so on Codex it runs on the lighter model.
[agent-frontmatter.codex]
tpm = { model = "gpt-5.6-sol" }
