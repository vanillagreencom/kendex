[package]
name = "agent-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Shared agent execution: launch, observe, deliver to and stop one coding-harness session"
license = "MIT"
publish = false
# The integration tests live in the package's top-level tests/, which kendex
# leaves out of every render, so the one harness is named by path and
# autodiscovery is off.
autotests = false

# This crate is its own Cargo workspace: it ships inside a catalog skill and
# builds from a rendered install, where no parent workspace exists.
[workspace]

[lib]
name = "agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
regex = "1"
fd-lock = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
# The reset a usage-limit banner names, resolved in the zone it names or the
# runner's own, with the fall-back hour's two instants (`stop::reset`).
jiff = "0.2"

# proc_pidpath, the one call that names a running tmux server's program on
# macOS (host::tmux).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
path = "../tests/rust/main.rs"

[[test]]
name = "accounts"
path = "../tests/rust/accounts.rs"

[[test]]
name = "walk"
path = "../tests/rust/walk.rs"

[[test]]
name = "controller"
path = "../tests/rust/controller.rs"

[[test]]
name = "session"
path = "../tests/rust/session.rs"

[[test]]
name = "load"
path = "../tests/rust/load.rs"

[[test]]
name = "stop"
path = "../tests/rust/stop.rs"

[lints.rust]
# Denied, not forbidden, so the one FFI call macOS needs carries its own
# allowance and SAFETY comment (host::tmux, own_program).
unsafe_code = "deny"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
