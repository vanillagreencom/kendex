# The machine-readable enumeration behind orch's workflows/micro.md
# § Escape condition 3, which states that class in prose, plus the production
# ceilings the `micro` and `small` classes hold. This package's
# `change-scope`, its launch arm, orch's tier and its micro run all
# judge one list. It also holds the `queue` group, the paths that make a
# change queue-only, which harness-ci's `change-class` alone reads, at the
# end of this file.
#
# A `path` glob is matched against the whole repository-relative path with
# bash pattern rules and extglob on, where `*` also crosses `/` and
# `!(*/*|*.md)` is one path segment that is not markdown. A glob that names
# nothing in a repository excludes nothing there.
#
# A `superseded` line names a `path` line kept for a reader from before the
# extglob grammar, a change-class or item-tier of an earlier release, which
# reads an extglob as literal text that names no path. That reader refuses
# on the broad line; the readers of this revision drop it and read the
# narrower extglob lines beside it.
#
# An `instruction` glob names an agent instruction file. A diff carrying
# one that earns `trivial` or `micro` answers `small`, and a Location naming
# one answers `small`, cause=instruction-file; a proven render keeps the
# `render` class.
#
# A `case`, `skip` or `selection` line names what the protection floor
# reads, and only change-scope reads them. `case GLOB ERE` names a test
# case: a line of a path GLOB names that ERE matches. `skip GLOB ERE` names
# a line that skips or narrows the tests of such a path. `selection GLOB`
# names a file that decides which checks run. GLOB is the measurement's
# glob, matched against the whole repository-relative path, with `*` any run
# of characters, `/` included, `?` one character and everything else
# literal; ERE is the rest of the line, an awk extended regular expression
# over a changed line without its diff sign. A diff that earns `trivial` or
# `micro` answers `small`, cause=protection-removed, where over the whole
# range a `case` line loses more lines than it gains, a test file a `case`
# glob names is deleted or renamed away net of those added, a `skip` line
# gains more lines than it loses in files the base holds, or a `selection`
# path changes; an instruction file keeps its own cause.
#
# A skill package's line or a hook line names the files that carry the risk
# its comment states, never the package whole: its README, SKILL.md,
# references and tests measure on their own content. tools/, this
# repository's own commit chain and release tooling, is taken whole.

micro_max_production=20
small_max_production=150

# Gates a merge, runs in a commit or turn hook, enforces a guard rule,
# decides whether validation runs, or launches a lane.
path .github/workflows/*
path .github/actions/*
path *skills/review-gate/scripts/*
path *skills/review-gate/templates/*
path *skills/review-gate/standard.json
path *skills/github/scripts/*
# A hook body, in a catalog's hooks/ or a harness's render of it; the suites
# under hooks/tests/ and the markdown beside the bodies are not hooks. The Pi
# extension that runs every installed hook in a Pi session is hook code too.
path *hooks/*
superseded *hooks/*
path hooks/!(*/*|*.md)
path */hooks/!(*/*|*.md)
path pi-extensions/pi-hooks/extensions/*
path *skills/commit-guards/scripts/*
path tools/*
path *skills/preflight/scripts/*
path *skills/doc-limits/scripts/*
# harness-ci's scripts run the classifier for CI, judge the queue-only class
# and aggregate the lanes a merge waits on.
path *skills/harness-ci/scripts/*
# opencode has no native hook surface, so the opencode adapter renders a hook
# as an instruction file the harness loads every session; that path carries no
# `hooks/` segment and the glob above does not reach it.
path .opencode/instructions/*
# The list the fleet's control-VM PreToolUse guard reads.
path *skills/orch/references/control-host-toolchain.conf
# The secret-value pattern, written for the fleet's state gate and the
# slack package.
path *skills/orch/references/secret-value.ere
# The scripts that launch a lane.
path *skills/orch/scripts/lib/lane-relaunch.sh
path *skills/orch/scripts/lanes
path *skills/orch/scripts/lane-host*
# The workflows that state a narrow tier and its boundary in prose, the
# runtime module that maps each item's class to its tier, and orch's copy of
# the settings reader.
path *skills/orch/workflows/micro.md
path *skills/orch/workflows/small.md
path *skills/orch/workflows/oversee.md
path *skills/orch/runtime/src/ops/tier.rs
path *skills/orch/scripts/lib/kendex-env.sh

# [boundary] What change classification reads or runs: a path joins when
# editing it changes the range, measurement settings or class ceilings.
# The group is held to the classifier's measures-with declarations and the
# source lines of each declared file by:
# https://github.com/vanillagreencom/kendex/blob/main/skills/change-scope/tests/narrow-boundary.test.sh
path *skills/change-scope/scripts/change-scope
path *skills/change-scope/scripts/harness-only
path *skills/change-scope/scripts/lib/change-scope.sh
path *skills/change-scope/scripts/lib/branch-growth.sh
path *skills/change-scope/scripts/lib/kendex-env.sh
path *skills/change-scope/references/narrow-change.conf
path *skills/bot-instructions/scripts/bot-instructions
path *skills/bot-instructions/scripts/lib/__init__.py
path *skills/bot-instructions/scripts/lib/cli.py
path *skills/bot-instructions/scripts/lib/config.py
path *skills/bot-instructions/scripts/lib/constants.py
path *skills/bot-instructions/scripts/lib/errors.py
path *skills/bot-instructions/scripts/lib/fsutil.py
path *skills/bot-instructions/scripts/lib/globs.py
path *skills/bot-instructions/scripts/lib/jsonschema.py
path *skills/bot-instructions/scripts/lib/main.py
path *skills/bot-instructions/scripts/lib/manifest.py
path *skills/bot-instructions/scripts/lib/markdown.py
path *skills/bot-instructions/scripts/lib/marker.py
path *skills/bot-instructions/scripts/lib/model.py
path *skills/bot-instructions/scripts/lib/refusals.py
path *skills/bot-instructions/scripts/lib/render.py
path *skills/bot-instructions/scripts/lib/render_coderabbit.py
path *skills/bot-instructions/scripts/lib/render_markdown.py
path *skills/bot-instructions/scripts/lib/render_qodo.py
path *skills/bot-instructions/scripts/lib/run.py
path *skills/bot-instructions/scripts/lib/spec.py
path *skills/bot-instructions/scripts/lib/tree.py
path *skills/bot-instructions/scripts/lib/validators_bytes.py
path *skills/bot-instructions/scripts/lib/validators_repo.py
path *skills/bot-instructions/scripts/lib/verbs.py
path *skills/bot-instructions/scripts/lib/writer.py
path *skills/bot-instructions/scripts/lib/yamlemit.py

# An agent instruction file: an edit to one changes how every agent behaves,
# so one that earns `trivial` or `micro` answers `small`, the lowest class the
# default review policy gives a bot round; a proven render keeps `render`.
# CLAUDE.md, the pointer to AGENTS.md, is refused by `change-class` by name.
instruction AGENTS.md
instruction */AGENTS.md
instruction SKILL.md
instruction */SKILL.md

# A project surface a harness or a review bot loads in normal use, or reads as
# policy deciding what it will run, and that neither the `instruction` group
# above nor `change-class` by name, as it refuses CLAUDE.md, already judges.
# The rule over the adapters under crates/core/src/harness, which is what keeps
# this list whole rather than one thread's worth of paths: a project surface
# joins it when a harness reads that path without anyone invoking an item.
# A directory a harness reads only when an item is named stays off it —
# skills/, agents/, commands/, prompts/, extensions/, plugins/ and Cursor's
# rules/ under any harness root — because those hold the rendered catalog and
# a row for them would take every catalog change out of the narrow classes.
# The first two are rendered by the bot-instructions package and read by
# Copilot code review on every pull request; GEMINI.md and .agents/rules/ are
# the project markers the Gemini and Antigravity adapters name, and are what
# those harnesses load as context; .github/allowed_models.txt is what the
# Copilot adapter reads to decide which model an agent may be run on.
path .github/copilot-instructions.md
path .github/instructions/*.instructions.md
path GEMINI.md
path .agents/rules/*.md
path .github/allowed_models.txt

# Lock-format, manifest-parser, render-inventory and security paths. These
# reach this file for the wider `small` class, and micro.md § Escape
# condition 3 takes them too: every `path` line here escapes the micro tier,
# except one a `superseded` line names, as the header states. The inventory
# exception is stated in ../scripts/lib/change-scope.sh beside
# names_only_roots_rendered.
path .kendex-lock.json
path .kendex-generated.json
path *crates/core/src/lock*
path *crates/core/src/manifest*

# The protection floor's markers. A shell suite's cases are its assert_*
# call lines and the `label|...` rows of its tables, so a refactor that folds
# rows takes the floor's one reading. A suite's `# bash-runtime: 4` note
# drops it from the macOS run.
case *.rs ^[[:space:]]*#\[([[:alnum:]_]+::)?test(]|\()
case *Cargo.toml ^[[:space:]]*\[\[test]]
case *.test.sh ^[[:space:]]*assert_[[:alnum:]_]+([[:space:]]|$)
case *.test.sh ^[^#[:space:]][^|]*[^|[:space:]]\|[^|]
case *.test.* ^[[:space:]]*(it|test)(\.[[:alnum:]]+)*[[:space:]]*\(
case *.spec.* ^[[:space:]]*(it|test)(\.[[:alnum:]]+)*[[:space:]]*\(
case *.py ^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+test_
case *_test.go ^func[[:space:]]+(Test|Benchmark|Fuzz)
case *.java ^[[:space:]]*@Test
case *.kt ^[[:space:]]*@Test
case *.swift ^[[:space:]]*func[[:space:]]+test
skip *.rs ^[[:space:]]*#\[ignore
skip *Cargo.toml ^[[:space:]]*(autotests|test)[[:space:]]*=[[:space:]]*false
skip *.test.* (\.(skip|only|todo)|^[[:space:]]*x(it|test|describe))[[:space:]]*\(
skip *.spec.* (\.(skip|only|todo)|^[[:space:]]*x(it|test|describe))[[:space:]]*\(
skip *.py @(pytest\.mark\.(skip|xfail)|unittest\.skip)
skip *_test.go t\.Skip(Now|f)?\(
skip *.java ^[[:space:]]*@(Disabled|Ignore)
skip *.kt ^[[:space:]]*@(Disabled|Ignore)
skip *.swift XCTSkip
skip *.sh ^#[[:space:]]*bash-runtime:[[:space:]]*4
# A repository's CI lane declaration, harness-ci's .github/ci-lanes.conf.
selection .github/ci-lanes.conf

# [queue] The queue-only class. A change that touches any path below must run
# in a merge group before it lands, so it takes the merge queue and never the
# admin route. harness-ci's `change-class` reads these lines alone, beside the
# repository's own HARNESS_CI_QUEUE_PATHS, and its header states when its
# `queue-only:` line reads true. pr-merge's merge route reads that line before
# it takes the admin route. Every other reader of this file ignores the
# `queue` keyword.
#
# CI workflows and actions.
queue .github/workflows/*
queue .github/actions/*
# Ruleset inputs: the organization-standard report and its declared values.
# The classifier, its list, the branch measurement and settings reader it
# runs, harness-ci's CI wrapper and the job selection with the Rust reads it
# takes decide which class the classifier answers and which lanes `CI` waits
# on. harness-ci's tests/queue-only.test.sh holds every row of the boundary
# group above to this group, and tools/tests/ci-class-job-set.test.sh holds
# every path tools/ci-job-set's LANE_SOURCES names to it.
queue *skills/review-gate/scripts/*
queue *skills/review-gate/templates/*
queue *skills/review-gate/standard.json
queue kendex.settings.toml
queue .kendex/settings.toml
queue *skills/harness-ci/scripts/*
queue *skills/change-scope/scripts/*
queue *skills/change-scope/references/narrow-change.conf
queue *skills/bot-instructions/scripts/*
queue *skills/orch/scripts/resolve-base-branch
queue tools/ci-job-set
queue tools/guard
queue tools/macos-test-contracts
queue tools/macos-test-contracts.json
queue tools/rust-reads
queue tools/lib/skill-requirements.awk
# The shared test harness: every skill's test library, the tools suites and
# the CI test aggregator that holds `CI` to the lanes' results.
queue *skills/*/tests/lib/*
queue tools/tests/*
queue tools/ci-aggregate
# kendex's own manifest.
queue kendex.toml
# Bot-instruction sources: kendex-local.toml, the spec copy's doctrine and
# render rules, and the two rendered bot files, .github/copilot-instructions.md
# and .github/instructions/*. Root AGENTS.md stays off: its region moves only
# beside a listed render, and the Bot instructions job fails a hand edit.
queue kendex-local.toml
queue *skills/bot-instructions/SKILL.md
queue *skills/bot-instructions/schemas/renders.md
queue .github/copilot-instructions.md
queue .github/instructions/*
