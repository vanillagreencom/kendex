# The CI workflow a repository adopts from the harness-ci package, copied to
# .github/workflows/ci.yml. .agents/skills/harness-ci/references/wiring.md
# § The CI template says what to keep and what to change.
#
# Every repository under the standard reports the aggregate `CI` context on
# pull_request and merge_group, which standard-ci-context checks, so its job
# keeps that name and every lane reports into it. What the required-checks
# ruleset holds is .agents/skills/harness-ci/references/wiring.md
# § The CI context. The classifier judges the diff on
# pull_request and merge_group alike, and every lane reads the same answers
# on both, so each event runs the lanes its own diff calls for, less the
# ones a passing run of the same tree already ran: a merge group whose tree
# its pull request's run tested stands down the lanes that run covered,
# which is why every lane here does the same work on both events. Which diffs
# run which lane is the change-class action's answer, not this file's: the
# `changes` job forwards it and names no class, so a change to that rule
# reaches this workflow with no edit to it. How a lane and CI combine its
# answers is .agents/skills/harness-ci/references/wiring.md § Per-lane verdicts.
name: CI

"on":
  pull_request:
  # A required context a merge group never produces blocks the queue forever.
  merge_group:

permissions:
  contents: read

jobs:
  # THE ONE READ OF THE CHANGE CLASS. No other job classifies anything.
  changes:
    name: Classify the diff
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    # The render proof re-renders every installed item, so its cost grows
    # with the install rather than with the diff.
    timeout-minutes: 20
    # `actions: read` is what the action reads this workflow's earlier runs
    # with, to stand down the lanes a passing run of the same tree already
    # ran: .agents/skills/harness-ci/references/wiring.md § Proof reuse.
    permissions:
      contents: read
      actions: read
    outputs:
      # Whether the lanes run at all, as the action answered it: what every
      # lane condition and CI's waiver read. The classify step's `lanes:`
      # log line says why.
      lanes: ${{ steps.classify.outputs.lanes }}
      # One output per lane .github/ci-lanes.conf declares, its verdict as
      # the action answered it. The classify step's `lane:` log lines say
      # why.
      lane_test: ${{ steps.lanes.outputs.lane_test }}
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
      # The kendex the render proof re-renders with: a published main build,
      # whose installer is read at the same sha. Move both together, to a
      # build whose `kendex verify --json` prints a version 1 document and
      # whose `kendex verify` takes `--at-record`, which the classifier always
      # passes; a build without that flag answers standard on every diff.
      KENDEX_BUILD_SHA: 9dab3e4c2f7b95e2ff7a03915e708bd8d1629782
      KENDEX_VERSION: main-build-250-1-9dab3e4c2f7b95e2ff7a03915e708bd8d1629782
    steps:
      - name: the classifier, from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      # change-class reads kendex and the source mirror only where
      # harness-only answers harness_only=true, so the two network steps run
      # only there. It reads the default branch's harness-only, which the
      # adoption pull request and its merge group do not have yet: a failure
      # here leaves harness_only empty and both network steps skip, so the
      # `render` class is out of reach and every other class is judged as
      # usual, rather than failing the classifier on the one pull request
      # that could add it.
      - id: render-reach
        continue-on-error: true
        run: >-
          classifier/.agents/skills/harness-ci/scripts/harness-only
          --repo subject --event "$EVENT" --base "$BASE" --head "$HEAD"
      # Neither network step fails this job: without them the render proof is
      # unavailable, the class falls to `standard`, and the action answers
      # `lanes` from the docs verdict alone.
      # The warning step annotates the run when either did not succeed.
      - id: kendex
        name: kendex, for the render class
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: >-
          curl -fsSL
          "https://raw.githubusercontent.com/vanillagreencom/kendex/$KENDEX_BUILD_SHA/install.sh"
          | sh -s -- --version "$KENDEX_VERSION"
      - id: mirror
        name: the source mirror the render proof re-renders from
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: subject
        run: kendex source refresh
      - name: warn when the render proof lost a prerequisite
        if: steps.render-reach.outputs.harness_only == 'true' && (steps.kendex.outcome != 'success' || steps.mirror.outcome != 'success')
        env:
          KENDEX_OUTCOME: ${{ steps.kendex.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: >-
          echo "::warning title=render proof may be unavailable::kendex install $KENDEX_OUTCOME, source refresh $MIRROR_OUTCOME (KENDEX_VERSION=$KENDEX_VERSION)"
      - id: classify
        uses: vanillagreencom/kendex/.github/actions/change-class@main
        env:
          ORCH_SIZE_RENDER_ROOTS: .agents .claude .codex .pi
          # ORCH_SIZE_TEST_PATHS: <globs>
          # Test globs outside orch's defaults belong in the default branch's
          # kendex.settings.toml, which a lane's own classifier run reads too.
        with:
          repo: subject
          # The lane declaration is the default branch's: the pull request's
          # own copy could stand its lanes down.
          lanes-from: classifier
          # Every lane here runs wherever lanes is true and does the same
          # work on every event, with no job or step gated on the event, so
          # a run that reads no declaration records that it covered them
          # all, and a later run of the same tree stands them down. A
          # workflow that selects its jobs by anything else, or gates a lane
          # on the event, leaves this out. A declared lane stands down only
          # where .github/ci-lanes.conf marks it `:event-uniform`.
          covers-all-lanes: true
          event: ${{ env.EVENT }}
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
      # A composite action publishes only the outputs it declares, so the
      # verdicts arrive as one `lane_<name>=true|false` line per lane and are
      # published here as step outputs, one per lane.
      - id: lanes
        env:
          LANE_VERDICTS: ${{ steps.classify.outputs.lane_verdicts }}
        run: printf '%s\n' "$LANE_VERDICTS" >>"$GITHUB_OUTPUT"

  # THE REPOSITORY'S LANES. Replace this job with the repository's own, one
  # job per lane, each declared in .github/ci-lanes.conf, marked
  # `:event-uniform` there where it does the same work on every event, and
  # published as a
  # `lane_<name>` output above, given this `needs:` and this `if:` with its
  # own output, named in CI's `needs:` and aggregate step as they name
  # `test`. A lane that reads a file under docs/ or changelog.d/, or a root
  # .md or .markdown file, is the exception
  # .agents/skills/harness-ci/references/wiring.md § Through the composite action
  # states. Copied as it stands, this lane fails, and CI with it.
  test:
    name: Test
    needs: changes
    # The status function runs the lane when the classifier died, and the
    # result term keeps the empty outputs of a dead classifier from reading
    # as a skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.lanes != 'false' && needs.changes.outputs.lane_test != 'false')) }}
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "::error::replace the Test job with the repository's own lanes" && exit 1

  # THE REQUIRED CONTEXT. always(): a failed or skipped need would otherwise
  # skip this job, and a skipped required context satisfies the ruleset.
  # aggregate-needs accepts a skipped lane only where the classifier
  # succeeded and a verdict stood it down.
  ci:
    name: CI
    needs: [changes, test]
    if: always()
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: the credential guards, from the default branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: guards
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: secrets (credential scan of the pull request diff)
        if: always() && github.event_name == 'pull_request'
        working-directory: subject
        run: |
          "$GITHUB_WORKSPACE/guards/.agents/skills/commit-guards/scripts/install-gitleaks" "$RUNNER_TEMP/gitleaks"
          PATH="$RUNNER_TEMP/gitleaks:$PATH" "$GITHUB_WORKSPACE/guards/.agents/skills/commit-guards/scripts/secrets" --against HEAD^1
      - name: the classifier ran and every lane that skipped was told to
        working-directory: subject
        env:
          RESULTS: ${{ toJSON(needs) }}
          WAIVER: ${{ needs.changes.outputs.lanes == 'false' }}
        run: >-
          .agents/skills/harness-ci/scripts/aggregate-needs
          --results "$RESULTS" --classifier changes --waiver "$WAIVER"
          --skippable test --lane test=test
