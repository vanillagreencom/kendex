# The CI workflow a repository adopts from the harness-ci package, copied to
# .github/workflows/ci.yml. .agents/skills/harness-ci/references/wiring.md
# § The CI template says what to keep and what to change.
#
# `CI` is the one required context the organization ruleset asks of every
# repository beside `Review gate`, so the job carrying it keeps that name and
# every lane the repository runs reports into it: a lane in another workflow
# is a lane no required context holds. The classifier judges the diff on
# pull_request and merge_group alike, and every lane reads its own verdict on
# both, so each event runs the lanes its own diff calls for. Which diffs run
# which lane is the change-class action's answer, from the paths each lane
# declares it reads in the default branch's .github/ci-lanes.conf, not this
# file's: the `changes` job forwards the verdicts and names no class, so a
# change to that rule reaches this workflow with no edit to it.
name: CI

"on":
  pull_request:
  # A required context a merge group never produces blocks the queue forever.
  merge_group:

permissions:
  contents: read

jobs:
  # THE ONE READ OF THE CHANGE CLASS. No other job classifies anything.
  changes:
    name: Classify the diff
    runs-on: ubuntu-latest
    # The render proof re-renders every installed item, so its cost grows
    # with the install rather than with the diff.
    timeout-minutes: 20
    outputs:
      # One output per lane .github/ci-lanes.conf declares, its verdict as
      # the action answered it: what the lane's condition and CI's `--lane`
      # read. Empty where no declaration was read, which runs the lane. The
      # classify step's `lane:` log lines say why.
      lane_test: ${{ steps.lanes.outputs.lane_test }}
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
      # The kendex the render proof re-renders with: a published main build,
      # whose installer is read at the same sha. Move both together, to a
      # build whose `kendex verify --json` prints a version 1 document and
      # whose `kendex verify` takes `--at-record`, which the classifier always
      # passes; a build without that flag answers standard on every diff.
      KENDEX_BUILD_SHA: 9dab3e4c2f7b95e2ff7a03915e708bd8d1629782
      KENDEX_VERSION: main-build-250-1-9dab3e4c2f7b95e2ff7a03915e708bd8d1629782
    steps:
      - name: the classifier, from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      # change-class reads kendex and the source mirror only where
      # harness-only answers harness_only=true, so the two network steps run
      # only there. It reads the default branch's harness-only, which the
      # adoption pull request and its merge group do not have yet: a failure
      # here leaves harness_only empty and both network steps skip, so the
      # `render` class is out of reach and every other class is judged as
      # usual, rather than failing the classifier on the one pull request
      # that could add it.
      - id: render-reach
        continue-on-error: true
        run: >-
          classifier/.agents/skills/harness-ci/scripts/harness-only
          --repo subject --event "$EVENT" --base "$BASE" --head "$HEAD"
      # Neither network step fails this job: without them the render proof is
      # unavailable, the class falls to `standard`, and the action answers
      # `lanes` from the docs verdict alone.
      # The warning step annotates the run when either did not succeed.
      - id: kendex
        name: kendex, for the render class
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: >-
          curl -fsSL
          "https://raw.githubusercontent.com/vanillagreencom/kendex/$KENDEX_BUILD_SHA/install.sh"
          | sh -s -- --version "$KENDEX_VERSION"
      - id: mirror
        name: the source mirror the render proof re-renders from
        if: steps.render-reach.outputs.harness_only == 'true'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: subject
        run: kendex source refresh
      - name: warn when the render proof lost a prerequisite
        if: steps.render-reach.outputs.harness_only == 'true' && (steps.kendex.outcome != 'success' || steps.mirror.outcome != 'success')
        env:
          KENDEX_OUTCOME: ${{ steps.kendex.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: >-
          echo "::warning title=render proof may be unavailable::kendex install $KENDEX_OUTCOME, source refresh $MIRROR_OUTCOME (KENDEX_VERSION=$KENDEX_VERSION)"
      - id: classify
        uses: vanillagreencom/kendex/.github/actions/change-class@main
        env:
          ORCH_SIZE_RENDER_ROOTS: .agents .claude .codex .pi
          # ORCH_SIZE_TEST_PATHS: <globs>
        with:
          repo: subject
          # The lane declaration is the default branch's: the pull request's
          # own copy could stand its lanes down.
          lanes-from: classifier
          event: ${{ env.EVENT }}
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
      # A composite action publishes only the outputs it declares, so the
      # verdicts arrive as one `lane_<name>=true|false` line per lane and are
      # published here as step outputs, one per lane.
      - id: lanes
        env:
          LANE_VERDICTS: ${{ steps.classify.outputs.lane_verdicts }}
        run: printf '%s\n' "$LANE_VERDICTS" >>"$GITHUB_OUTPUT"

  # THE REPOSITORY'S LANES. Replace this job with the repository's own, one
  # job per lane, each declared in .github/ci-lanes.conf, published as a
  # `lane_<name>` output above, and given this `needs:` and this `if:` with
  # its own output, and name each one in CI's `needs:` and in a `--lane` of
  # its aggregate step. A lane that reads a file under docs/ or changelog.d/,
  # or a root .md or .markdown file, is the exception: every verdict is false
  # on a docs-only diff of any size, so that lane keeps `needs: changes`,
  # takes `if: ${{ !cancelled() }}` with no verdict term, and stays out of
  # every `--lane`. Copied as it stands, this lane fails, and CI with it.
  test:
    name: Test
    needs: changes
    # The status function runs the lane when the classifier died, and the
    # result term keeps the empty outputs of a dead classifier from reading
    # as a skip. Only a verdict of false stands the lane down, so a lane
    # with no verdict runs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.lane_test != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "::error::replace the Test job with the repository's own lanes" && exit 1

  # THE REQUIRED CONTEXT. always(): a failed or skipped need would otherwise
  # skip this job, and a skipped required context satisfies the ruleset.
  # aggregate-needs accepts a skipped lane only where the classifier
  # succeeded and the lane's own verdict, which it reads out of RESULTS,
  # stood it down.
  ci:
    name: CI
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the classifier ran and every lane that skipped was told to
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          .agents/skills/harness-ci/scripts/aggregate-needs
          --results "$RESULTS" --classifier changes
          --lane test=test
