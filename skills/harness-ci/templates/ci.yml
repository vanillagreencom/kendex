# The CI workflow a repository adopts from the harness-ci package, copied to
# .github/workflows/ci.yml. .agents/skills/harness-ci/references/wiring.md
# § The CI template says what to keep and what to change.
#
# Every repository under the standard reports the aggregate `CI` context on
# pull_request and merge_group, which standard-ci-context checks, so its job
# keeps that name and every lane reports into it. What the required-checks
# ruleset holds is .agents/skills/harness-ci/references/wiring.md
# § The CI context. The merge-queue run is the only proof of a head: on
# pull_request the change-class action, asked by its queue-only-default input
# below, stands every lane down on a repository with no
# HARNESS_CI_PER_PUSH_REASON, and CI passes on that stand-down, which GitHub
# needs before it admits the pull request to the queue. The merge group runs
# the lanes its own diff calls for. The schedule and workflow_dispatch runs
# are the nightly full run on the default branch: every lane, `:nightly`
# lanes included. Which diffs run which lane is the change-class action's
# answer, not this file's: the `changes` job forwards it and names no class,
# so a change to that rule reaches this workflow with no edit to it. How a
# lane and CI combine its answers is
# .agents/skills/harness-ci/references/wiring.md § Per-lane verdicts, and the
# default and its opt-back are § The CI template.
name: CI

"on":
  # CI must report here, or GitHub admits no pull request to the queue.
  pull_request:
  # A required context a merge group never produces blocks the queue forever.
  merge_group:
  # The nightly full run on the default branch; a red one reaches the
  # overseer through orch's oversee-watch.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR updates cancel superseded runs; other events keep unique groups.
# .agents/skills/harness-ci/references/wiring.md § The CI template.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE ONE READ OF THE CHANGE CLASS. No other job classifies anything.
  changes:
    name: Classify the diff
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    # The render proof re-renders every installed item, so its cost grows
    # with the install rather than with the diff. It runs only for a render
    # candidate, on pull_request too: the overseer's consumer refresh
    # approval reads the pull request run's measured render class.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      # Whether the lanes run at all, as the action answered it: what every
      # lane condition and CI's waiver read. The classify step's `lanes:`
      # log line says why.
      lanes: ${{ steps.classify.outputs.lanes }}
      # One output per lane .github/ci-lanes.conf declares, its verdict as
      # the action answered it. The classify step's `lane:` log lines say
      # why.
      lane_test: ${{ steps.lanes.outputs.lane_test }}
    env:
      EVENT: ${{ github.event_name }}
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
    steps:
      - name: the classifier, from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: classifier
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      # The candidate reads endpoint ownership and permits new head paths.
      # It gates installation only; change-class must prove render to skip CI.
      # A missing default-branch script leaves the candidate empty and runs
      # product checks, including on the adoption pull request.
      - id: render-reach
        continue-on-error: true
        run: >-
          classifier/.agents/skills/harness-ci/scripts/harness-only
          --mode render-candidate --repo subject --event "$EVENT" --base "$BASE" --head "$HEAD"
      # Neither network step fails this job: without them the render proof is
      # unavailable, the class falls to `standard`, and the action answers
      # `lanes` from the docs verdict alone.
      # The warning step annotates the run when either did not succeed.
      - id: kendex
        name: kendex, for the render class
        if: steps.render-reach.outputs.render_candidate == 'true'
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ${{ github.token }}
        # Use the release on the trusted refresh caller's major-tag commit.
        # The trusted helper selects a release and its exact installer commit.
        run: classifier/.agents/skills/review-gate/scripts/install-latest.sh
      - id: mirror
        name: the source mirror the render proof re-renders from
        if: steps.render-reach.outputs.render_candidate == 'true'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: subject
        run: kendex source refresh
      - name: warn when the render proof lost a prerequisite
        if: steps.render-reach.outputs.render_candidate == 'true' && (steps.kendex.outcome != 'success' || steps.mirror.outcome != 'success')
        env:
          KENDEX_OUTCOME: ${{ steps.kendex.outcome }}
          MIRROR_OUTCOME: ${{ steps.mirror.outcome }}
        run: >-
          echo "::warning title=render proof may be unavailable::kendex install $KENDEX_OUTCOME, source refresh $MIRROR_OUTCOME"
      - id: classify
        uses: vanillagreencom/kendex/.github/actions/change-class@main
        env:
          ORCH_SIZE_RENDER_ROOTS: .agents .claude .codex .pi
          # ORCH_SIZE_TEST_PATHS: <globs>
          # Test globs outside orch's defaults belong in the default branch's
          # kendex.settings.toml, which a lane's own classifier run reads too.
        with:
          repo: subject
          # The lane declaration is the default branch's: the pull request's
          # own copy could stand its lanes down.
          lanes-from: classifier
          # The queue-only default: a pull request stands its lanes down and
          # the merge-group run proves the head. A copy without this line
          # runs its lanes on every pull request.
          queue-only-default: true
          event: ${{ env.EVENT }}
          base: ${{ env.BASE }}
          head: ${{ env.HEAD }}
      # A composite action publishes only the outputs it declares, so the
      # verdicts arrive as one `lane_<name>=true|false` line per lane and are
      # published here as step outputs, one per lane.
      - id: lanes
        env:
          LANE_VERDICTS: ${{ steps.classify.outputs.lane_verdicts }}
        run: printf '%s\n' "$LANE_VERDICTS" >>"$GITHUB_OUTPUT"

  # THE REPOSITORY'S LANES. Replace this job with the repository's own, one
  # job per lane, each declared in .github/ci-lanes.conf, marked
  # `:nightly` there where it is a platform lane (macOS, Windows, GPU or a
  # larger runner) that runs per change only where its own paths change,
  # and published as a
  # `lane_<name>` output above, given this `needs:` and this `if:` with its
  # own output, named in CI's `needs:` and aggregate step as they name
  # `test`. A lane that reads a file under docs/ or changelog.d/, or a root
  # .md or .markdown file, is the exception
  # .agents/skills/harness-ci/references/wiring.md § Through the composite action
  # states. Copied as it stands, this lane fails, and CI with it.
  test:
    name: Test
    needs: changes
    # The status function runs the lane when the classifier died, and the
    # result term keeps the empty outputs of a dead classifier from reading
    # as a skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.lanes != 'false' && needs.changes.outputs.lane_test != 'false')) }}
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "::error::replace the Test job with the repository's own lanes" && exit 1

  # THE REQUIRED CONTEXT. always(): a failed or skipped need would otherwise
  # skip this job, and a skipped required context satisfies the ruleset.
  # aggregate-needs accepts a skipped lane only where the classifier
  # succeeded and a verdict stood it down.
  ci:
    name: CI
    needs: [changes, test]
    if: always()
    runs-on: ${{ vars.CI_RUNNER_2V || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: the credential guards and skip judge, from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: guards
          persist-credentials: false
      - name: the tree under judgement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: secrets (credential scan of the pull request diff)
        if: always() && github.event_name == 'pull_request'
        working-directory: subject
        run: |
          "$GITHUB_WORKSPACE/guards/.agents/skills/commit-guards/scripts/install-gitleaks" "$RUNNER_TEMP/gitleaks"
          PATH="$RUNNER_TEMP/gitleaks:$PATH" "$GITHUB_WORKSPACE/guards/.agents/skills/commit-guards/scripts/secrets" --against HEAD^1 --policy-root "$GITHUB_WORKSPACE/guards"
      - name: the classifier ran and every lane that skipped was told to
        working-directory: guards
        env:
          RESULTS: ${{ toJSON(needs) }}
          WAIVER: ${{ needs.changes.outputs.lanes == 'false' }}
        run: |
          if [ ! -x .agents/skills/harness-ci/scripts/aggregate-needs ]; then
            echo "::error::missing default-branch helper: guards/.agents/skills/harness-ci/scripts/aggregate-needs"
            exit 1
          fi
          .agents/skills/harness-ci/scripts/aggregate-needs \
            --results "$RESULTS" --classifier changes --waiver "$WAIVER" \
            --skippable test --lane test=test
