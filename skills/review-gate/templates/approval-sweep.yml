# SCAFFOLD from the vstack review-gate skill (templates/approval-sweep.yml).
# Copy once into .github/workflows/ in the adoption PR; the file is REPO-OWNED
# after the copy — `vstack refresh` does not sync workflow YAML.
name: Approval gate sweep

# Some gate-relevant transitions emit NO usable Actions event, so the
# event-driven re-fire (approval-rerun.yml) can never see them. Chief case:
# resolving (or REOPENING) the last unresolved review thread —
# `pull_request_review_thread` is a webhook event but not an Actions trigger
# — so a fully-addressed PR's pending gate status would stand until some
# other trusted event happened. Late outage-marker timing has the same shape.
#
# This scheduled sweep closes those gaps, and backstops writer runs evicted
# from the shared concurrency group (see the rerun workflow's comments).
# Every 15 minutes the shared vendored script's all-PRs mode
# (.agents/skills/review-gate/scripts/approval-refire.sh, ALL_OPEN_PRS=1 —
# single source of truth with approval-rerun.yml, which uses the same mode
# for eviction-prone event shapes) re-evaluates the gate predicate for every
# open PR and converges the gate commit status:
# downward transitions are a direct status post; the first awaiting→approved
# flip re-runs the head's pull_request runs, bounded by
# REVIEW_GATE_MAX_RERUN_ATTEMPTS so an evidence-disagreement ping-pong can
# never retry forever. A genuinely failing build is never retried by the
# sweep — once an approved attempt has run, the gate status carries a
# success entry and only direct posts happen.
#
# A read error for one PR is reported (::error) and the sweep continues to
# the other PRs, then exits non-zero so the failure is visible in the run
# list — fail loudly, never silently (matching the shared script's posture).

"on":
  schedule:
    # Worst-case added latency for a thread-resolution-only transition.
    - cron: "*/15 * * * *"
  # Manual sweep for testing and for "I just resolved the last thread and
  # don't want to wait" moments.
  workflow_dispatch: {}

permissions:
  # rerun of the head's pull_request runs
  actions: write
  # PR list + reviews (gate predicate)
  pull-requests: read
  # PR conversation comments (comment-form clean-pass evidence) are READ;
  # WRITE is for the sustained-failure escalation step's rolling incident
  # issue only (VST-36).
  issues: write
  # clean-analysis evidence reads
  checks: read
  # read the current gate status + POST the converged one
  statuses: write
  # checkout of the shared script
  contents: read


jobs:
  sweep:
    concurrency:
      # Shares the single repo-wide gate-writer group with approval-rerun.yml: a
      # sweep evaluating a stale snapshot must never interleave its posts with a
      # newer event-driven write (see the rerun template's comment).
      group: review-gate-writer
      cancel-in-progress: false
    name: Converge review gates that drifted
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Pinned to the DEFAULT branch with credentials dropped:
      # `workflow_dispatch` follows the dispatched ref by default, which
      # would let a branch-controlled copy of the script run under this
      # job's `actions: write` token. Manual dispatch is for testing the
      # MERGED sweep, same trust boundary as approval-rerun.yml's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Sweep open PRs
        # Bounded strictly under the job's timeout-minutes so the escalation
        # step below still executes when this step overruns (a job killed by
        # its own timeout is CANCELLED, which the step guard covers).
        timeout-minutes: 12
        run: |
          set -u
          if [ ! -f .agents/skills/review-gate/scripts/approval-refire.sh ]; then
            echo "::error::.agents/skills/review-gate/scripts/approval-refire.sh is missing on the default branch (bootstrap PR? deleted?); sweep aborted"
            exit 1
          fi
          # Enumeration, pagination, and per-PR failure containment live in
          # the script's all-PRs mode — shared verbatim with the rerun
          # workflow's eviction-prone event path (#1039).
          export ALL_OPEN_PRS=1
          exec .agents/skills/review-gate/scripts/approval-refire.sh

      # Sustained-failure escalation (VST-36): the scheduled sweep is the
      # only arm guaranteed to reach a downward transition (a dismissal
      # fires no usable trigger), so its own sustained failure must not be
      # silent. `failure() || cancelled()` — cancelled() because a job
      # killed by its own timeout-minutes is cancelled, and the converge
      # step above is bounded under the job budget so this step still runs.
      # The incident is a ROLLING issue: one open issue found by exact
      # title (label-free — labels may not exist on a consumer repo),
      # appended per failure, closed by a human when the fault is fixed.
      # Escalation failure itself only warns: it must never mask the red
      # sweep result it is reporting.
      - name: Escalate sustained sweep failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="review-gate convergence sweep is failing (rolling incident)"
          body="Sweep run failed or was cancelled: $RUN_URL"
          # A FAILED lookup must not fall through to "no open incident" — a
          # transient read failure would then mint a duplicate rolling issue
          # per failing run. Warn and stop; the next failing sweep retries.
          if ! nums="$(gh api "repos/$GH_REPO/issues?state=open&per_page=100" --paginate \
            --jq "[.[] | select(.pull_request == null and .title == \"$title\")][0].number // empty")"; then
            echo "::warning::could not look up the rolling incident issue; skipping escalation for this run to avoid a duplicate ($RUN_URL)"
            exit 0
          fi
          num="$(head -n 1 <<<"$nums")"
          if [ -n "$num" ]; then
            gh api -X POST "repos/$GH_REPO/issues/$num/comments" -f body="$body" >/dev/null \
              && echo "appended to rolling incident issue #$num" \
              || echo "::warning::could not append to rolling incident issue #$num"
          else
            gh api -X POST "repos/$GH_REPO/issues" -f title="$title" -f body="$body" >/dev/null \
              && echo "opened the rolling incident issue" \
              || echo "::warning::could not open a rolling incident issue"
          fi
