# Adopted into .github/workflows/ by refresh/adopt-refresh.sh from a kendex release checkout, which checks
# selected environment policy and its fixed credential pairs first. Configure only the refresh job's
# with and secrets mappings; adoption keeps them. review-gate references/adoption.md names the accepted mappings.
# Adoption refuses the fixed names in repository or organization Actions secrets:
# outside values could fill a name absent from the protected environment.
# The shared job chooses a complete KENDEX pair, then falls back to FLEET.
# The FLEET pair also supplies upstream issue reporting. The optional
# KENDEX_LAND pair is the landing app, which lands a proved render on the
# default branch with no pull request. The shared job runs
# the refresh from the kendex release the major tag names.
# Opening a pull request needs that repository's app token.
# Auto-merge depends on the published head becoming visible in GitHub.
# review-gate SKILL.md defines the arm outcomes and merge requirements.
# Every consumer publishes change_class and waives product jobs on render.
# The classifier's render proof remains required. Wire consumer CI through
# harness-ci references/wiring.md, Consumer refresh CI, before adoption.
name: Refresh kendex

"on":
  repository_dispatch:
    types: [kendex-refresh]
  schedule:
    - cron: "43 8 * * *"
  workflow_dispatch: {}

jobs:
  # A run held on its selected environment gate never times out, and it holds
  # the refresh group, so every later run queues behind it. The gate has no
  # reviewers and no wait timer, so a run still waiting 30 minutes after its
  # last state change is stuck. This job takes no group; it force-cancels
  # such a run before this run's refresh asks for the group.
  release:
    if: github.repository != 'vanillagreencom/kendex' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: write
      contents: read
      pull-requests: read
    uses: vanillagreencom/kendex/.github/workflows/refresh-release.yml@v1
  refresh:
    needs: release
    if: ${{ success() && needs.release.outputs.route != 'skip' && github.repository != 'vanillagreencom/kendex' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    concurrency:
      group: kendex-refresh
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: vanillagreencom/kendex/.github/workflows/refresh-consumer.yml@v1
    with:
      environment: kendex
    secrets:
      KENDEX_APP_ID: ${{ secrets.KENDEX_APP_ID }}
      KENDEX_APP_PRIVATE_KEY: ${{ secrets.KENDEX_APP_PRIVATE_KEY }}
      FLEET_GH_APP_ID: ${{ secrets.FLEET_GH_APP_ID }}
      FLEET_GH_APP_PRIVATE_KEY: ${{ secrets.FLEET_GH_APP_PRIVATE_KEY }}
      KENDEX_LAND_APP_ID: ${{ secrets.KENDEX_LAND_APP_ID }}
      KENDEX_LAND_APP_PRIVATE_KEY: ${{ secrets.KENDEX_LAND_APP_PRIVATE_KEY }}
