# ─────────────────────────────────────────────────────
# vstack-local.toml — vstack's OWN agent customization
#
# INTERNAL TO THIS REPO. Consumers of vstack should
# ignore this file entirely — you will never have one.
#
# Your project keeps everything in a single tracked
# vstack.toml. This repo needs the split because its
# vstack.toml is the canonical source catalog that every
# consuming repo clones and reads (is_source_catalog =
# true). Writing vstack's own self-install state there
# would mutate the catalog it publishes, so the CLI
# redirects that state here instead — see
# project_config_path() in cli/src/project_config.rs.
#
# Everything below is the ordinary project-config format,
# and is tracked in git like any other config.
#
# Customize agent behavior for this project. These
# settings are merged into generated agent files on
# every install and refresh.
#
# Skills live in [agent-skills]. Generated frontmatter
# overrides like model, effort, deny-tools, color, pane,
# and Claude background/isolation/memory live in
# harness-specific [agent-frontmatter.<harness>] tables.
#
# After editing, run:  vstack refresh
# ─────────────────────────────────────────────────────


