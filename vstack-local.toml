project-management = """
## vstack issue-label taxonomy

Full taxonomy: `docs/issue-label-taxonomy.md` (tracked). It holds the complete
register: every live workspace/team label is either registered there with its role or
listed never-use for this repo — consult it before applying any non-routing label.
Summary:

Labels are flat bare words — no prefix, no parent group — matching memsira and hyprtrade.
`agent:*` is the workspace's only grouped-and-prefixed set. Reuse a workspace label
whenever one covers the case; never create a team-scoped twin of a workspace label.

Every issue on team VST carries one routing label, which a triage rule uses to file the
synced issue into its project:

| Label | Scope | Project |
|-------|-------|---------|
| `cli` | team VST | CLI & Distribution |
| `skills` | team VST | Skills & Agents Library |
| `harness` | team VST | Agent Harness Integrations |
| `ci-infra` | workspace | Review Gate & CI |
| `docs` | workspace | Docs & Onboarding |
| `chore` | workspace | Tech Debt & Bugs |

`vstack report` stamps one automatically on issues filed to the canonical
`vanillagreencom/vstack` (derived from the asset selector, overridable with `--area`);
project-local reports and `--upstream` fork redirects carry none. Hand-filed issues
should carry one too; anything unlabeled stays parked in Linear Triage until a human
or the TPM audit routes it.

A routing label is not a classification: pair it with the type labels (`bug`, `feature`,
`refactor`, `test`, `security`) as usual. Before adding a new one, read the four-step
rollout in the tracked doc — a partial rollout silently drops issues into Triage.
"""

reviewer = ""

second-opinion = ""

worktree = ""


# ── Agent Skills ─────────────────────────────────────
# Skills attached to each agent's frontmatter.
# This is the single source of truth — add or remove
# skills here and run `vstack refresh` to apply.
#
# Populated automatically at install time from source
# mappings. You can freely add your own skills to any
# agent's list (they don't need to be in the vstack
# repo — local skill directories work too).
#
[agent-skills]

# ── Agent Frontmatter ────────────────────────────────
# vstack writes active defaults here for every installed agent.
# Edit fields, then run `vstack refresh` to regenerate harness files.
# Harness-specific entries apply only to that harness.
# Fields: color, model, effort, deny-tools, allowed-subagents,
# pane, background, isolation, memory, mode, sandbox-mode,
# model-reasoning-effort, nickname-candidates.
# Claude background is seeded from Pi pane on first install (pane=true -> false, pane=false -> true), then preserved on refresh.
# Pi allowed-subagents is the restricted delegation allowlist for delegate_subagent (engineer default ['scout']; set [] to disable).
# OpenCode maps colors to hex. Effort values are written verbatim per harness.
#
[agent-frontmatter.claude]
generalist = { color = "green", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = false }

planner = { color = "blue", model = "inherit", effort = "max", deny-tools = ["Agent"], background = false }

researcher = { color = "purple", model = "inherit", effort = "max", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-arch = { color = "yellow", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-correctness = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-doc = { color = "yellow", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-error = { color = "orange", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-perf = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-quality = { color = "purple", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-safety = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-security = { color = "red", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

reviewer-test = { color = "blue", model = "inherit", effort = "xhigh", deny-tools = ["Agent", "AskUserQuestion"], background = true }

rust = { color = "orange", model = "inherit", effort = "max", deny-tools = ["Agent", "AskUserQuestion"], background = false }

